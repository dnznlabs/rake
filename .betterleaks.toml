# Self-contained: never add an extend.path outside this repo.
title = "project"

[extend]
useDefault = true

# Project rules and allowlists below.

# `lib/` is pinned third-party code (forge-std, solady) carrying its own test fixtures: a JWT in
# solady's JSONParserLib test and four WebAuthn vectors. They are not ours to rotate and not secrets.
[allowlist]
description = "Vendored submodules"
paths = ['''^lib/''']
