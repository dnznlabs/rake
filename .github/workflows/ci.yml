name: ci

on:
  push:
  pull_request:

permissions:
  contents: read
  actions: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: devbox
        uses: jetify-com/devbox-install-action@v0.15.0
        with:
          # Pinned to the version devbox.json's $schema names.
          devbox-version: 0.18.0
          enable-cache: true

      - name: cache solc
        uses: actions/cache@v5
        with:
          path: ~/.svm
          key: svm-${{ runner.os }}-${{ hashFiles('foundry.toml') }}

      - name: build — no solc warning, no lint finding
        shell: bash
        env:
          BUILD_LOG: ${{ runner.temp }}/build.log
        run: |
          set -eo pipefail
          devbox run -- forge build --force 2>&1 | tee "$BUILD_LOG"
          # Proves the compile ran before asserting what it did not print.
          grep -q 'Compiler run successful' "$BUILD_LOG"
          ! grep -q 'warning\[' "$BUILD_LOG"
          ! grep -q 'Warning (' "$BUILD_LOG"

      - name: fmt
        run: devbox run -- make fmt

      - name: test
        run: devbox run -- make test

      - name: gas snapshot
        run: devbox run -- forge snapshot --check

      # Last, after `gas snapshot`, and not between `test` and it as m04-t06's plan first ordered:
      # Slither compiles with its own `forge build --build-info --skip ./test/** --force`, which
      # leaves `out/` holding six artifacts and none of the tests'. `forge snapshot --check` reads
      # `out/` and so pays a full recompile if it follows Slither — measured at 13.4 s against the
      # 0.3 s it takes behind `test`. Correctness is unaffected either way: forge rebuilds what is
      # missing, and `forge snapshot --check` exits 0 straight after a Slither run. This is wall
      # time only, which is why the step is ordered rather than guarded.
      - name: slither
        run: devbox run -- make slither

      - name: working tree clean
        shell: bash
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            exit 1
          fi
