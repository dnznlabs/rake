name: ci

# Not on a change that touches only Markdown: nothing the suite tests can have moved, and a plan or a
# status row should not cost a full run. A change that touches any other file, under docs/ included,
# runs as before.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
    paths-ignore: ["**.md"]

# One run per change. A push to a branch with an open pull request used to start two identical runs,
# one per event; branches now run through their pull request only. A newer push to a pull request
# cancels the run it supersedes; runs on main are never cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: devbox
        uses: jetify-com/devbox-install-action@v0.15.0
        with:
          # Pinned to the version devbox.json's $schema names.
          devbox-version: 0.18.0
          enable-cache: true

      - name: cache pre-commit
        uses: actions/cache@v5
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      # betterleaks lives in .pre-commit-config.yaml; running it here makes the scan independent of
      # whether a clone ever ran `pre-commit install`. The `betterleaks-tree` alias is the one that
      # scans the tree: the commit-time hook is `betterleaks git --staged`, which under --all-files
      # has no staged diff and reports "scanned ~0 bytes" while passing whatever the tree holds.
      # Whole tree, not the diff, because the net may have been absent for earlier commits.
      - name: secrets — betterleaks over the whole tree
        shell: bash
        env:
          LEAK_LOG: ${{ runner.temp }}/leaks.log
        run: |
          set -eo pipefail
          devbox run -- pre-commit run betterleaks-tree --hook-stage manual --all-files --verbose 2>&1 | tee "$LEAK_LOG"
          # A scan of nothing passes. Assert it read the tree before trusting the result.
          grep -qE 'scanned ~[1-9][0-9]{5,} bytes' "$LEAK_LOG" \
            || { echo "secrets: the scan read almost nothing — the gate is not measuring the tree"; exit 1; }

      - name: cache solc
        uses: actions/cache@v5
        with:
          path: ~/.svm
          key: svm-${{ runner.os }}-${{ hashFiles('foundry.toml') }}

      - name: build — no solc warning, no lint finding
        shell: bash
        env:
          BUILD_LOG: ${{ runner.temp }}/build.log
        run: |
          set -eo pipefail
          devbox run -- forge build --force 2>&1 | tee "$BUILD_LOG"
          # Proves the compile ran before asserting what it did not print.
          grep -q 'Compiler run successful' "$BUILD_LOG"
          ! grep -q 'warning\[' "$BUILD_LOG"
          ! grep -q 'Warning (' "$BUILD_LOG"

      - name: fmt
        run: devbox run -- make fmt

      - name: test
        run: devbox run -- make test

      - name: gas snapshot
        run: devbox run -- forge snapshot --check

      # After `gas snapshot` for the same reason Slither is ordered last: `forge coverage
      # --ir-minimum` recompiles the whole tree at minimal optimisation with per-line counters, so
      # anything that reads `out/` behind it pays a full rebuild. It is placed before Slither
      # rather than after only because Slither rebuilds `out/` anyway, so the two cannot both be
      # free and this one is the cheaper of the pair to put first.
      - name: coverage
        run: devbox run -- make coverage

      # Last, after `gas snapshot`, and not between `test` and it as m04-t06's plan first ordered:
      # Slither compiles with its own `forge build --build-info --skip ./test/** --force`, which
      # leaves `out/` holding six artifacts and none of the tests'. `forge snapshot --check` reads
      # `out/` and so pays a full recompile if it follows Slither — measured at 13.4 s against the
      # 0.3 s it takes behind `test`. Correctness is unaffected either way: forge rebuilds what is
      # missing, and `forge snapshot --check` exits 0 straight after a Slither run. This is wall
      # time only, which is why the step is ordered rather than guarded.
      - name: slither
        run: devbox run -- make slither

      - name: working tree clean
        shell: bash
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            exit 1
          fi
