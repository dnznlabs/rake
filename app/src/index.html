<script>
/* Everything this script draws is styled by class alone: theme.css and layout.html are the design,
   and replacing those two files reskins the app without touching this one.
   Addresses and the chain are substituted by app/build.mjs; a deployed contract's token is its name,
   uppercased, between double underscores. DEV-fenced blocks are stripped unless the build is --dev. */
/* `featuredSalt` is the dev chain's seeded distribution, as a salt and never as an address: the
   address is `factory.predict(salt)`, which the page reads at boot rather than carrying a token per
   chain. `factoryBlock` is the block the factory was created in, so a `Created` scan never starts at
   genesis on a real chain. */
const CFG = { chainId: '__CHAIN_ID__', version: '__VERSION__', factory: '__DISTRIBUTIONFACTORY__', factoryBlock: '__DISTRIBUTIONFACTORY_BLOCK__', featuredSalt: '__FEATURED_SALT__' };
const CONTRACTS = [['DistributionFactory', CFG.factory]];
const CHAINS = { 1: 'mainnet', 10: 'op mainnet', 8453: 'base', 42161: 'arbitrum', 11155111: 'sepolia', 84532: 'base sepolia', 31337: 'anvil', 31338: 'anvil-b' };
/* A dev chain has no explorer, so `ext()` prints plain text with the full value in the title. */
const EXPLORER = { 1: 'https://etherscan.io', 10: 'https://optimistic.etherscan.io', 8453: 'https://basescan.org', 42161: 'https://arbiscan.io', 11155111: 'https://sepolia.etherscan.io', 84532: 'https://sepolia.basescan.org' };
const ZERO = '0x' + '0'.repeat(40);
/*DEV*/
const Q = new URLSearchParams(location.search);
/*DEV*/
document.getElementById('ver').textContent = `dnzn labs · ${CFG.version}`;

/* ---- provider ------------------------------------------------------------------------------ */
let P = null, ACC = null, CHAIN = null;
/*DEV*/
const rpcProvider = url => ({
  request: async ({ method, params }) => {
    const r = await fetch(url, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ jsonrpc: '2.0', id: 1, method, params }) });
    const j = await r.json(); if (j.error) throw j.error; return j.result;
  }
});
/*DEV*/
async function discover() {
  /*DEV*/
  if (Q.get('rpc')) { P = rpcProvider(Q.get('rpc')); ACC = Q.get('from') || null; return; }
  /*DEV*/
  const found = [];
  addEventListener('eip6963:announceProvider', e => found.push(e.detail));
  dispatchEvent(new Event('eip6963:requestProvider'));
  await new Promise(r => setTimeout(r, 150));
  P = (found[0] && found[0].provider) || window.ethereum || null;
  if (!P) return;
  try { const a = await P.request({ method: 'eth_accounts' }); ACC = a[0] || null; } catch (e) {}
  if (P.on) { P.on('accountsChanged', a => { ACC = a[0] || null; who(); route(); }); P.on('chainChanged', () => location.reload()); }
}
async function connect() { const a = await P.request({ method: 'eth_requestAccounts' }); ACC = a[0] || null; who(); route(); }
// Wallets keep a network per site, so the extension's own picker may not move this page; asking does.
// A successful switch lands in the chainChanged reload.
async function switchChain() {
  try { await P.request({ method: 'wallet_switchEthereumChain', params: [{ chainId: '0x' + Number(CFG.chainId).toString(16) }] }); }
  catch (e) {
    if (e && e.code === 4001) return;
    nm.hidden = false;
    nm.lastElementChild.textContent = e && e.code === 4902 ? `your wallet doesn't know ${cname(CFG.chainId)} — add it there first` : 'the wallet refused the switch';
  }
}
// Revoking (EIP-2255) is what survives a reload; a wallet without it hands the account back next load.
async function disconnect() {
  try { await P.request({ method: 'wallet_revokePermissions', params: [{ eth_accounts: {} }] }); } catch (e) {}
  ACC = null; who(); route();
}
const call = async (to, sig, args, types) => Eth.dec(types, await P.request({ method: 'eth_call', params: [{ to, data: Eth.enc(sig, args) }, 'latest'] }));
const sleep = ms => new Promise(r => setTimeout(r, ms));
// A deadline, not a failure: a timed-out transaction may still land. POLL_ERR tells a dead RPC from a slow block.
const POLL_MS = 120000;
let POLL_ERR = null;
async function waitReceipt(hash, ms) {
  POLL_ERR = null;
  const end = Date.now() + ms;
  while (Date.now() < end) {
    try { const rc = await P.request({ method: 'eth_getTransactionReceipt', params: [hash] }); if (rc) return rc; POLL_ERR = null; } catch (e) { POLL_ERR = e; }
    await sleep(1500);
  }
  return null;
}
/* ---- one write ------------------------------------------------------------------------------ */
/* Every write this page sends goes through here, so they all behave alike: preflight with `eth_call`
   on exactly the transaction about to be sent — a revert is then a sentence, not a failed transaction
   the user paid for — then send, then wait for the receipt and read its status. `label` is what the
   status line calls the write; the line itself is `#txs`, which every view that writes puts in place. */
const txSay = (label, text, cls) => { const el = document.getElementById('txs'); if (el) el.innerHTML = `<div class="status${cls ? ' ' + cls : ''}">${label} · ${text}</div>`; };
async function tx(to, sig, args, opts) {
  const o = opts || {}, label = o.label || sig.slice(0, sig.indexOf('('));
  const params = { from: ACC, to, data: Eth.enc(sig, args), ...(o.value ? { value: '0x' + BigInt(o.value).toString(16) } : {}) };
  txSay(label, 'checking the call against the chain…');
  try { await P.request({ method: 'eth_call', params: [params, 'latest'] }); }
  catch (e) { const text = txError(e); txSay(label, text, 'bad'); return { ok: false, stage: 'preflight', text }; }
  let hash;
  try { hash = await P.request({ method: 'eth_sendTransaction', params: [params] }); }
  catch (e) { const text = txError(e); txSay(label, text, 'bad'); return { ok: false, stage: 'send', text }; }
  txSay(label, `sent · waiting for the block · ${ext('tx', hash, short(hash))}`);
  // A deadline, not a failure: a timed-out transaction may still land, so nothing here says it did not.
  const rc = await waitReceipt(hash, POLL_MS);
  if (!rc) {
    const text = `no receipt after ${POLL_MS / 1000}s — it may still land${POLL_ERR ? ` · last poll errored: ${esc(POLL_ERR.message || String(POLL_ERR))}` : ''}`;
    txSay(label, `${text} · ${ext('tx', hash, short(hash))}`, 'warn');
    return { ok: false, stage: 'pending', hash, text };
  }
  if (rc.status !== '0x1') { txSay(label, `reverted · ${ext('tx', hash, short(hash))}`, 'bad'); return { ok: false, stage: 'reverted', hash, text: 'reverted' }; }
  txSay(label, `landed in block ${parseInt(rc.blockNumber, 16)} · ${ext('tx', hash, short(hash))}`);
  return { ok: true, hash, receipt: rc };
}
/* Where the revert bytes sit depends on the provider, and the page has to read both shapes. The dev
   `rpcProvider` throws the JSON-RPC `error` object itself, so they are at `error.data` — measured on
   anvil 2026-10-11, where `eth_call` answers a non-owner `cancel` with
   `{"code":3,"message":"execution reverted: custom error 0x30cd7471","data":"0x30cd7471"}`. A
   MetaMask-class wallet wraps the same object one deeper. 4001 is the user, not the chain. */
function txError(e) {
  if (e && e.code === 4001) return 'rejected in wallet';
  const d = typeof (e && e.data) === 'string' ? e.data : e && e.data && e.data.data;
  return esc(Model.revertMessage(d, secs()));
}
/* `navigator.clipboard` is missing on an insecure origin and can be refused on a secure one, so the
   calldata is never only in the clipboard: the fallback is a textarea, selected, for a manual copy. */
async function copyCalldata(data, slot) {
  try { await navigator.clipboard.writeText(data); slot.innerHTML = `<div class="status">copied · ${data.length / 2 - 1} bytes</div>`; return; }
  catch (e) {}
  slot.innerHTML = `<textarea class="cd" readonly rows="3" aria-label="calldata">${esc(data)}</textarea><div class="status">clipboard refused — select all and copy</div>`;
  const ta = slot.querySelector('textarea');
  ta.focus(); ta.select();
}

// An event topic is the whole keccak of the signature, not the four-byte selector a call carries.
const topic = sig => '0x' + Eth.keccak(Eth.utf8(sig));
const word = a => '0x' + Eth.pad(a);
const logs = (address, topics, fromBlock) => P.request({ method: 'eth_getLogs', params: [{ address, topics, fromBlock, toBlock: 'latest' }] });

/* ---- text ---------------------------------------------------------------------------------- */
// Descriptions, names and notes are whatever the chain was given, so every one of them is escaped.
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const short = a => a ? a.slice(0, 6) + '…' + a.slice(-4) : '';
const cname = id => CHAINS[id] || 'chain ' + id;
const wrongChain = () => !!CHAIN && String(CHAIN) !== String(CFG.chainId);
// Four decimals, truncated: this is a balance to read, not an amount to settle against.
const amt = w => { const s = (BigInt(w) / 100000000000000n).toString().padStart(5, '0'); return s.slice(0, -4) + '.' + s.slice(-4); };
/* The clock a timelock is compared against is the chain's, not the browser's: `applyQueued` tests
   `block.timestamp`. On a real chain the two agree to within a block; on a dev chain that has been
   moved forward they do not, and a countdown read from the wrong one keeps `apply` disabled on an
   entry the chain would accept — or offers it on one it would refuse. So the page anchors to the
   latest block's timestamp and ticks forward from there, and falls back to the browser only before
   the first block has been read. */
let CLOCK = null;
const secs = () => CLOCK ? CLOCK.t + Math.floor((Date.now() - CLOCK.at) / 1000) : Math.floor(Date.now() / 1000);
async function readClock() {
  const b = await P.request({ method: 'eth_getBlockByNumber', params: ['latest', false] });
  CLOCK = { t: parseInt(b.timestamp, 16), at: Date.now() };
}
const isAddr = v => /^0x[0-9a-fA-F]{40}$/.test(v);
// Every address and tx hash the page prints goes through here: a link where the chain has an
// explorer, plain text with the full value in the title elsewhere. An address also carries its own
// value in `data-addr`, which is what lets `nameSweep` replace the ones that have a name in place.
const ext = (kind, v, text) => {
  const known = kind === 'address' ? NAMED.get(String(v).toLowerCase()) : null;
  const body = known ? esc(known) : text, mark = kind === 'address' ? ` data-addr="${v}"` : '';
  return EXPLORER[CFG.chainId]
    ? `<a href="${EXPLORER[CFG.chainId]}/${kind}/${v}" target="_blank" rel="noopener" title="${v}"${mark}>${body}</a>`
    : `<span title="${v}"${mark}>${body}</span>`;
};
// localStorage throws in a sandboxed frame, so every access is guarded and a failure means no history.
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
const recents = () => { try { const r = JSON.parse(store.get('rake.recent') || '[]'); return Array.isArray(r) ? r.filter(isAddr) : []; } catch (e) { return []; } };
const addRecent = a => store.set('rake.recent', JSON.stringify([a, ...recents().filter(x => x !== a)].slice(0, 8)));

/* ---- names ---------------------------------------------------------------------------------- */
/* Ported from state-collection `app/src/index.html:224-279`, which took it from its own
   `tools/names-probe.mjs` — the reference implementation and the oracle, not re-derived here. GNS and
   WNS answer the same selectors with the same semantics and differ only by address, so they are one
   path; ENS is the other.

   This array's order IS the priority order, and it is decision 13: ENS → WNS → GNS, winner alone, no
   ambiguity marker. Reordering it changes which name a colliding address shows, so it is a product
   decision and not a style edit. Nothing here is exercised on a dev chain: anvil has no registries,
   and M04 is where this meets one (decision 13). */
const NAMES = [
  { id: 'ens', at: '0x00000000000C2E074eC69A0dFb2997BA6C7d2e1e' },
  { id: 'wns', at: '0x0000000000696760E15f265e828DB644A0c242EB' },
  { id: 'gns', at: '0x9D51D507BC7264d4fE8Ad1cf7Fe191933A0a81d6' },
];
const NAMED = new Map();                 // lowercased address → name or null; a reconnect costs nothing
const same = (a, b) => a && b && String(a).toLowerCase() === String(b).toLowerCase();
/* A reverse record is a claim by whoever set it until the forward record agrees, so every name this
   page shows is forward-confirmed. Printing someone else's name is the only failure worse than
   printing a short address. Both paths return null rather than an unconfirmed name. */
async function ensName(acc) {
  const at = NAMES[0].at, node = Model.namehash(acc.slice(2).toLowerCase() + '.addr.reverse');
  const [res] = await call(at, 'resolver(bytes32)', [node], ['address']);
  if (res === ZERO) return null;
  const [name] = await call(res, 'name(bytes32)', [node], ['string']);
  if (!name) return null;
  const f = Model.namehash(name);
  const [fres] = await call(at, 'resolver(bytes32)', [f], ['address']);
  if (fres === ZERO) return null;        // offchain / CCIP-read names land here by design
  const [owner] = await call(fres, 'addr(bytes32)', [f], ['address']);
  return same(owner, acc) ? name : null;
}
async function regName(reg, acc) {
  const [name] = await call(reg.at, 'reverseResolve(address)', [acc], ['string']);
  if (!name) return null;                // an absent record and an address with no code both decode to ''
  // computeId(string) is the one call that cannot go through Eth.enc: Eth.pad does BigInt(v) on every
  // argument and throws on a string. Hand-built, as the probe builds it.
  const u = Eth.utf8(name), body = [...u].map(x => x.toString(16).padStart(2, '0')).join('');
  const data = '0x' + Eth.sel('computeId(string)') + Eth.pad(32) + Eth.pad(u.length) + body.padEnd(Math.ceil(u.length / 32) * 64, '0');
  const [id] = Eth.dec(['uint256'], await P.request({ method: 'eth_call', params: [{ to: reg.at, data }, 'latest'] }));
  const [owner] = await call(reg.at, 'resolve(uint256)', [id], ['address']);
  return same(owner, acc) ? name : null;
}
/* `call` goes through `P`, so this reads whichever chain the WALLET is on — CHAIN, not CFG.chainId.
   Only mainnet and Sepolia can answer, and anvil must spend no round trips. A registry absent from a
   chain returns 0x, which the string decode already reads as "no record", so no per-chain table. */
async function resolveName(acc) {
  if (CHAIN !== 1 && CHAIN !== 11155111) return null;
  for (const reg of NAMES) {
    try { const n = reg.id === 'ens' ? await ensName(acc) : await regName(reg, acc); if (n) return n; } catch (e) {}
  }
  return null;
}
/* Reverse display, in place. Every address the page printed went through `ext`, which marked it, so
   one pass after the paint replaces the ones that have a name without re-rendering anything and
   without any view having to know that names exist. On anvil `resolveName` returns before it asks. */
async function nameSweep() {
  const marked = [...document.querySelectorAll('[data-addr]')];
  const fresh = [...new Set(marked.map(n => n.dataset.addr.toLowerCase()))].filter(a => !NAMED.has(a));
  await Promise.all(fresh.map(async a => { NAMED.set(a, null); NAMED.set(a, await resolveName(a)); }));
  for (const n of marked) { const name = NAMED.get(n.dataset.addr.toLowerCase()); if (name) n.textContent = name; }
}
/* Forward (name → address), for every field that takes one: the ENS registry's own resolver, then its
   `addr`, under the same gate. Elsewhere it answers null and the field says where names work. */
async function resolveAddr(name) {
  if (CHAIN !== 1 && CHAIN !== 11155111) return null;
  try {
    const node = Model.namehash(String(name).trim().toLowerCase());
    const [res] = await call(NAMES[0].at, 'resolver(bytes32)', [node], ['address']);
    if (res === ZERO) return null;
    const [a] = await call(res, 'addr(bytes32)', [node], ['address']);
    return a === ZERO ? null : a;
  } catch (e) { return null; }
}
/* One address field, wherever one appears: a raw address stands, a name is looked up where a registry
   can answer, and anywhere else the field says so rather than silently failing. Returns the address or
   null, and writes the field's own one-line state into `res`. */
async function addrField(value, res) {
  const v = String(value || '').trim();
  if (isAddr(v)) { if (res) res.textContent = ''; return Eth.checksum(v); }
  if (!v) { if (res) res.textContent = ''; return null; }
  if (CHAIN !== 1 && CHAIN !== 11155111) { if (res) res.textContent = 'names resolve on mainnet and Sepolia'; return null; }
  if (res) res.textContent = 'resolving…';
  const a = await resolveAddr(v);
  if (res) res.textContent = a ? '→ ' + short(a) : 'no such name';
  return a;
}
/* Every progressive fill goes through here, so a line that arrives after the first paint gets its
   reverse names too without each caller remembering to ask. */
function fill(id, html) { const el = document.getElementById(id); if (el) { el.innerHTML = html; nameSweep(); } }

/* ---- header --------------------------------------------------------------------------------- */
function who() {
  const b = document.getElementById('who');
  b.textContent = ACC ? short(ACC) : 'connect';
  b.title = ACC || '';
  b.onclick = !P ? null : ACC ? e => { e.stopPropagation(); toggle(wm); } : connect;
  if (!ACC) wm.hidden = true;
  const pill = document.getElementById('net'), wrong = wrongChain();
  document.getElementById('netname').textContent = CHAIN ? cname(CHAIN) : cname(CFG.chainId);
  nm.innerHTML = `<div class="k">This app lives on ${cname(CFG.chainId)}. Reads and transactions go through your wallet, so it has to be on the same network.</div>`
    + `<div class="k">wallet: ${CHAIN ? cname(CHAIN) : 'none'}</div>`
    + (wrong ? `<div data-a="switch">switch wallet to ${cname(CFG.chainId)}</div>` : '');
  pill.classList.toggle('warn', wrong);
  pill.title = wrong ? `expected ${cname(CFG.chainId)}` : '';
}

/* ---- reading the chain ---------------------------------------------------------------------- */
const S = { featured: null, loaded: false, error: null, tab: 'recent' };
async function load() {
  CHAIN = parseInt(await P.request({ method: 'eth_chainId' }), 16);
  // The same address on another network is another contract, or none: do not read it.
  if (wrongChain()) return;
  await readClock();
  // Read once at boot: the featured distribution is a salt in the build, never an address.
  const [a] = await call(CFG.factory, 'predict(bytes32)', [CFG.featuredSalt], ['address']);
  S.featured = a; S.loaded = true;
}

/* One distribution, in three reads: code first, so an address with nothing on it is "could not read"
   rather than a decode error; then the snapshot; then the two numbers behind "waiting to distribute".
   ETH only in v1 — a token balance needs a token list, which the chain does not carry. */
async function loadDistro(addr) {
  const code = await P.request({ method: 'eth_getCode', params: [addr, 'latest'] });
  if (!code || code === '0x') return { addr, missing: true };
  const [snap] = Eth.dec([Model.SNAPSHOT_T], await P.request({ method: 'eth_call', params: [{ to: addr, data: Eth.enc('snapshot()', []) }, 'latest'] }));
  const [reserved, balance] = await Promise.all([
    call(addr, 'reserved(address)', [ZERO], ['uint256']),
    P.request({ method: 'eth_getBalance', params: [addr, 'latest'] }),
  ]);
  const [owner, delay, nonce, description, table, pending] = snap;
  const waiting = BigInt(balance) - reserved[0];
  return { addr, owner, delay, nonce, description, table, pending, waiting: waiting > 0n ? waiting : 0n };
}

/* The histories, as two log queries with their topic0s OR'd. `from` is the distribution's own first
   block when the `Created` scan found it, else the factory's — never genesis. */
const CHANGE_EVENTS = [['Queued(bytes32,uint32,uint256,bytes)', 'queued'], ['Applied(bytes32)', 'applied'], ['Cancelled(bytes32)', 'cancelled']];
const FUND_EVENTS = [['Received(address,uint256)', 'in'], ['Distributed(address,uint256)', 'distributed'], ['Escrowed(address,address,uint256)', 'escrowed'], ['Released(address,address,uint256)', 'released']];
/* Filled by the `Created` scan: a distribution's own first block, which is a better `fromBlock` than
   the factory's for anything created long after it. */
const FIRST = new Map();
const KINDS = new Map([...CHANGE_EVENTS, ...FUND_EVENTS].map(([sig, kind]) => [topic(sig), kind]));
async function history(addr, from) {
  const pick = set => logs(addr, [set.map(([sig]) => topic(sig))], from);
  const [changes, funds] = await Promise.all([pick(CHANGE_EVENTS), pick(FUND_EVENTS)]);
  return { changes: changes.map(entry).sort(newest), funds: funds.map(entry).sort(newest) };
}
const newest = (a, b) => b.block - a.block || b.index - a.index;
/* One log as the line it prints. An unknown topic0 cannot reach here: the query asked for these. */
function entry(log) {
  const kind = KINDS.get(log.topics[0]), block = parseInt(log.blockNumber, 16), index = parseInt(log.logIndex, 16);
  const at = t => Eth.dec(['address'], log.topics[t])[0];
  const e = { kind, block, index, what: '' };
  if (kind === 'queued') {
    const [nonce, eta, action] = Eth.dec(['uint32', 'uint256', 'bytes'], log.data);
    // The `uint32 nonce` `applyQueued` takes: `snapshot()`'s struct does not carry it, this log does.
    e.hash = log.topics[1]; e.nonce = Number(nonce);
    e.what = `${describe(Model.decodePending(action))} · nonce ${nonce} · ${Model.countdown(eta, secs())}`;
  } else if (kind === 'applied' || kind === 'cancelled') {
    e.hash = log.topics[1];
    e.what = short(log.topics[1]);
  } else if (kind === 'in') {
    e.what = `${amt(log.data)} ETH from ${esc(short(at(1)))}`;
  } else if (kind === 'distributed') {
    e.token = at(1);
    e.what = `${amt(log.data)} ${token(e.token)} by the table`;
  } else {
    // `Escrowed` and `Released` both index the token then the account, which is the token list and the
    // escrow list the funds block reads: nothing on chain carries either one.
    e.token = at(1); e.account = at(2);
    e.what = `${amt(log.data)} ${token(e.token)} · ${esc(short(e.account))}`;
  }
  return e;
}
const token = a => a === ZERO ? 'ETH' : short(a);
/* A decoded pending action as one line, named by the setter it calls. `setBeneficiaries` is also
   drawn as a second bar; the other three say everything they do here. */
function describe(p) {
  if (p.kind === 'setBeneficiaries') return `${p.kind} · new table · ${p.table.map(b => Model.pct(b[1])).join(' / ')}`;
  if (p.kind === 'setDescription') return `${p.kind} · new name · ${esc(p.description)}`;
  if (p.kind === 'setDelay') return `${p.kind} · new delay · ${delayText(p.delay)}`;
  if (p.kind === 'transferOwnership') return p.owner === ZERO ? `${p.kind} · renounced · nothing can be proposed again` : `${p.kind} · new owner · ${esc(short(p.owner))}`;
  return 'unknown action · selector ' + esc(p.selector);
}
const delayText = d => Number(d) === 0 ? 'none — changes apply instantly' : Number(d) % 86400 === 0 ? Number(d) / 86400 + 'd' : Math.round(Number(d) / 3600) + 'h';

/* ---- the bar, the ledger, the lines ---------------------------------------------------------- */
const V = document.getElementById('view');
const basis = bps => (Number(bps) / 100) + '%';
const rest = table => 10000 - table.reduce((s, b) => s + Number(b[1]), 0);
/* The signature element. Three tints cycle, so a fourth row restarts at the first; an unassigned
   remainder (which a valid table never has) is hatched rather than dropped. */
function bar(table, opts) {
  const o = opts || {};
  const segs = table.map((b, i) => `<div class="seg s${i % 3}" style="flex-basis:${basis(b[1])}" title="${esc(b[2])} ${Model.pct(b[1])}"></div>`);
  const left = rest(table);
  if (left > 0) segs.push(`<div class="seg rest" style="flex-basis:${basis(left)}" title="unassigned ${Model.pct(left)}"></div>`);
  return `<div class="bar${o.pending ? ' pending' : o.small ? ' sm' : ''}">${segs.join('')}</div>`;
}
/* The bar's own labels: the share and the name, aligned under the segment. Notes and addresses are
   the ledger's job, so the two readings of one table do not repeat each other. */
function ticks(table, opts) {
  const o = opts || {};
  const cols = table.map(b => `<div class="tick" style="flex-basis:${basis(b[1])}"><b>${Model.pct(b[1])}</b> <span class="nm">${esc(b[2])}</span></div>`);
  const left = rest(table);
  if (left > 0 && !o.pending) cols.push(`<div class="tick" style="flex-basis:${basis(left)}"><b>${Model.pct(left)}</b></div>`);
  return `<div class="ticks${o.pending ? ' pending' : ''}">${cols.join('')}</div>`;
}
const mini = table => `<span class="mini">${table.map((b, i) => `<span class="seg s${i % 3}" style="flex-basis:${basis(b[1])}"></span>`).join('')}</span>`;
const ledger = table => `<div class="ledger">${table.map(b => row(`${esc(b[2])}${b[3] ? `<span class="nt"> — ${esc(b[3])}</span>` : ''}`, ext('address', b[0], esc(short(b[0]))), Model.pct(b[1]))).join('')}</div>`;
const row = (k, sub, n, cls) => `<div class="row${cls ? ' ' + cls : ''}"><div><b>${k}</b>${sub ? `<div class="sub">${sub}</div>` : ''}</div><div class="n">${n}</div></div>`;
const histRows = items => `<div class="hist">${items.map(e => `<div class="hrow${e.kind === 'escrowed' ? ' err' : e.kind === 'queued' ? ' amber' : ''}"><b>${e.kind}</b><span class="w">${e.what}</span><span class="t">block ${e.block}</span></div>`).join('')}</div>`;
const eyebrow = (text, cls) => `<div class="eyebrow${cls ? ' ' + cls : ''}">${text}</div>`;
const notice = (text, cls) => `<div class="notice${cls ? ' ' + cls : ''}">${text}</div>`;
const unreadable = addr => notice(`could not read a distribution at ${esc(short(addr))} on ${cname(CFG.chainId)} — nothing is deployed there.`, 'err');

/* Owner, delay and the balance behind `distribute`. Writing it is t03; reading it is this task. */
const meta = d => `<div class="meta"><div><div class="k">owner</div><div class="v">${d.owner === ZERO ? 'renounced' : ext('address', d.owner, esc(short(d.owner)))}${ACC && d.owner.toLowerCase() === ACC.toLowerCase() ? ' · you' : ''}</div></div>`
  + `<div><div class="k">delay</div><div class="v${Number(d.delay) ? '' : ' amber'}">${delayText(d.delay)}</div></div>`
  + `<div><div class="k">waiting to distribute</div><div class="v">${amt(d.waiting)} ETH</div></div></div>`;

/* The pending block: a queued table as a second bar in the pending style, the other three setters as
   one line each, an action this build does not know as its selector. With `acts`, each row also
   carries what can be done to it — which is the detail page only; the landing is a reading. */
function pendingBlock(d, acts) {
  return d.pending.map((p, i) => {
    const decoded = Model.decodePending(p[2]);
    const head = eyebrow(`change queued · ${Model.countdown(p[1], secs())}`, 'amber') + `<div class="status warn">${describe(decoded)}</div>`;
    const body = decoded.kind === 'setBeneficiaries' ? bar(decoded.table, { pending: true }) + ticks(decoded.table, { pending: true }) : '';
    return head + body + (acts ? pendingActs(d, p, i) : '');
  }).join('');
}
/* `cancel(bytes32)` takes the hash straight from the struct, and is the owner's and immediate — the
   delay guards applying, not cancelling. `applyQueued(bytes,uint32)` also needs the nonce, which the
   struct does not carry and that entry's `Queued` log does. Until the log has arrived the apply button
   says which reading it is waiting on and stays disabled: a guessed nonce is a different hash, and
   would revert `NotReady(0)`. */
function pendingActs(d, p, i) {
  const nonce = DS.nonces ? DS.nonces.get(p[0]) : undefined;
  const apply = nonce === undefined
    ? `<button class="btn off sm" disabled>apply</button><span class="status${DS.failed ? ' bad' : ''}">`
      + `${DS.failed ? 'history unavailable — apply needs the queue log' : 'reading the queue log — apply needs the nonce it carries'}</span>`
    : Model.countdown(p[1], secs()) === 'ready to apply'
      ? sctl(`apply:${i}`, 'apply', { to: d.addr, sig: 'applyQueued(bytes,uint32)', args: () => [p[2], nonce], label: 'applyQueued' })
        + '<span class="status">the delay has passed — anyone can land it</span>'
      : '<button class="btn off sm" disabled>apply</button><span class="status">anyone can apply once the delay passes</span>';
  const cancel = VIEW === 'visitor' ? ''
    : wctl(`cancel:${i}`, 'cancel', { to: d.addr, sig: 'cancel(bytes32)', args: () => [p[0]], label: 'cancel' })
      + '<span class="status">cancel is owner-only and immediate</span>';
  return `<div class="acts">${cancel}${apply}</div>`;
}

/* ---- the table editor ------------------------------------------------------------------------ */
/* One component, twice: create's step 2 and the propose drawer are the same rows, the same live bar,
   the same sum line and the same one-line reason the submit is disabled. The rows live on whichever
   draft the caller owns, so an editor never holds state of its own. */
const EMPTY_ROW = () => ({ name: '', note: '', addr: '', pct: '' });
const SET_BENEFICIARIES = 'setBeneficiaries((address,uint96,string,string)[])';
const rowsFrom = table => table.map(b => ({ name: b[2], note: b[3], addr: b[0], pct: String(Number(b[1]) / 100) }));
/* The live bar draws the rows in the order they are on screen, with no address: `bar` and `ticks` read
   the share and the name only, and a half-typed address must not stop the preview from painting. */
const barRows = rows => rows.filter(r => (parseFloat(r.pct) || 0) > 0).map(r => [ZERO, Math.round((parseFloat(r.pct) || 0) * 100), r.name, r.note]);
const pctTotal = rows => rows.reduce((s, r) => s + (parseFloat(r.pct) || 0), 0);
/* Valid means the contract will take it. The first two refusals are the prototype's; the third is
   here because `propose` does not validate the action it queues — a table with a duplicate account or
   a zero share queues happily and then reverts `BadTable` on apply, where it stays stuck for the
   whole delay with only a cancel to clear it. The sort is stated rather than performed on screen:
   silently reordering a table someone is typing is worse than saying which order it goes in. */
function editorState(rows) {
  const total = pctTotal(rows), off = Math.round((100 - total) * 100) / 100;
  if (Math.abs(off) >= 0.005) return { ok: false, total, why: `total must equal 100% — ${Math.abs(off)}% ${off > 0 ? 'unassigned' : 'over'}` };
  if (!rows.every(r => r.name.trim() && isAddr(r.addr))) return { ok: false, total, why: 'every row needs a name and address' };
  const seen = new Set(rows.map(r => r.addr.toLowerCase()));
  if (seen.size !== rows.length) return { ok: false, total, why: 'two rows cannot share an address — the contract refuses that table' };
  if (rows.some(r => Math.round((parseFloat(r.pct) || 0) * 100) === 0)) return { ok: false, total, why: 'every row needs a share above zero — the contract refuses that table' };
  return { ok: true, total, why: 'sent ascending by address — the only order the contract accepts' };
}
function editorHTML(rows) {
  return `<div id="ed-bar"></div><div class="erows">`
    + rows.map((r, i) => `<div class="erow">`
      + `<input aria-label="name" data-ed="name" data-i="${i}" value="${esc(r.name)}" placeholder="name">`
      + `<input aria-label="note" class="note-in" data-ed="note" data-i="${i}" value="${esc(r.note)}" placeholder="note (prose)">`
      + `<div><input aria-label="address or name" data-ed="addr" data-i="${i}" value="${esc(r.addr)}" placeholder="0x… or a name"><div class="res" data-edres="${i}"></div></div>`
      + `<input aria-label="percent" class="bps" data-ed="pct" data-i="${i}" value="${esc(r.pct)}" inputmode="decimal">`
      + `<button class="rm" data-edrm="${i}" title="remove" aria-label="remove this row">×</button></div>`).join('')
    + `</div><div class="sum"><button class="link" data-edadd="1">+ add a beneficiary</button><span id="ed-sum"></span></div>`;
}
/* Typing repaints the bar and the sum, never the rows: an input the caret is in must not be replaced.
   Adding or removing a row changes the row count, so that goes back through the caller's `redraw`. */
function editorPaint(rows) {
  const st = editorState(rows), preview = barRows(rows);
  const el = document.getElementById('ed-bar');
  if (el) el.innerHTML = bar(preview, {}) + ticks(preview, {});
  const sum = document.getElementById('ed-sum');
  if (sum) { sum.className = st.ok ? 'ok' : 'bad'; sum.innerHTML = `${rows.length} beneficiar${rows.length === 1 ? 'y' : 'ies'} · total <b>${+st.total.toFixed(2)}%</b>`; }
  return st;
}
function editorBind(rows, redraw, after) {
  V.querySelectorAll('[data-ed]').forEach(inp => {
    inp.oninput = () => { rows[+inp.dataset.i][inp.dataset.ed] = inp.value; after(editorPaint(rows)); };
    // The name lookup waits for the field to be left: one request per address, not one per keystroke.
    if (inp.dataset.ed === 'addr') inp.onchange = async () => {
      const a = await addrField(inp.value, V.querySelector(`[data-edres="${inp.dataset.i}"]`));
      if (a) { rows[+inp.dataset.i].addr = a; inp.value = a; }
      after(editorPaint(rows));
    };
  });
  V.querySelectorAll('[data-edrm]').forEach(b => { b.onclick = () => { if (rows.length > 1) { rows.splice(+b.dataset.edrm, 1); redraw(); } }; });
  const add = V.querySelector('[data-edadd]');
  if (add) add.onclick = () => { rows.push(EMPTY_ROW()); redraw(); };
  after(editorPaint(rows));
}

/* ---- the writes, and who may send them ------------------------------------------------------- */
/* Every write a view offers is registered here under the key its button carries, with its arguments
   as a thunk so an input is read when the button is pressed and not when it was drawn. Two kinds:
   `wctl` is owner-gated, and in the vault view decision 7 turns it into calldata to copy rather than
   a transaction this page could not sign; `sctl` is permissionless — `distribute`, `release` and
   `applyQueued` are anyone's, whoever the owner is — and always sends. */
const WRITES = new Map();
let VIEW = 'visitor';
function wctl(key, label, w) {
  WRITES.set(key, w);
  return VIEW === 'vault'
    ? `<button class="btn sec sm" data-copy="${key}">copy calldata for your vault</button>`
    : `<button class="btn sm" data-send="${key}">${label}</button>`;
}
function sctl(key, label, w, off) {
  WRITES.set(key, w);
  return off ? `<button class="btn off sm" disabled>${label}</button>` : `<button class="btn sm" data-send="${key}">${label}</button>`;
}
/* One handler for all of them. After a write lands the view is read again from the chain rather than
   patched from the receipt: the page's claim about the contract should come from the contract. */
function bindWrites(reload) {
  const all = () => V.querySelectorAll('[data-send],[data-copy]');
  V.querySelectorAll('[data-send]').forEach(b => {
    b.onclick = async () => {
      const w = WRITES.get(b.dataset.send);
      if (!w || (w.confirm && !confirm(w.confirm))) return;
      let args;
      try { args = w.args(); } catch (e) { txSay(w.label, esc(e.message || String(e)), 'bad'); return; }
      if (!args) return;
      all().forEach(x => { x.disabled = true; });
      const r = await tx(w.to, w.sig, args, { value: w.value && w.value(), label: w.label });
      if (r.ok) reload(); else all().forEach(x => { x.disabled = false; });
    };
  });
  V.querySelectorAll('[data-copy]').forEach(b => {
    b.onclick = () => {
      const w = WRITES.get(b.dataset.copy);
      if (!w) return;
      let args;
      try { args = w.args(); } catch (e) { txSay(w.label, esc(e.message || String(e)), 'bad'); return; }
      if (!args) return;
      copyCalldata(Eth.enc(w.sig, args), document.getElementById('txs'));
    };
  });
}

   drops its own paint rather than overwriting the view the user asked for next. */
let TOKEN = 0;
const stale = t => t !== TOKEN;

function distroBody(d) {

}

const verb = (n, icon, name, what, callers) => `<div><i>${n}</i>${icon}<b>${name}</b><span>${what}</span><span class="who">${callers}</span></div>`;
const ICON = {

/* The field takes an address, or a name wherever a registry can answer one; `addrField` writes which

function loadField() {

  if (!input) return;

/* ---- one distribution ------------------------------------------------------------------------ */
/* What one load of `#/distros/<addr>` knows. `nonces` arrives with the logs rather than the snapshot,
   which is why the apply buttons are drawn twice: once disabled, once able. */
let DS = { d: null, next: null, heir: null, nonces: null, failed: false };
let PROPOSE = null, DRAWER = false;
const bindAll = () => bindWrites(() => detail(DS.d.addr));

/* Decision 7: who this page is for is decided once per load. The owner's own account sends directly;
   a contract owner that answers `isOwner(ACC)` gets the same view with every owner write rendered as
   calldata to copy; anything else is a visitor. The probe is a raw `eth_call` rather than `call()`,
   because an EOA owner has no code and answers `0x` — which has to read as "not a vault", and so does
   a revert from a contract that has no such function. */
async function ownerView(d) {
  if (!ACC || d.owner === ZERO) return 'visitor';
  if (same(ACC, d.owner)) return 'owner';
  try {
    const r = await P.request({ method: 'eth_call', params: [{ to: d.owner, data: Eth.enc('isOwner(address)', [ACC]) }, 'latest'] });
    return r && r !== '0x' && BigInt(r) === 1n ? 'vault' : 'visitor';
  } catch (e) { return 'visitor'; }
}

async function detail(addr) {
  const t = TOKEN;
  if (!DS.d || DS.d.addr !== addr) { V.innerHTML = notice(`reading ${esc(short(addr))}…`); PROPOSE = null; DRAWER = false; }
  // The clock is read again here, not only at boot: every countdown on this page is measured against
  // it, and a write that lands moves the chain's.
  const [d] = await Promise.all([loadDistro(addr), readClock()]);
  if (stale(t)) return;
  if (d.missing) { V.innerHTML = unreadable(addr); return; }
  addRecent(d.addr);
  // Decision 6: a one-row table at 100% is a forward to a successor, so that successor is named first.
  const next = Model.supersededBy(d.table);
  const [heir, view] = await Promise.all([next ? loadDistro(next) : null, ownerView(d)]);
  if (stale(t)) return;
  DS = { d, next, heir, nonces: null, failed: false };
  VIEW = view;
  WRITES.clear();
  paintDetail();
  // Progressive, and after the paint above: a slow or failed logs call never holds back the table. The
  // apply nonces, the token list and the escrow rows all come out of it, so all three say so until it
  // lands rather than reading as absence.
  const from = FIRST.get(d.addr) || CFG.factoryBlock;
  history(addr, from).then(async h => {
    if (stale(t)) return;
    DS.nonces = new Map(h.changes.filter(e => e.kind === 'queued').map(e => [e.hash, e.nonce]));
    fill('h-changes', h.changes.length ? histRows(h.changes) : notice('no change has been queued yet.'));
    fill('h-funds', h.funds.length ? histRows(h.funds) : notice('nothing has arrived at this address yet.'));
    fill('pending', pendingBlock(d, true));
    const f = await readFunds(d, h.funds);
    if (stale(t)) return;
    fill('funds', fundsHTML(d, f));
    bindAll();
  }).catch(() => {
    if (stale(t)) return;
    DS.failed = true;
    for (const id of ['h-changes', 'h-funds']) fill(id, notice('history unavailable', 'err'));
    fill('pending', pendingBlock(d, true));
    fill('funds', notice('history unavailable — the token list and the escrow rows are read from the logs.', 'err'));
    bindAll();
  });
}

/* The owner's one control, in both owner views. The drawer is the same either way: in the vault view

/* The prototype's "Queue a change" (`rake-dapp.html:408-425`), less the four rows it carried that this
   product does not: the owner-kind segmented control, the governance link and the free-text blurb,
   dropped by decisions 1, 2 and 7, and the author's-cut row, which is #38 and deferred to M05.
   Five writes, each its own transaction, every one of them `propose(bytes)` around one setter. An
   argument thunk that throws is how a field reports itself unusable: the message lands on the status
   line and nothing is sent. */
function drawerHTML(d) {
  const D = PROPOSE;
  const prop = (key, label, name, sig, args) => wctl(key, label, {
    to: d.addr, sig: 'propose(bytes)', label: 'propose ' + name, args: () => [Eth.enc(sig, args())],
  });
  const qrow = (k, input, ctl) => `<div class="qrow"><span class="lab">${k}</span><div>${input}</div><div>${ctl}</div></div>`;
  const val = id => document.getElementById(id).value;
  return '<div class="drawer">'
    + '<div class="dhead"><h2>Queue a change</h2><button class="link" id="dclose">close</button></div>'
    + `<p class="prose">Queued changes wait in public for ${delayText(d.delay)}. The owner can cancel any time before one lands; anyone can apply after.</p>`
    + eyebrow('the table — live preview')
    + editorHTML(D.rows)
    + `<div class="acts">${prop('table', 'Queue (1 transaction)', 'setBeneficiaries', SET_BENEFICIARIES, () => {
      const st = editorState(D.rows);
      if (!st.ok) throw new Error(st.why);
      return [Model.tableFrom(D.rows)];
    })}<span class="status" id="ed-why"></span></div>`
    + eyebrow('also queueable — each its own transaction')
    + '<div class="qrows">'
    + qrow('name', `<input id="q-desc" aria-label="name" value="${esc(d.description)}">`,
      prop('desc', 'queue', 'setDescription', 'setDescription(string)', () => [val('q-desc')]))
    + qrow('delay', `<input id="q-delay" aria-label="delay" value="${Number(d.delay) ? esc(delayText(d.delay)) : '0'}"><div class="res">7d, 48h or 0</div>`,
      prop('delay', 'queue', 'setDelay', 'setDelay(uint32)', () => {
        const s = Model.parseDelay(val('q-delay'));
        if (s === null) throw new Error('delay takes 7d, 48h, 30m or a number of seconds');
        return [s];
      }))
    + qrow('owner', `<input id="q-owner" aria-label="owner" value="${esc(d.owner)}"><div class="res" id="q-ownerres"></div>`,
      prop('owner', 'queue', 'transferOwnership', 'transferOwnership(address)', () => {
        const v = val('q-owner').trim();
        if (!isAddr(v)) throw new Error('owner takes an address — a name resolves on mainnet and Sepolia');
        return [Eth.checksum(v)];
      }))
    + '</div>'
    + `<div class="help">or ${wctl('renounce', 'renounce', {
      to: d.addr, sig: 'propose(bytes)', label: 'propose renounce',
      confirm: 'Transfer ownership to nobody. The table can never change again. Queue it?',
      args: () => [Eth.enc('transferOwnership(address)', [ZERO])],
    })} — transfer to nobody; the table can never change again.</div>`
    + '</div>';
}
function bindDrawer(d) {
  const close = document.getElementById('dclose');
  if (close) close.onclick = () => { DRAWER = false; paintDetail(); };
  const own = document.getElementById('q-owner');
  if (own) own.onchange = async () => { const a = await addrField(own.value, document.getElementById('q-ownerres')); if (a) own.value = a; };
  editorBind(PROPOSE.rows, () => paintDetail(), st => {
    const why = document.getElementById('ed-why');
    if (why) { why.className = 'status' + (st.ok ? '' : ' bad'); why.textContent = st.why; }
    const btn = V.querySelector('[data-send="table"],[data-copy="table"]');
    if (btn) btn.disabled = !st.ok;
  });
}

/* Funds, for everyone. `distribute` is permissionless (decision 11, #26) and so is `release`, so both
   sit under the balance in every view, including a visitor's. The token list is the chain's own: ETH,
   plus every token that has appeared in a `Distributed` or an `Escrowed` log — which is the answer to
   t02's deferred question about where a token list comes from, since nothing on chain carries one. */
async function readFunds(d, funds) {
  const tokens = [ZERO, ...new Set(funds.filter(e => e.token && e.token !== ZERO).map(e => e.token))];
  const rows = await Promise.all(tokens.map(async tk => {
    const [reserved] = await call(d.addr, 'reserved(address)', [tk], ['uint256']);
    const held = tk === ZERO
      ? BigInt(await P.request({ method: 'eth_getBalance', params: [d.addr, 'latest'] }))
      : (await call(tk, 'balanceOf(address)', [d.addr], ['uint256']))[0];
    const waiting = held - reserved;
    return { tk, reserved, waiting: waiting > 0n ? waiting : 0n };
  }));
  /* Every `(token, account)` an `Escrowed` log ever named, read back from the mapping: a released row
     reads zero and is dropped, so this is the escrow as it stands rather than as it happened. */
  const pairs = [...new Set(funds.filter(e => e.kind === 'escrowed').map(e => e.token + ' ' + e.account))];
  const escrows = await Promise.all(pairs.map(async k => {
    const [tk, ac] = k.split(' ');
    const [held] = await call(d.addr, 'escrowed(address,address)', [tk, ac], ['uint256']);
    return { tk, ac, held };
  }));
  return { rows, escrows: escrows.filter(e => e.held > 0n) };
}
const frow = (k, sub, n, ctl, cls) => `<div class="frow${cls ? ' ' + cls : ''}"><div><b>${k}</b>${sub ? `<div class="sub">${sub}</div>` : ''}</div><div class="n">${n}</div><div class="c">${ctl}</div></div>`;
function fundsHTML(d, f) {
  const rows = f.rows.map(r => frow(
    r.tk === ZERO ? 'ETH' : ext('address', r.tk, esc(short(r.tk))),
    r.reserved > 0n ? `waiting to distribute · ${amt(r.reserved)} held in escrow` : 'waiting to distribute',
    amt(r.waiting),
    sctl(`dist:${r.tk}`, 'distribute', { to: d.addr, sig: 'distribute(address)', args: () => [r.tk], label: `distribute ${token(r.tk)}` }, r.waiting === 0n),
  )).join('');
  const escrows = f.escrows.map(e => frow(
    `escrowed · ${esc(token(e.tk))}`,
    `${ext('address', e.ac, esc(short(e.ac)))} — the push failed, so this share waits here`,
    amt(e.held),
    sctl(`rel:${e.tk}:${e.ac}`, 'release', { to: d.addr, sig: 'release(address,address)', args: () => [e.tk, e.ac], label: 'release' }),
    'err',
  )).join('');
  return `<div class="ledger">${rows}${escrows}</div>`
    + '<div class="help">anyone can call distribute() — the contract splits by the table above; you pay the gas.</div>'
    // #18, in the dapp's guidance for payers, as the ruling says M02 should state it.
    + '<div class="help">Paying in from a contract with <code>.transfer()</code> or <code>.send()</code> can fail when the implementation is cold: the 2,300-gas stipend does not cover a clone\'s delegatecall to a cold implementation. Pay in with <code>call</code> and gas.</div>';
}

/* ---- create ---------------------------------------------------------------------------------- */
/* DESIGN_HANDOFF § 3.4's two steps, and none of the four controls the prototype's own create carried
   beside them — the owner-kind segmented control, the governance link, the free-text blurb and the
   author's-cut selector. Decisions 1, 2 and 7 dropped the first three; the fourth is #38's, deferred
   to M05. The draft survives a step change and a repaint; a landed create clears it. */
let DRAFT = null;
const newDraft = () => ({ step: 1, desc: '', owner: ACC || '', delay: '7d', deposit: '', n: '1', rows: [EMPTY_ROW(), EMPTY_ROW()], predicted: null, taken: false, salt: null });
const field = (lab, input, help) => `<div class="field"><div class="lab">${lab}</div>${input}<div class="help">${help}</div></div>`;

function createView() {
  if (!ACC) { V.innerHTML = notice('Connect a wallet to create a distribution: a salt carries the sender in its top 20 bytes (decision 10), so the address cannot be predicted without one.'); return; }
  if (!DRAFT) DRAFT = newDraft();
  if (!DRAFT.owner) DRAFT.owner = ACC;
  WRITES.clear();
  VIEW = 'owner';
  if (DRAFT.step === 1) createOne(); else createTwo();
}

function createOne() {
  const D = DRAFT;
  V.innerHTML = eyebrow('create a distribution · 1 of 2')
    + '<h1>Who controls it, and how slowly.</h1>'
    + field('name', `<input id="c-desc" aria-label="name" value="${esc(D.desc)}" placeholder="e.g. dnzn labs distribution">`,
      "The distribution's display name, stored on chain as its description — shown everywhere it appears.")
    + field('owner', `<input id="c-owner" aria-label="owner" value="${esc(D.owner)}" placeholder="0x… or a name"><div class="res" id="c-ownerres"></div>`,
      'Defaults to the connected wallet. A vault address here owns the distribution from its first block, and the salt stays yours (decision 10).')
    + field('delay', `<input id="c-delay" class="narrow" aria-label="delay" value="${esc(D.delay)}">`,
      'How long every future change waits in public. Accepts 7d, 48h, 0. Zero means changes apply instantly, and is flagged everywhere it shows.')
    + '<div class="actions"><button class="btn" id="c-next">Next</button><span class="status" id="c-why"></span></div>';
  const desc = document.getElementById('c-desc'), own = document.getElementById('c-owner'), del = document.getElementById('c-delay');
  const why = document.getElementById('c-why'), next = document.getElementById('c-next');
  const check = () => {
    D.desc = desc.value; D.owner = own.value.trim(); D.delay = del.value;
    const secs_ = Model.parseDelay(D.delay);
    const bad = !D.desc.trim() ? 'the distribution needs a name'
      : !isAddr(D.owner) ? 'owner takes an address — a name resolves on mainnet and Sepolia'
        : secs_ === null ? 'delay takes 7d, 48h, 30m or a number of seconds' : null;
    next.disabled = !!bad;
    why.className = 'status' + (bad ? ' bad' : secs_ === 0 ? ' warn' : '');
    why.textContent = bad || (secs_ === 0 ? 'no delay: every change applies the moment it is proposed' : '');
    return !bad;
  };
  [desc, own, del].forEach(i => { i.oninput = check; });
  own.onchange = async () => { const a = await addrField(own.value, document.getElementById('c-ownerres')); if (a) own.value = a; check(); };
  next.onclick = () => { if (check()) { D.step = 2; createTwo(); } };
  check();
}

function createTwo() {
  const D = DRAFT;
  V.innerHTML = '<div class="eyebrow"><button class="link" id="c-back">← back</button> · create a distribution · 2 of 2</div>'
    + '<h1>Who gets what.</h1>'
    + editorHTML(D.rows)
    + '<div class="two">'
    + field('deposit <span class="opt">· optional</span>', `<input id="c-dep" class="narrow" aria-label="deposit" value="${esc(D.deposit)}" placeholder="0" inputmode="decimal">`,
      'ETH sent with the create. `create` is payable and the value rides the CREATE2 into the clone, so a deposit arrives without a Received log.')
    + field('salt #', `<input id="c-n" class="narrow" type="number" min="1" step="1" aria-label="salt number" value="${esc(D.n)}">`,
      'The index in your salt. Its top 20 bytes are your own address (decision 10), so this is the only part you choose — and it alone fixes the address, on every chain.')
    + '</div>'
    + `<div id="c-predict">${notice('reading the address this would deploy to…')}</div>`
    + '<div class="actions"><button class="btn" id="c-deploy" disabled>Deploy</button><span class="status" id="c-why"></span></div>'
    + '<div id="txs"></div>';
  document.getElementById('c-back').onclick = () => { D.step = 1; createOne(); };
  const dep = document.getElementById('c-dep'), n = document.getElementById('c-n');
  dep.oninput = () => { D.deposit = dep.value; paintCreate(); };
  n.oninput = () => { D.n = n.value; createPredict(); };
  document.getElementById('c-deploy').onclick = async () => {
    const btn = document.getElementById('c-deploy');
    btn.disabled = true;
    const r = await tx(CFG.factory, 'create(address,uint32,string,(address,uint96,string,string)[],bytes32)',
      [D.owner, Model.parseDelay(D.delay), D.desc, Model.tableFrom(D.rows), D.salt],
      { value: Model.wei(D.deposit), label: 'create' });
    if (r.ok) { const to = D.predicted; DRAFT = null; location.hash = '#/distros/' + to; return; }
    paintCreate();
  };
  editorBind(D.rows, createTwo, paintCreate);
  createPredict();
}

/* The address, read before the button is live. #22: a second `create` on a used salt burns the whole
   gas limit before `DeploymentFailed`, so this page refuses on `eth_getCode` and sends nothing at
   all — that one is not a revert to preflight, it is a transaction not worth making. */
async function createPredict() {
  const D = DRAFT, t = TOKEN, slot = document.getElementById('c-predict');
  D.predicted = null; D.taken = false; D.salt = null;
  const n = Number(D.n);
  if (!Number.isInteger(n) || n < 1) { slot.innerHTML = notice('salt # is a whole number, 1 or more.', 'err'); paintCreate(); return; }
  paintCreate();
  const salt = Model.salt(ACC, n);
  const [addr] = await call(CFG.factory, 'predict(bytes32)', [salt], ['address']);
  const code = await P.request({ method: 'eth_getCode', params: [addr, 'latest'] });
  if (stale(t) || Number(D.n) !== n) return;
  D.salt = salt; D.predicted = addr; D.taken = !!code && code !== '0x';
  slot.innerHTML = `<div class="status">will deploy to ${ext('address', addr, esc(addr))} — same address on every chain for this wallet</div>`;
  nameSweep();
  paintCreate();
}
function paintCreate(st) {
  const D = DRAFT, s = st || editorState(D.rows), deposit = Model.wei(D.deposit);
  const btn = document.getElementById('c-deploy'), why = document.getElementById('c-why');
  if (!btn || !why) return;
  const bad = !s.ok ? s.why
    : deposit === null ? 'deposit takes an amount of ETH, or nothing'
      : !D.predicted ? 'reading the address this would deploy to…'
        : D.taken ? `a distribution already exists at this address for salt #${D.n}` : null;
  btn.disabled = !!bad;
  why.className = 'status' + (bad ? ' bad' : '');
  why.textContent = bad || s.why;
}

/* `mine` is the factory's `Created` logs with the connected account in the owner topic, each hit
   confirmed against `snapshot().owner` — ownership can have moved since the log was written. */
async function mine() {
  const found = await logs(CFG.factory, [topic('Created(address,address)'), null, word(ACC)], CFG.factoryBlock);
  const addrs = found.map(l => { const a = Eth.dec(['address'], l.topics[1])[0]; FIRST.set(a, l.blockNumber); return a; });
  const rows = await Promise.all(addrs.map(async a => {
    const d = await loadDistro(a);
    return !d.missing && d.owner.toLowerCase() === ACC.toLowerCase() ? d : null;
  }));
  return rows.filter(Boolean);
}

async function list() {
  const tabs = [['recent', 'recent'], ['mine', 'mine']];
  if (!ACC) S.tab = 'recent';
  V.innerHTML = eyebrow('distributions')
    + `<div class="tabs">${tabs.map(([k, label]) => `<button class="tab${S.tab === k ? ' on' : ''}" data-tab="${k}"${!ACC && k !== 'recent' ? ' disabled title="connect a wallet"' : ''}>${label}</button>`).join('')}</div>`
    + `<div id="rows">${notice('reading…')}</div>`;
  V.querySelectorAll('[data-tab]').forEach(b => { b.onclick = () => { S.tab = b.dataset.tab; list(); }; });
  const t = TOKEN, slot = document.getElementById('rows');
  let items = [], failed = false;
  try {
    if (S.tab === 'mine') items = await mine();
    else items = (await Promise.all(recents().map(loadDistro))).filter(d => !d.missing);
  } catch (e) { failed = true; }
  if (stale(t)) return;
  if (failed) { slot.innerHTML = notice('could not read the list from this chain.', 'err'); return; }
  if (!items.length) {
    slot.innerHTML = notice(S.tab === 'mine'
      ? `nothing on ${cname(CFG.chainId)} is owned by ${esc(short(ACC))}.`
      : 'no distribution opened yet. Paste an address below, or create one.')
      + (ACC ? '' : notice('<b>mine</b> needs a connected wallet.'))
      + `<div class="load"><input id="load-in" placeholder="0x… or a name" aria-label="address or name"><button class="btn sec" id="load-go">view</button></div><div class="res" id="load-res"></div>`;
    loadField();
    return;
  }
  fill('rows', items.map(d => `<a class="list-row" href="#/distros/${d.addr}"><span><b>${esc(d.description)}</b><span class="sub">${cname(CFG.chainId)} · ${esc(short(d.addr))}</span></span>`
    + `${d.pending.length ? '<span class="dot" title="change queued"></span>' : '<span></span>'}${mini(d.table)}</a>`).join(''));
}

function docs() {
  V.innerHTML = `<div class="docgrid"><nav class="rail" aria-label="sections">${eyebrow('sections')}`
  + SECTIONS.map(s => `<a href="#/docs#${s[0]}">${s[1].toLowerCase()}</a>`).join('') + `</nav>
  <article class="doc">${eyebrow(`docs · ${CFG.version} draft`)}<h1>Rake Distro</h1>

  <h2 id="s-abstract">Abstract</h2>
  <p>A distribution is a contract address that splits whatever it receives across a published table of beneficiaries, denominated in basis points. Anyone can trigger a split; only the owner can propose a change to the table, and every change waits out a public delay before anyone can apply it. The table, its labels and any queued change come back from one <code>snapshot()</code> call, so an interface — including the one serving this page — renders them with no indexer.</p>

  <h2 id="s-motivation">Motivation</h2>
  <p>A fee is suspicious by default: the paragraph explaining where it goes can change silently, and checking means chasing transactions. The incumbent answer grew into an on-chain banking product, while an integrator needs the primitive underneath — one address, one table, one delay. Rake Distro is that primitive and nothing else. It takes no cut of what passes through it, there is no key over a distribution but its own owner's, and there is no upgrade path: a clone is pinned to the implementation that the factory which made it holds.</p>

  <h2 id="s-how">How it works</h2>
  <p>Four verbs cover the lifecycle. <code>receive</code> — ETH and ERC-20 funds accumulate at the address and nothing moves on its own. <code>distribute</code> — anyone splits the balance that is not escrowed, by the table. <code>queue</code> — the owner stages a change in public, as <code>propose(bytes)</code>. <code>apply</code> — anyone lands it after the delay, as <code>applyQueued(bytes,uint32)</code>. Pass-through behaviour is the payer calling <code>distribute</code> in the same transaction.</p>
  <p>The receive path does nothing but a guard and a log, and still has to be paid for: a clone's delegatecall to a <em>cold</em> implementation costs more than the 2,300-gas stipend on its own. Paying in from a contract with <code>.transfer()</code> or <code>.send()</code> can therefore fail. Pay in with <code>call</code> and gas.</p>
  ${figSeq()}

  <h2 id="s-reference">Contract reference</h2>
  <p>Every external function of <code>Distribution</code>. <b>self</b> means the function is reachable only as a queued action — the contract calling itself — and <b>factory</b> that only the factory may call it. The factory's own surface is under <a href="#/docs#deploy">deployment</a>.</p>
  ${ftab(['function', 'caller', 'effect'], DOCS_FNS)}
  ${eyebrow('events')}${ftab(['event', 'emitted by', 'when'], DOCS_EVENTS)}
  ${eyebrow('errors')}${ftab(['error', 'thrown by', 'when'], DOCS_ERRORS)}
  ${eyebrow('the snapshot struct — verbatim, and what the widget reads')}
  <pre>${DOCS_STRUCT}</pre>

  <h2 id="s-table">The table</h2>
  <p>Shares are basis points and must sum to 10,000, or the table is refused. The last row takes the integer remainder of each split, so nothing is left as dust. Accounts must be strictly ascending, which deduplicates for free and keeps the first row above the zero address — and which makes one sentence worth saying twice: <em>last</em> is by address order, not the order the rows were written in. A row with a zero share is refused as well. Every row carries a <code>name</code> and a <code>note</code> on chain; an interface may overlay a name it resolved elsewhere, but the labels are the distribution's own.</p>

  <h2 id="s-timelock">The timelock</h2>
  <p>Every owner action goes through one mechanism. <code>propose</code> stores <code>queued[keccak256(abi.encode(action, nonce))] = eta</code>; a permissionless <code>applyQueued</code> then self-calls one of the four setters — <code>setBeneficiaries</code>, <code>setDescription</code>, <code>setDelay</code>, <code>transferOwnership</code>. No setter is reachable any other way, including the one that changes the delay itself. <code>cancel</code> is the owner's and is immediate. A delay of zero is allowed: <code>propose</code> runs the action inline and logs <code>Queued</code> and <code>Applied</code> in one transaction, which every interface flags. An action that reverts stays queued, because the deletes roll back with it, and can be retried or cancelled. Renouncing — transferring ownership to the zero address — leaves nothing that can propose or cancel again, so the table is provably frozen.</p>
  ${figState()}

  <h2 id="s-escrow">Push, escrow, release</h2>
  <p>An ETH share is pushed with a fixed gas allowance, <code>PUSH_GAS</code>, which is 100,000; an ERC-20 push is bounded by the token rather than by that constant. When a push fails, that share is escrowed for its beneficiary and the rest still go out; <code>release(token, account)</code> retries at any time and anyone may call it, though a retry that fails reverts and leaves the escrow where it was. A <code>reserved[token]</code> total keeps escrowed funds out of the next split. A receiver that needs more than the allowance is therefore always escrowed, never paid directly. A token that returns nothing from <code>transfer</code> — mainnet USDT — counts as success; anything else has to answer with a word equal to one.</p>

  <h2 id="s-deploy">Deployment</h2>
  <p>A factory deploys PUSH0 minimal-proxy clones with CREATE2. The salt is sender-bound: its top 20 bytes must equal <code>msg.sender</code>, and <code>create</code> reverts otherwise. Two operating rules follow. <b>The sender fixes the address and the owner does not enter it</b> — one key calls <code>create</code> with the same salt on each chain and passes the vault as the owner, so the distribution is owned by that vault from its first block, at one address, with no ownership transfer ever needed. <b>Each chain is a separate contract</b> — transferring ownership on one changes neither the salt nor any other chain, so the deploying key never needs to own anything.</p>
  <p><code>predict(salt)</code> returns the address before it is deployed, so it can be funded first, and ETH sent with <code>create</code> rides the CREATE2 into the clone without a <code>Received</code> log. <code>init</code> is factory-only. Neither the factory nor the implementation can receive ETH: a stray send reverts rather than locking. One warning worth the sentence — a second <code>create</code> on a salt that already has code consumes the whole gas limit before <code>DeploymentFailed</code> can fire, so read the code at <code>predict(salt)</code> first and refuse a non-empty answer, which is what this dapp's create screen does. The clone address depends on the factory and the salt alone; the factory is nonce-addressed where it is deployed, so one factory address across chains is a later milestone's deployment, not a property of a clone.</p>
  ${ftab(['factory', 'caller', 'effect'], DOCS_FACTORY)}
  <div class="scroll"><table class="dtab"><tr><th>chain</th><th>factory</th><th>status</th></tr>${chainRows()}</table></div>

  <h2 id="s-widget">The widget</h2>
  <p>A drop-in script renders any distribution next to the fee it explains. It reads <code>snapshot()</code> and nothing else — no logs, no indexer. The font comes from the host page and the ink from <code>currentColor</code>; rules and muted text are derived from it at reduced opacity. The only fixed colours are the bar's segment tints and the pending amber. There is a full variant and a compact one, and both loading and failure degrade quietly without touching the host page.</p>
  <pre>&lt;script src="widget.js"&gt;&lt;/script&gt;\n&lt;div data-rake="0x…" data-chain="1"&gt;&lt;/div&gt;</pre>
  <p>The path is root-relative because the same contract that serves this page serves the script, under whichever gateway you are reading it through. A mirror URL arrives with M05.</p>

  <h2 id="s-security">Security</h2>
  <p>The owner is trusted <em>over a delay</em>. The contract protects beneficiaries from surprise, not from the owner; what the owner is — an EOA, a multisig, a DAO — is outside the contract's scope, though this interface surfaces it.</p>
  <div class="scroll"><table class="dtab"><tr><th>date</th><th>auditor</th><th>scope</th><th>findings</th></tr><tr><td class="dim">—</td><td class="dim">none yet — planned pre-launch</td><td class="dim">—</td><td class="dim">—</td></tr></table></div>
  <p>Known limitations, as the contract stands. A fee-on-transfer token settles by balance, so what a beneficiary receives can differ from <code>amount × bps / 10000</code>. <code>PUSH_GAS</code> is 100,000, so a receiver that needs more on receive is always escrowed rather than paid. The 2,300-gas stipend does not cover a clone's delegatecall to a <em>cold</em> implementation, so a contract paying in with <code>.transfer()</code> or <code>.send()</code> can fail. The contracts are immutable: a bug is mitigated by redeploying, never by upgrading.</p>
  <p>Report privately through the repository's <a href="https://github.com/dnznlabs/rake/security/advisories/new" target="_blank" rel="noopener">advisory form</a>. There is no bounty programme yet; serious reports are taken seriously.</p>

  <h2 id="s-source">Source</h2>
  <p>MIT, by the SPDX header on every file. Both contracts are one file, the primitive has no imports, and the comments are dense: <a href="https://github.com/dnznlabs/rake" target="_blank" rel="noopener">github.com/dnznlabs/rake</a>. The page you are reading is what a renderer contract's <code>html()</code> view returns.</p>
  <p>Verify a deployment in two calls. The first is the factory's own implementation; the second is a clone's runtime code, which is solady's PUSH0 minimal proxy with that implementation's address inside it.</p>
  <pre>cast call ${CFG.factory} "implementation()(address)" --rpc-url $RPC\ncast code &lt;clone&gt; --rpc-url $RPC\n# 0x5f5f365f5f37365f73&lt;implementation&gt;5af43d5f5f3e6029573d5ffd5b3d5ff3</pre>

  <h2 id="s-lineage">Lineage</h2>
  <p>The timelock as <code>queued[hash]</code>, the <code>onlySelf</code> configuration, PUSH0 clones and the sender-bound CREATE2 salt are lifted from multisig.software (Src Co / z0r0z), whose single-file, audit-first ethos this project inherits. The low-level patterns follow Solady. Splits defined the category this primitive returns to.</p>
  </article></div>`;
}

/* ---- routing · theme ------------------------------------------------------------------------ */
/* `#/docs#<section>` scrolls to the matching `s-<section>` heading after the page is painted. The
   browser cannot do it: the hash's own fragment is `/docs#<section>`, which is no element's id, and
   the headings do not exist until docs() has run. */
function docScroll(h) {
  const el = h[6] === '#' ? document.getElementById('s-' + h.slice(7)) : null;

}
function route() {

     the wrong chain, which is most of the ways a stranger arrives at them. */
  if (h.startsWith('#/docs')) { docs(); docScroll(h); return; }
  if (!P) { V.innerHTML = notice('No wallet found. Open this page in a browser with a wallet.'); return; }
  if (wrongChain()) { V.innerHTML = notice(`Your wallet is on ${cname(CHAIN)}. This app lives on ${cname(CFG.chainId)}. <button id="sw">Switch network</button>.`); document.getElementById('sw').onclick = switchChain; return; }
  if (S.error) { V.innerHTML = notice(`could not read the factory at ${CFG.factory}: ${esc(S.error)}`, 'err'); return; }
  if (!S.loaded) return;

  if (h === '#/create') { createView(); return; }
  const at = h.match(/^#\/distros\/(0x[0-9a-fA-F]{40})$/);
  if (at) { detail(Eth.checksum(at[1])); return; }
  if (h.startsWith('#/distros')) { list(); return; }
  landing();
}

const tb = document.getElementById('theme-btn'), tm = document.getElementById('theme-menu'), wm = document.getElementById('who-menu'), nm = document.getElementById('net-menu');
const menus = [tm, wm, nm], toggle = m => menus.forEach(x => x.hidden = x === m ? !x.hidden : true);
tb.onclick = e => { e.stopPropagation(); toggle(tm); const t = localStorage.getItem('theme') || 'system'; tm.querySelectorAll('div').forEach(d => d.className = d.dataset.t === t ? 'on' : ''); };
tm.onclick = e => { const t = e.target.dataset.t; if (!t) return; localStorage.setItem('theme', t); const d = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme:dark)').matches); document.documentElement.className = d ? 'dark' : ''; tm.hidden = true; };
wm.onclick = e => { if (e.target.dataset.a === 'off') { wm.hidden = true; disconnect(); } };
document.getElementById('net').onclick = e => { e.stopPropagation(); toggle(nm); };
nm.onclick = e => { e.stopPropagation(); if (e.target.dataset.a === 'switch') switchChain(); };
document.addEventListener('click', () => toggle(null)); document.addEventListener('keydown', e => { if (e.key === 'Escape') toggle(null); });

(async () => {
  await discover();
  if (P) { try { await load(); } catch (e) { S.error = (e && e.message) || String(e); } }
