/* `widget.js` is the second document `App` serves, so on an http(s) page it sits beside this one.
   Anywhere else the snippet names an ERC-5219 gateway (#68): `html()`-only clients such as Freedom
   answer every web3:// path with this page, so a bare web3:// src is offered only as the alternative. The address is the distribution its owner arrived from (the owner bar links here), else
   the featured one once `load()` has read it; with neither there is nothing to put in it, and the
   snippet says so rather than inventing one. */
function widgetDocs() {
  const id = CFG.chainId;
  const http = /^https?:$/.test(location.protocol);
  const src = http ? new URL('widget.js', location.href.split('#')[0]).href : `https://${CFG.app}.${id}.w3link.io/widget.js`;
  const mine = EMBED;
  const addr = mine ? mine.addr : S.featured || '0x…';
  // Spelled as entities: a literal script tag here would trip the build's inline-script check.
  // The address sits in its own span so the preview below can rewrite every snippet in place.
  // One attribute per line. The indent is built here rather than typed: the minifier strips leading
  // whitespace from every source line, template literals included.
  const at = (k, v) => '\n  ' + esc(k) + (v === undefined ? '' : `="${v}"`);
  const tag = rpc => `&lt;script src="${esc(src)}"&gt;&lt;/script&gt;\n&lt;div` + at('data-rake', `<span class="wd-a">${addr}</span>`)
    + at('data-chain', id) + at('data-link') + (rpc ? at('data-rpc', esc(rpc)) : '') + '\n&gt;&lt;/div&gt;';
  const rpc = PUBLIC_RPC[id];
  return `<div class="wdemo"><div class="load"><input id="wd-in" value="${mine || S.featured ? addr : ''}" placeholder="0x… or a name" aria-label="distribution to preview"><button class="btn sec" id="wd-go">preview</button></div>
  <div class="res" id="wd-res"></div>
  <div class="wdgrid"><div><div class="cap">full</div><div id="wd-full"></div></div><div><div class="cap">compact</div><div id="wd-compact"></div></div></div></div>
  <p>Paste the following into any page. It displays <span id="wd-what">${mine ? esc(mine.description) : S.featured ? 'the featured distribution' : 'the distribution at the address given in <code>data-rake</code>'}</span> on ${cname(id)}, read through the visitor's wallet, and shows a failure state if no wallet is present or the wallet is on another chain.</p>
  <pre class="snip">${tag()}</pre>
  ${rpc ? `<p>To read through an RPC endpoint instead, so that visitors need no wallet, add <code>data-rpc</code>. The endpoint is the host's to choose; the one below is a public ${cname(id)} endpoint, included so that the example works as pasted.</p>
  <pre class="snip">${tag(rpc)}</pre>` : ''}
  <p><code>data-link</code> adds a link from the widget to the distribution's page in this app, where a visitor can verify the table, its history and any pending change. Remove the attribute to omit the link, or give it the address of another copy of the app, such as <code>data-link="https://…"</code>.</p>
  <p><code>data-variant="compact"</code> renders the bar and a single line, suited to a footer. <code>data-theme="dark"</code> or <code>"light"</code> overrides the widget's inference from the page background.</p>
  ${mine || S.featured ? '' : `<p>The address is filled in once a wallet on ${cname(id)} is connected.</p>`}
  <p>The script is served by the contract that serves this page, ${ext('address', CFG.app, esc(short(CFG.app)))}${http ? ', and the <code>src</code> above is resolved against this page\'s own address' : ', through an ERC-5219 gateway'}. A page opened in a web3:// client may load <code>web3://${esc(CFG.app)}:${id}/widget.js</code> instead; clients that call only <code>html()</code>, such as Freedom, cannot reach the script at that address.</p>`;
}
function docs() {
  V.innerHTML = `<div class="docgrid"><nav class="rail" aria-label="sections">${eyebrow('sections')}`
  + SECTIONS.map(s => `<a href="#/docs#${s[0]}">${s[1].toLowerCase()}</a>`).join('') + `</nav>
  <article class="doc">${eyebrow(`docs · ${CFG.version}`)}<h1>Distributions</h1>

  <h2 id="s-what">Overview</h2>
  <p>A distribution is a contract that receives funds and divides them among a published table of beneficiaries. The table, with each beneficiary's address, share, name and note, is stored on chain together with the owner, the delay and a description, and can be read by anyone. Anyone may trigger a payout. Only the owner may propose a change, and every change is subject to a public delay before it can take effect.</p>
  <p><b>Paying in from a contract.</b> A contract must send ETH to a distribution with <code>call</code> and sufficient gas. A payment made with <code>transfer</code> or <code>send</code> can fail; see <a href="#/docs#payin">receiving funds</a>.</p>

  <h2 id="s-economics">Economics</h2>
  <p>Rake is free software. The source is published under the MIT licence, the contracts take no fee on anything they receive or pay out, and neither this app nor the widget charges for its use. The only cost of a distribution is the network's gas.</p>
  ${S.featured ? `<p>If this work is useful to you, please consider supporting its authors. A payment goes to the DNZN Labs distribution, ${ext('address', S.featured, esc(short(S.featured)))}, and is divided by its published table like any other.</p>
  <div class="give"><input id="give-amt" class="narrow" placeholder="amount" inputmode="decimal" aria-label="amount in ETH"><span>ETH</span><button class="btn sec sm" id="give-go"${ACC ? '' : ' disabled title="connect a wallet to send"'}>send</button><a href="#/distros/${S.featured}">view the distribution →</a></div>
  <div id="txs">${ACC ? '' : '<div class="help">Connect a wallet to send.</div>'}</div>` : ''}

  <h2 id="s-why">Purpose</h2>
  <p>Where a fee or a revenue share goes is ordinarily stated off chain, and that statement can be revised without notice. A distribution places it on record. The allocation is public, the owner is public, and a change to either is visible for the full length of the delay before it can be applied. A payer can verify where funds will go; a beneficiary can rely on the share it has been allocated.</p>
  <p>Protocol fees are the primary case. The mechanism applies equally to revenue shares, grants and any other allocation a project is accountable for and is prepared to publish.</p>
  <p>The contract takes no fee, holds no administrative key other than the owner's, and cannot be upgraded.</p>

  <h2 id="s-how">Mechanism</h2>
  <p>Funds sent to the address remain there until <code>distribute</code> is called. Each call divides the available balance of one asset according to the table and sends each beneficiary its share. A share that cannot be delivered is held in the contract for that beneficiary and may be released later.</p>
  ${figSeq()}
  <p>Changes follow a fixed sequence. The owner proposes a change, and it is queued with the time from which it may be applied. Once that time has passed, anyone may apply it. Until it is applied, the owner may cancel it.</p>
  ${figState()}

  <h2 id="s-create">Creating a distribution</h2>
  <p>A distribution is defined by three parameters: an owner, a delay and a table.</p>
  <p>The owner is the address permitted to propose and cancel changes. The create screen defaults to the connected wallet. A multisig, a DAO or any other contract may be the owner.</p>
  <p>The delay is the period a proposed change must wait before it can be applied. The create screen defaults to seven days. A delay of zero is permitted, and a distribution without one is marked as such wherever it is displayed.</p>
  <p>The table holds one row per beneficiary: an address, a share, a name and a note. Shares are set in steps of 0.01% and must total exactly 100%. Every share must be greater than zero, no address may appear twice, and the zero address may not appear at all. Where a payout does not divide evenly, the remainder is assigned to the last row, which is the row with the highest address because the contract requires the table in ascending address order. The remainder is less than one base unit per row; assigning it to one row means every payout leaves a zero balance behind rather than accumulating dust.</p>
  <p>The address of a distribution is determined before it is deployed and is displayed on the create screen, so that it can be written into a contract or an invoice in advance. The create screen refuses an address at which code already exists. ETH sent with the creation transaction is deposited into the distribution.</p>

  <h2 id="s-payin">Receiving funds</h2>
  <p>A distribution accepts ETH and any ERC-20 token at its address. Received funds are not paid out until <code>distribute</code> is called.</p>
  <p>Because anyone can send any token to the address, this page lists a token by name only once it has been distributed there. A token that has been received but never distributed appears under <i>other tokens received</i>, by address and marked unverified, with its own distribute control.</p>
  <p>A contract that sends ETH to a distribution must use <code>call</code> with sufficient gas. <code>transfer</code> and <code>send</code> forward a stipend of 2,300 gas, which does not cover receipt while the implementation is cold, and the payment then fails.</p>

  <h2 id="s-payout">Distributing funds</h2>
  <p>Anyone may call <code>distribute</code>, and the caller pays the gas. Each call distributes one asset, ETH counting as one. Beneficiaries are paid in table order.</p>
  <p>If a beneficiary cannot receive its share, that share is held in the contract and the remaining beneficiaries are still paid. Held funds are excluded from later distributions until <code>release</code> is called for that beneficiary. Anyone may call <code>release</code>; it pays the beneficiary, never the caller. If the release fails, the funds remain held. Removing a beneficiary from the table does not affect funds already held for it.</p>
  <p>ETH is sent with a gas allowance of 100,000. A beneficiary that requires more than that to receive ETH is always held.</p>

  <h2 id="s-change">Changing a distribution</h2>
  <p>The table, the description, the delay and the owner may each be changed. Each change is a separate proposal.</p>
  <p>A proposed change is displayed as pending, with a countdown, beside the current table. When the countdown ends, anyone may apply it. Until then the owner may cancel it, and the current configuration remains in force. No change applies automatically.</p>
  <p>A change to the delay is itself subject to the current delay. Where the delay is zero, a change applies in the same transaction as its proposal.</p>
  <p>In a wallet, these operations appear as <code>propose</code>, <code>applyQueued</code> and <code>cancel</code>.</p>

  <h2 id="s-owner">Ownership</h2>
  <p>Ownership is transferred by proposing a new owner, waiting out the delay, and applying the change. Ownership is held separately on each chain.</p>
  <p>Transferring ownership to the zero address renounces it. Thereafter no change can be proposed or cancelled. A change queued before the renunciation can still be applied by anyone, and once none remains the configuration is permanent.</p>

  <h2 id="s-widget">The widget</h2>
  <p>The widget is a script that displays a distribution on any web page: its allocation, its beneficiaries, its owner, its delay and any pending change, read directly from the chain. It adopts the host page's font and text colour, and is available in a full and a compact form.</p>
  ${widgetDocs()}

  <h2 id="s-limits">Limits</h2>
  <p>The owner is trusted for the length of the delay. The contract protects beneficiaries against sudden changes; it does not protect them against the owner.</p>
  <p>A token that charges a fee on transfer delivers less than the table specifies.</p>
  <p>A beneficiary that requires more than 100,000 gas to receive ETH is always held.</p>
  <p>Funds held for a beneficiary that can never receive them remain in the contract permanently. This is by design: there is no sweep, and neither the owner nor anyone else can redirect them.</p>
  <p>Every address, share, name and note is public, and remains in the chain's history after it is changed. An allocation that must stay private, such as individual salaries, is not suited to a distribution.</p>
  <p>A contract that pays in with <code>transfer</code> or <code>send</code> fails while the implementation is cold, because the 2,300-gas stipend does not cover receipt.</p>
  <p>The contracts cannot be upgraded. A defect is remedied by deploying a new distribution.</p>
  <p>The contracts have not yet been audited. Security issues should be reported through the repository's <a href="${REPO}/security/advisories/new" target="_blank" rel="noopener">advisory form</a>.</p>

  <h2 id="s-developers">For developers</h2>
  <p class="credit"><b>Credit.</b> The design of these contracts derives from <a href="https://multisig.software" target="_blank" rel="noopener">multisig.software</a> by Src Co / z0r0z: the timelock, the self-call setters, the PUSH0 clones and the sender-bound salt. The low-level patterns follow Solady.</p>
  <p>The source is published at <a href="${REPO}" target="_blank" rel="noopener">github.com/dnznlabs/rake</a> under the MIT licence. Both contracts reside in one file with no imports. Every function, event and error, and the <code>Snapshot</code> struct the widget reads, are documented in <a href="${REPO}/blob/main/docs/REFERENCE.md" target="_blank" rel="noopener">docs/REFERENCE.md</a>. This page is itself served by the <code>html()</code> view of a contract.</p>
  <div class="scroll"><table class="dtab"><tr><th>chain</th><th>factory</th><th>status</th></tr>${chainRows()}</table></div>
  </article></div>`;
  widgetDemo();
  giveBind();
}
/* The support form under Economics: a plain payment to the featured distribution, any amount, nothing
   pre-filled (decision 1). It goes through `tx` like every write, so it is preflighted and confirmed. */
function giveBind() {
  const go = document.getElementById('give-go'), amt = document.getElementById('give-amt');
  if (!go || !ACC) return;
  const send = async () => {
    const v = Model.wei(amt.value);
    if (!v) { txSay('send', 'enter an amount of ETH', 'bad'); return; }
    go.disabled = true;
    const r = await tx(S.featured, '', [], { value: v, label: `send ${esc(amt.value.trim())} ETH` });
    go.disabled = false;
    if (r.ok) { amt.value = ''; txSay('send', 'received — thank you', ''); }
  };
  go.onclick = send;
  amt.onkeydown = e => { if (e.key === 'Enter') send(); };
}
/* The docs' live preview: the two variants of the real widget, mounted on whatever address the field
   holds, and every snippet above rewritten to match. It reads through the dev `?rpc=` or the chain's
   public endpoint before the wallet, because the docs paint for visitors who have none. */
function widgetDemo() {
  const input = document.getElementById('wd-in'), res = document.getElementById('wd-res'), go = document.getElementById('wd-go');
  if (!input) return;
  const rpc = WRPC || PUBLIC_RPC[CFG.chainId] || '', first = input.value;
  const show = async () => {
    const a = await addrField(input.value, res);
    if (!a) return;
    document.querySelectorAll('.wd-a').forEach(el => el.textContent = a);
    if (a !== first) document.getElementById('wd-what').textContent = 'the distribution previewed above';
    if (!rpc && !window.ethereum) { res.textContent = `the preview needs a wallet on ${cname(CFG.chainId)}`; return; }
    for (const v of ['full', 'compact']) {
      // A fresh element per mount: the widget keeps its state on the node it was given.
      const el = document.createElement('div');
      el.dataset.rake = a; el.dataset.chain = CFG.chainId; el.dataset.link = '';
      if (rpc) el.dataset.rpc = rpc;
      if (v === 'compact') el.dataset.variant = 'compact';
      const slot = document.getElementById('wd-' + v); slot.replaceChildren(el);
      window.RakeWidget.mount(el);
    }
  };
  go.onclick = show;
  input.onkeydown = e => { if (e.key === 'Enter') show(); };
  if (input.value) show();
}

/* ---- routing · theme ------------------------------------------------------------------------ */
/* `#/docs#<section>` scrolls to the matching `s-<section>` heading after the page is painted. The
   browser cannot do it: the hash's own fragment is `/docs#<section>`, which is no element's id, and
   the headings do not exist until docs() has run. */
function docScroll(h) {
  const el = h[6] === '#' ? document.getElementById('s-' + h.slice(7)) : null;
  if (el) el.scrollIntoView(); else scrollTo(0, 0);
}
function route() {
  const h = location.hash || '#/';
  TOKEN++;
  document.getElementById('nav-distros').className = h.startsWith('#/distros') ? 'on' : '';
  document.getElementById('nav-docs').className = h.startsWith('#/docs') ? 'on' : '';
  /* Matched by prefix and painted before every check below it: the docs read with no wallet and on
     the wrong chain, which is most of the ways a stranger arrives at them. */
  if (h.startsWith('#/docs')) { docs(); docScroll(h); return; }
  EMBED = null;
  if (!P) { V.innerHTML = notice('No wallet found. Open this page in a browser with a wallet.'); return; }
  if (wrongChain()) { V.innerHTML = notice(`Your wallet is on ${cname(CHAIN)}. This app lives on ${cname(CFG.chainId)}. <button id="sw">Switch network</button>.`); document.getElementById('sw').onclick = switchChain; return; }
  if (S.error) { V.innerHTML = notice(`could not read the factory at ${CFG.factory}: ${esc(S.error)}`, 'err'); return; }
  if (!S.loaded) return;
  scrollTo(0, 0);
  if (h === '#/create') { createView(); return; }
  const at = h.match(/^#\/distros\/(0x[0-9a-fA-F]{40})$/);
  if (at) { detail(Eth.checksum(at[1])); return; }
  if (h.startsWith('#/distros')) { list(); return; }
  landing();
}
addEventListener('hashchange', route);
const tb = document.getElementById('theme-btn'), tm = document.getElementById('theme-menu'), wm = document.getElementById('who-menu'), nm = document.getElementById('net-menu');
const menus = [tm, wm, nm], toggle = m => menus.forEach(x => x.hidden = x === m ? !x.hidden : true);
tb.onclick = e => { e.stopPropagation(); toggle(tm); const t = localStorage.getItem('theme') || 'system'; tm.querySelectorAll('div').forEach(d => d.className = d.dataset.t === t ? 'on' : ''); };
tm.onclick = e => { const t = e.target.dataset.t; if (!t) return; localStorage.setItem('theme', t); const d = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme:dark)').matches); document.documentElement.className = d ? 'dark' : ''; tm.hidden = true; };
wm.onclick = e => { if (e.target.dataset.a === 'off') { wm.hidden = true; disconnect(); } };
document.getElementById('net').onclick = e => { e.stopPropagation(); toggle(nm); };
nm.onclick = e => { e.stopPropagation(); if (e.target.dataset.a === 'switch') switchChain(); };
document.addEventListener('click', () => toggle(null)); document.addEventListener('keydown', e => { if (e.key === 'Escape') toggle(null); });

(async () => {
  await discover();
  if (P) { try { await load(); } catch (e) { S.error = (e && e.message) || String(e); } }
  who(); route();
})();
</script>
