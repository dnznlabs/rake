/* ---- provider ------------------------------------------------------------------------------ */
let P = null, ACC = null, CHAIN = null;

let WALLET = false;
// The endpoint the landing's widget is handed in `data-rpc`: the dev `?rpc=` override when there is
// one, and otherwise empty, in which case the mount falls back to this chain's `PUBLIC_RPC` entry for
// a visitor with no wallet and to `window.ethereum` for one who has it. Reads never require a wallet;
// writes always do.
let WRPC = '';
// The page's read path when there is no wallet, and the transport behind the dev `?rpc=` override.
const rpcProvider = url => ({
  request: async ({ method, params }) => {
    const r = await fetch(url, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ jsonrpc: '2.0', id: 1, method, params }) });
    /* A public endpoint answers a rate limit or an outage with a status and often an HTML body, so the
       body may not parse. The status rides at `data.httpStatus`, where `Model.isWrappedRefusal` reads
       a 413 and `logs()` shrinks its window. `null` is a real result (an unmined receipt); only a
       missing one is a failure. */
    const j = await r.json().catch(() => null);
    if (j && j.error) throw j.error;
    if (!r.ok || !j || j.result === undefined) throw { message: r.ok ? 'the RPC endpoint sent no result' : `the RPC endpoint answered HTTP ${r.status}`, data: { httpStatus: r.status } };

// Which transport reads the chain: the injected provider when there is one, else this chain's public
// endpoint, else nothing. This is the seam #275's settings page reuses to insert a user RPC URL and a
// route choice; none of that page is here.
const readProvider = injected => { const u = PUBLIC_RPC[CFG.chainId]; return injected || (u ? rpcProvider(u) : null); };
/*DEV*/
/* A provider that refuses a wide `eth_getLogs` the way `sepolia.base.org` does, so #76's window
   shrink can be driven in a browser against anvil, which caps nothing: `?cap=200` answers the
   verbatim `-32614` refusal for any range wider than 200 blocks, and `?cap=…&prune=N` also refuses
   anything below block N the way `ethereum-sepolia.publicnode.com` does.
   `&wrap=1` answers the *wallet's* substitution instead — the object MetaMask hands the page in
   place of a provider body that arrived under an HTTP 413, measured on Base Sepolia 2026-11-17
   (#215). It carries no range and no number, which is the whole difficulty: it is the only refusal
   shape `rangeCap`, `isPruned` and `RANGEY` all miss, so it is the one worth being able to serve on
   demand. */

  request: async ({ method, params }) => {
    if (method === 'eth_getLogs') {
      const a = parseInt(params[0].fromBlock, 16), b = parseInt(params[0].toBlock, 16);
      if (prune && a < prune) throw { code: 4444, message: 'pruned history unavailable' };
      if (b - a + 1 > cap) {
        throw wrap
          ? { code: -32080, message: 'RPC endpoint returned HTTP client error.', data: { httpStatus: 413, cause: null } }
          : { code: -32614, message: `eth_getLogs is limited to a ${cap} range` };

  if (WALLET) { try { const a = await P.request({ method: 'eth_accounts' }); ACC = a[0] || null; } catch (e) {} }

async function connect() { const a = await P.request({ method: 'eth_requestAccounts' }); ACC = a[0] || null; who(); route(); }

// A successful switch lands in the chainChanged reload.
async function switchChain() {
  try { await P.request({ method: 'wallet_switchEthereumChain', params: [{ chainId: '0x' + Number(CFG.chainId).toString(16) }] }); }
  catch (e) {
    if (e && e.code === 4001) return;

async function disconnect() {

}

// A deadline, not a failure: a timed-out transaction may still land. POLL_ERR tells a dead RPC from a slow block.
const POLL_MS = 120000;
let POLL_ERR = null;

  POLL_ERR = null;

  while (Date.now() < end) {
    try { const rc = await P.request({ method: 'eth_getTransactionReceipt', params: [hash] }); if (rc) return rc; POLL_ERR = null; } catch (e) { POLL_ERR = e; }

/* ---- one write ------------------------------------------------------------------------------ */
/* Every write this page sends goes through here, so they all behave alike: preflight with `eth_call`
   on exactly the transaction about to be sent — a revert is then a sentence, not a failed transaction
   the user paid for — then send, then wait for the receipt and read its status. `label` is what the
   status line calls the write; the line itself is `#txs`, which every view that writes puts in place. */
const txSay = (label, text, cls) => { const el = document.getElementById('txs'); if (el) el.innerHTML = `<div class="status${cls ? ' ' + cls : ''}">${label} · ${text}</div>`; };
async function tx(to, sig, args, opts) {
  const o = opts || {}, label = o.label || sig.slice(0, sig.indexOf('(')) || 'send';
  // A null `from` is not refused everywhere: anvil fills in its first account and sends.
  if (!ACC) { txSay(label, 'connect a wallet to send', 'bad'); return { ok: false, stage: 'preflight', text: 'no account' }; }
  // An empty `sig` is a plain ETH payment: no calldata, so `receive()` takes it.
  /* `chainId` is what a wallet that validates the field refuses on its own side, so the write says
     which chain it is for rather than relying on the wallet's current one. Its effect in MetaMask
     is not measured here — the re-read below is the check this page makes. */
  const params = { from: ACC, to, data: sig ? Eth.enc(sig, args) : '0x', chainId: '0x' + Number(CFG.chainId).toString(16), ...(o.value ? { value: '0x' + BigInt(o.value).toString(16) } : {}) };
  txSay(label, 'checking the call against the chain…');
  try { await P.request({ method: 'eth_call', params: [params, 'latest'] }); }
  catch (e) { const text = txError(e); txSay(label, text, 'bad'); return { ok: false, stage: 'preflight', text }; }

     boot still stands, but it only runs at boot: a provider with no event emitter never fires
     `chainChanged`, so a mid-session switch sent the write to the same address on the other chain,
     where it is another contract or none. This is that same test, at the moment it matters. */
  const on = parseInt(await P.request({ method: 'eth_chainId' }), 16);
  if (String(on) !== String(CFG.chainId)) {
    const text = `your wallet is on ${cname(on)} — this app lives on ${cname(CFG.chainId)}`;
    txSay(label, text, 'bad');
    return { ok: false, stage: 'chain', text };
  }
  let hash;
  try { hash = await P.request({ method: 'eth_sendTransaction', params: [params] }); }
  catch (e) { const text = txError(e); txSay(label, text, 'bad'); return { ok: false, stage: 'send', text }; }
  txSay(label, `sent · waiting for the block · ${ext('tx', hash, short(hash))}`);

  const rc = await waitReceipt(hash, POLL_MS);
  if (!rc) {
    const text = `no receipt after ${POLL_MS / 1000}s — it may still land${POLL_ERR ? ` · last poll errored: ${esc(POLL_ERR.message || String(POLL_ERR))}` : ''}`;
    txSay(label, `${text} · ${ext('tx', hash, short(hash))}`, 'warn');
    return { ok: false, stage: 'pending', hash, text };

  if (rc.status !== '0x1') { txSay(label, `reverted · ${ext('tx', hash, short(hash))}`, 'bad'); return { ok: false, stage: 'reverted', hash, text: 'reverted' }; }
  txSay(label, `landed in block ${parseInt(rc.blockNumber, 16)} · ${ext('tx', hash, short(hash))}`);
  return { ok: true, hash, receipt: rc };
}
/* Where the revert bytes sit depends on the provider, and the page has to read both shapes. The dev

   anvil 2026-10-11, where `eth_call` answers a non-owner `cancel` with
   `{"code":3,"message":"execution reverted: custom error 0x30cd7471","data":"0x30cd7471"}`. A
   MetaMask-class wallet wraps the same object one deeper. 4001 is the user, not the chain. */
function txError(e) {
  if (e && e.code === 4001) return 'rejected in wallet';
  const d = typeof (e && e.data) === 'string' ? e.data : e && e.data && e.data.data;
  /* `?? null` and not `S.grace`: the boot read fills it (`:510`) and a revert can be decoded before
     that — the create flow runs before `S.loaded` — so the "no deadline known" case is passed
     explicitly rather than left to whatever `S.grace` happens to hold (#148). */
  return esc(Model.revertMessage(d, secs(), S.grace ?? null));

/* R19, decision 57 § 2: the three things a signer has to check the calldata against, beside the
   calldata itself. The target goes through `ext`, which is the sink every address the page prints
   uses (R2), so nothing here is escaped by hand; the value goes through the page's own formatter, and
   every `wctl` write today carries none, so `Ξ0` is what ships until one does. It sits under both
   branches below, because a signer reading the textarea needs it exactly as much. */
const cdCheck = w => `for ${ext('address', w.to, short(w.to))} on ${cname(CFG.chainId)} · value ${eth(w.value ? w.value() : 0n)} — check these three in your vault before signing.`;
async function copyCalldata(data, slot, w) {
  try { await navigator.clipboard.writeText(data); slot.innerHTML = `<div class="status">copied · ${data.length / 2 - 1} bytes</div><div class="status cdmeta">${cdCheck(w)}</div>`; return; }

const topic = sig => '0x' + Eth.keccak(Eth.utf8(sig));
const word = a => '0x' + Eth.pad(a);
/* One `eth_getLogs` from `fromBlock` to `latest` is the query a public endpoint is likeliest to
   refuse (#76). Measured 2026-11-07: `ethereum-sepolia-rpc.publicnode.com` caps the range at 50,000

   pruned the history behind it. Base Sepolia mints a block every 2 s — 43,200 a day — so a week-old
   distribution read in one window through that endpoint is not a slow query, it is 1,500 refusals.
   So: the head is read once per page load, every scan walks back from it in windows, the window
   shrinks to whatever a refusal names, and a scan that runs out of budget answers a boundary block
   instead of throwing. The cap belongs to the provider the wallet picked, not to the chain, which is
   why there is no per-chain table here. */
let WINDOW_START = 10_000;     // MetaMask's Infura default; an uncapped endpoint answers it whole
const WINDOW_INFLIGHT = 4;     // at once: enough to hide the round trips, few enough not to read as a flood
let MAX_WINDOWS = 40;          // per log kind, per pass — 40 × 200 is 8,000 blocks of the strictest endpoint
/*DEV*/
/* The windowing exercised against anvil, which caps nothing: `?win=` starts smaller and `?maxwin=`

/*DEV*/

   between them rather than one each — which is also what makes the stamp below free, and what lets
   the browser check count the requests a refresh press makes.

/** `{ logs, partial }` for one log kind over `fromBlock..toBlock` (the head by default), walked
   newest-first so that what a truncated scan has is the recent history and what it lacks is the old.
   `partial` is the block it was read back to — `null` when the whole range was covered — which is the
   one number the section's own line can honestly print. */
async function logs(address, topics, fromBlock, toBlock) {
  const from = Number(BigInt(fromBlock));
  let hi = toBlock == null ? await head() : Number(toBlock);
  let size = WINDOW_START, spent = 0;
  const out = [];
  while (hi >= from && spent < MAX_WINDOWS) {
    /* The next few windows at the current size, newest-first and contiguous, so everything above `hi`
       has been read and the boundary below it is a single number rather than a set of holes. */
    const batch = Model.windows(Math.max(from, hi - size * WINDOW_INFLIGHT + 1), hi, size)
      .reverse().slice(0, Math.min(WINDOW_INFLIGHT, MAX_WINDOWS - spent));
    spent += batch.length;

      window1(address, topics, a, b).then(r => ({ ok: r }), e => ({ err: errText(e), e }))));
    /* Kept only as far as the first refusal: the batch is contiguous from the top, so keeping a
       success from below a failure would leave a hole that no single boundary could describe. */
    const i = res.findIndex(r => r.err);
    for (const r of (i < 0 ? res : res.slice(0, i))) out.push(...r.ok);
    if (i < 0) { hi = batch[batch.length - 1][0] - 1; continue; }
    const top = batch[i][1], text = res[i].err, cap = Model.rangeCap(text);
    /* The fourth clause reads the error *object*, not the text: a wallet can replace a provider's
       range refusal with one of its own that says only `RPC endpoint returned HTTP client error.`,
       and nothing above matches that sentence, so before this clause existed the first window of
       the first kind threw and the history read ended there (#215). `cap` is `null` for that shape,
       so it falls through and halves like any other nameless refusal. */
    if (!Model.isPruned(text) && cap == null && !RANGEY.test(text) && !Model.isWrappedRefusal(res[i].e)) throw new Error(text);
    /* A pruned refusal names no window either, but a *smaller* one can still fit above the block the
       provider stopped keeping — the refused range straddled it — so it shrinks like any other
       nameless refusal and the shrinking bisects toward that boundary, which is exactly "the first
       block the provider still serves". At one block wide there is nothing left to shrink: that block
       is not served, and the history stops above it. */
    if (size === 1) return { logs: out, partial: top + 1 };
    /* Strictly smaller every time, so the loop cannot sit still: a cap is only taken when it is
       narrower than what already failed, and anything else halves. A provider that names a cap it is
       already honouring is refusing for some other reason, and halving is the move that makes
       progress. */
    size = cap != null && cap < size ? cap : Math.max(1, Math.floor(size / 2));

    if (Q.get('nosnapshot')) throw new Error('nosnapshot=1');
    /*DEV*/
    [snap] = Eth.dec([Model.SNAPSHOT_T], await P.request({ method: 'eth_call', params: [{ to: addr, data: Eth.enc('snapshot()', []) }, 'latest'] }));
  } catch (e) { snap = null; }
  const [reserved, balance, nominee] = await Promise.all([
    call(addr, 'reserved(address)', [ZERO], ['uint256']),

    call(addr, 'pendingOwner()', [], ['address']),

     contract side — no paging, no cap on `_pending` — so this is the dapp's whole answer.

     distribution rendered without its table would be a lie rather than a degraded truth. */
  const [[owner], [delay], [nonce], [description], [table]] = await Promise.all([
    call(addr, 'owner()', [], ['address']),
    call(addr, 'delay()', [], ['uint32']),
    call(addr, 'nonce()', [], ['uint32']),
    call(addr, 'description()', [], ['string']),

/* The successor of a one-row table (decision 6), read so that a target which will not answer costs the

   `Promise.all` in `detail` then threw past the paint, leaving the whole page on `reading 0x…`.

   nothing else in the page reads it: it is one row's business and no other screen's. */
const loadHeir = next => loadDistro(next).catch(e => ({ addr: next, rejected: true, why: errText(e) }));

/* The histories, as two log queries with their topic0s OR'd. `from` is the distribution's own first
   block when the `Created` scan found it, else the factory's — never genesis. */
const CHANGE_EVENTS = [['Queued(bytes32,uint32,uint256,bytes)', 'queued'], ['Applied(bytes32)', 'applied'], ['Cancelled(bytes32)', 'cancelled'],
  ['OwnershipTransferred(address,address)', 'accepted']];

   been distributed or escrowed here; the rest are anyone's to send, spam included, and are kept apart
   as `other`. A provider that refuses an address-less query leaves `other` null, never the history. */

/* The three raw log queries one distribution's history needs, each with the block it was read back

   runs again over the union: a `Queued` that only arrives in the older slice still has to close
   against the `Applied` that was already on the page. */

  const pick = set => logs(addr, [set.map(([sig]) => topic(sig))], from, to);
  const [changes, funds, ins] = await Promise.all([pick(CHANGE_EVENTS), pick(FUND_EVENTS),

async function history(addr, from, to) {

function histOf(raw) {
  const fe = raw.funds.logs.map(entry);

  const tin = raw.ins && raw.ins.logs.filter(l => l.topics.length === 3 && l.data.length === 66).map(tokenIn);
  const ch = raw.changes.logs.map(entry);
  /* `Applied` and `Cancelled` carry only the hash, so each borrows the description of the `Queued` it
     closes, and that `Queued` line trades its countdown for how it ended. */
  const q = new Map(ch.filter(e => e.kind === 'queued').map(e => [e.hash, e]));
  for (const e of ch) {
    const o = e.kind !== 'queued' && q.get(e.hash);
    if (o) { e.what = `${o.desc} · ${e.what}`; o.what = `${o.desc} · nonce ${o.nonce} · ${e.kind}`; o.closed = true; }

     together under one `load older`, so the honest line is the highest block any of them stopped at.

     `other` null already, and its budget says nothing about the two queries that carry the history. */
  const floors = [raw.changes.partial, raw.funds.partial].filter(n => n != null);

    raw,
    changes: ch.sort(newest),
    funds: [...fe, ...(tin || []).filter(e => known.has(e.token))].sort(newest),

const newest = (a, b) => b.block - a.block || b.index - a.index;
/* One log as the line it prints. An unknown topic0 cannot reach here: the query asked for these. */
function entry(log) {

  const at = t => Eth.dec(['address'], log.topics[t])[0];

    const [nonce, eta, action] = Eth.dec(['uint32', 'uint256', 'bytes'], log.data);
    // The `uint32 nonce` `applyQueued` takes: `snapshot()`'s struct does not carry it, this log does.
    // The eta and the action ride along for the fallback above, which rebuilds `_pending` from these.
    e.hash = log.topics[1]; e.nonce = Number(nonce); e.eta = eta; e.action = action;
    e.desc = describe(Model.decodePending(action));
    e.what = `${e.desc} · nonce ${nonce} · ${Model.countdown(eta, secs())}`;

    e.what = `owner · ${ext('address', at(1), short(at(1)))} → ${ext('address', at(2), short(at(2)))}`;
  } else if (kind === 'in') {

       initialised — value that rode the `create`, or a send to the counterfactual address before any
       code was there (`src/Distribution.sol:128-131`). The sentinel has no sender to link, so it reads
       as what it means rather than as a payment from `0x000…0`. An ERC-20 `Transfer` from the zero

    e.from = at(1);

    e.token = at(1); e.account = at(2);

const token = (a, known = true) => a === ZERO ? 'ETH' : ext('address', a, known && SYMBOLS.get(a) ? esc(SYMBOLS.get(a)) : short(a));
/* The three fund kinds that carry a token leave their line to here: the amount is in that token's own

   `decimalsOf` found for the token, `null` included — `amt` prints that as raw units. */
const fundWhat = (e, dec, known = true) => e.kind === 'distributed' ? `${money(e.amount, e.token, dec)} by the table`
  : e.kind === 'in' ? `${money(e.amount, e.token, dec, known)} from ${ext('address', e.from, short(e.from))}`
  : e.kind === 'claimed' ? `${money(e.amount, e.token, dec)} · ${ext('address', e.account, short(e.account))} claimed to ${ext('address', e.to, short(e.to))}`

/* A decoded pending action as one line, named by the setter it calls. `setBeneficiaries` is also
   drawn as a second bar; the other three say everything they do here. `transferOwnership` has three
   readings, so it is the one line that needs to know whose distribution this is: `owner` is passed
   where the page knows it, which is every live pending entry. A `Queued` log does not carry the owner
   of the moment it was written, so a history row is read without one and says `nominates`, which is
   what the call did whether or not it also withdrew something. */
function describe(p, owner) {
  if (p.kind === 'setBeneficiaries') return `${p.kind} · new table · ${p.table.map(b => Model.pct(b[1])).join(' / ')}`;
  if (p.kind === 'setDescription') return `${p.kind} · new name · ${esc(p.description)}`;
  if (p.kind === 'setDelay') return `${p.kind} · new delay · ${delayText(p.delay)}`;
  if (p.kind === 'transferOwnership') {
    const eff = Model.ownerChange(p, owner);
    if (eff === 'renounce') return `${p.kind} · renounced · nothing can be proposed again`;
    if (eff === 'withdraw') return `${p.kind} · withdraws the pending transfer`;
    return `${p.kind} · nominates · ${ext('address', p.owner, short(p.owner))}`;

const delayText = d => Number(d) === 0 ? 'none — changes apply instantly' : Number(d) % 86400 === 0 ? Number(d) / 86400 + 'd' : Math.round(Number(d) / 3600) + 'h';

/* ---- the bar, the ledger, the lines ---------------------------------------------------------- */
const V = document.getElementById('view');
const basis = bps => (Number(bps) / 100) + '%';
const rest = table => 10000 - table.reduce((s, b) => s + Number(b[1]), 0);
/* The signature element. Three tints cycle, so a fourth row restarts at the first; an unassigned
   remainder (which a valid table never has) is hatched rather than dropped. */
function bar(table, opts) {
  const o = opts || {};
  const segs = table.map((b, i) => `<div class="seg s${i % 3}" style="flex-basis:${basis(b[1])}" title="${esc(b[2])} ${Model.pct(b[1])}"></div>`);
  const left = rest(table);
  if (left > 0) segs.push(`<div class="seg rest" style="flex-basis:${basis(left)}" title="unassigned ${Model.pct(left)}"></div>`);
  return `<div class="bar${o.pending ? ' pending' : o.small ? ' sm' : ''}">${segs.join('')}</div>`;
}
/* The bar's own labels: the share and the name, aligned under the segment. Notes and addresses are
   the ledger's job, so the two readings of one table do not repeat each other. */
function ticks(table, opts) {
  const o = opts || {};
  const cols = table.map(b => `<div class="tick" style="flex-basis:${basis(b[1])}"><b>${Model.pct(b[1])}</b> <span class="nm">${esc(b[2])}</span></div>`);
  const left = rest(table);
  if (left > 0 && !o.pending) cols.push(`<div class="tick" style="flex-basis:${basis(left)}"><b>${Model.pct(left)}</b></div>`);
  return `<div class="ticks${o.pending ? ' pending' : ''}">${cols.join('')}</div>`;
}
const mini = table => `<span class="mini">${table.map((b, i) => `<span class="seg s${i % 3}" style="flex-basis:${basis(b[1])}"></span>`).join('')}</span>`;
const ledger = table => `<div class="ledger">${table.map(b => row(`${esc(b[2])}${b[3] ? `<span class="nt"> — ${esc(b[3])}</span>` : ''}`, ext('address', b[0], esc(short(b[0]))), Model.pct(b[1]))).join('')}</div>`;
const row = (k, sub, n, cls) => `<div class="row${cls ? ' ' + cls : ''}"><div><b>${k}</b>${sub ? `<div class="sub">${sub}</div>` : ''}</div><div class="n">${n}</div></div>`;
/* A history list shows its newest HIST_SHOW rows and a "show all" for the rest. Every row is already

const HIST_SHOW = 10;
function histFill(id, items, empty) {
  const tail = partialLine();
  if (!items.length) { fill(id, notice(empty) + tail); bindOlder(); return; }
  const more = items.length - HIST_SHOW;
  fill(id, histRows(items.slice(0, HIST_SHOW)) + (more > 0 ? `<button class="link more" id="${id}-more">show all ${items.length}</button>` : '') + tail);
  const b = document.getElementById(id + '-more');
  if (b) b.onclick = () => { fill(id, histRows(items) + partialLine()); bindOlder(); };

/* One line under a section whose logs do not reach back to the distribution's first block (#76): what

function partialLine() {

    + '<button class="link older">load older</button></div>';
}
const bindOlder = () => V.querySelectorAll('.older').forEach(b => { b.onclick = older; });

   factory's implementation, so nothing below this line would be this app's state (R3). */
const notFactory = addr => notice(`${ext('address', addr, short(addr))} on ${cname(CFG.chainId)} has code, but it is not a distribution of this app's factory — this page will not read it.`, 'err');

   distribution this page can read, one it cannot — `missing`, `foreign`, or a read that rejected, all
   of which say the same thing to a reader and none of which is a link worth offering — and `null`,
   which is the first paint, before the successor has been read at all (decision 57 § 3). */
const heirRow = (next, heir) => `<div class="status warn">${!heir
  ? `superseded by ${ext('address', next, short(next))} — reading that distribution…`
  : heir.missing || heir.foreign || heir.rejected
    ? `forwards everything it receives to ${ext('address', next, short(next))} — not a distribution of this app's factory, so there is nothing to show for it.`
    : `superseded by <a href="#/distros/${next}">${esc(heir.description)}</a> — this table forwards everything it receives.`}</div>`;

/* Owner, delay and the balance behind `distribute`. The owner cell takes a second line while a

const meta = d => `<div class="meta"><div><div class="k">owner</div><div class="v">${d.owner === ZERO ? 'renounced' : ext('address', d.owner, esc(short(d.owner)))}${ACC && d.owner.toLowerCase() === ACC.toLowerCase() ? ' · you' : ''}</div>`
  + (d.pendingOwner && d.pendingOwner !== ZERO ? `<div class="v amber">transfer pending to ${ext('address', d.pendingOwner, esc(short(d.pendingOwner)))}</div>` : '')
  + `</div>`
  + `<div><div class="k">delay</div><div class="v${Number(d.delay) ? '' : ' amber'}">${delayText(d.delay)}</div></div>`

function pendingBlock(d, acts) {

  const lag = d.rebuilt ? notice('the one-call view could not be read — this list is rebuilt from the queue log and may lag it by a block', 'warn') : '';
  return lag + (d.pending || []).map((p, i) => {
    const decoded = Model.decodePending(p[2]);
    // The tx that queued it comes from the logs, so it appears once `history` has landed.
    const tx = DS.qtx && DS.qtx.get(p[0]);

      : ph === 'ready' ? eyebrow(`ready to apply · expires in ${Model.countdown(Model.deadline(p[1], S.grace), secs())}`, 'amber')
      : eyebrow(`change queued · ${Model.countdown(p[1], secs())}`, 'amber');

/* `cancel(bytes32)` takes the hash straight from the struct. It is the owner's and immediate while

   does not carry.

   read — so a provider that refused a wide `eth_getLogs` disabled an action whose transaction never
   needed a log at all, and on Base Sepolia that held a ripe rename unappliable for ten hours
   (#215). The nonce is not information only the event carries: `propose` commits to
   `keccak256(abi.encode(action, nonce))` (`src/Distribution.sol:224`) and `applyQueued` recomputes

function pendingActs(d, p, i, ph) {
  const nonce = Model.nonceOf(p[0], p[2], d.nonce);

    ? '<button class="btn off sm" disabled>apply</button>'
      + `<span class="status bad">this change expired on ${Model.dateText(Model.deadline(p[1], S.grace))} — it can no longer be applied</span>`
    : nonce === undefined
      ? '<button class="btn off sm" disabled>apply</button>'
        + '<span class="status bad">no nonce reproduces this entry\'s hash — apply needs one</span>'
      : ph === 'ready'
        ? sctl(`apply:${i}`, 'apply', { to: d.addr, sig: 'applyQueued(bytes,uint32)', args: () => [p[2], nonce], label: 'applyQueued' })
          + `<span class="status">the delay has passed — anyone can land it${ACC ? '' : ' · connect a wallet to send it'}</span>`
        : '<button class="btn off sm" disabled>apply</button><span class="status">anyone can apply once the delay passes</span>';

  const cancel = ph === 'expired'
    ? sctl(`cancel:${i}`, 'cancel', { to: d.addr, sig: 'cancel(bytes32)', args: () => [p[0]], label: 'cancel' })

    : !OWNS() ? ''
      : wctl(`cancel:${i}`, 'cancel', { to: d.addr, sig: 'cancel(bytes32)', args: () => [p[0]], label: 'cancel' })

}

/* ---- the table editor ------------------------------------------------------------------------ */
/* One component, twice: create's step 2 and the propose drawer are the same rows, the same live bar,
   the same sum line and the same one-line reason the submit is disabled. The rows live on whichever
   draft the caller owns, so an editor never holds state of its own. */
const EMPTY_ROW = () => ({ name: '', note: '', addr: '', pct: '' });
const SET_BENEFICIARIES = 'setBeneficiaries((address,uint96,string,string)[])';
const rowsFrom = table => table.map(b => ({ name: b[2], note: b[3], addr: b[0], pct: String(Number(b[1]) / 100) }));
/* The live bar draws the rows in the order they are on screen, with no address: `bar` and `ticks` read
   the share and the name only, and a half-typed address must not stop the preview from painting. */
const barRows = rows => rows.filter(r => (parseFloat(r.pct) || 0) > 0).map(r => [ZERO, Math.round((parseFloat(r.pct) || 0) * 100), r.name, r.note]);
const pctTotal = rows => rows.reduce((s, r) => s + (parseFloat(r.pct) || 0), 0);
/* Valid means the contract will take it, so every refusal below is one of `_set`'s own
   (`src/Distribution.sol:330-346`) read at the moment a table is typed rather than at the moment it
   is applied: `propose` does not validate the action it queues, so a table with a wrong sum, a
   duplicate account, a zero share, the zero address, or one longer than `MAX_BENEFICIARIES` queues
   happily and then reverts `BadTable` on apply, where it stays stuck for the whole delay with only a
   cancel to clear it. The cap is `S.maxRows`, read at boot: this is the one validator both write
   paths use, so the refusal covers create and propose together. The sort is stated rather than
   performed on screen: silently reordering a table someone is typing is worse than saying which
   order it goes in. */
function editorState(rows) {
  const total = pctTotal(rows);
  /* The sum is read in basis points, not in decimals (R7,
     `audits/2026-11-17/frontend/AUDIT.md:233-250`). `Model.tableFrom` rounds each row to integer bps
     on its own, and that is what the chain receives, so a decimal tolerance checked a number the
     contract never sees: three rows at 33.334% total 100.002%, which the old 0.005 tolerance
     accepted, and encode as 3333 × 3 = 9999 bps — 0.01% short of `BPS_TOTAL`, which `propose`
     queues happily and `applyQueued` then refuses after the whole delay. `Math.round` here is
     `tableFrom`'s own, so the two cannot disagree again. */
  const bps = rows.map(r => Math.round((parseFloat(r.pct) || 0) * 100));
  const off = 10000 - bps.reduce((s, b) => s + b, 0);
  if (off !== 0) return { ok: false, total, why: `total must equal 100% — ${Math.abs(off) / 100}% ${off > 0 ? 'unassigned' : 'over'}` };
  // A negative share rounds into the sum and can hide inside a correct total, so it is named after it.
  if (rows.some(r => (parseFloat(r.pct) || 0) < 0)) return { ok: false, total, why: 'a share cannot be negative' };
  if (!rows.every(r => r.name.trim() && isAddr(r.addr))) return { ok: false, total, why: 'every row needs a name and address' };
  /* R5 (`AUDIT.md:193-212`): the owner field and the claim field refuse an address whose mixed-case
     checksum is wrong, and this editor showed the same warning at `addrField` below while leaving
     Deploy and Queue enabled — so it encoded the 20 bytes of a mistyped address, and `distribute`
     is permissionless. The same sentence the owner field uses, so the editor says one thing. */
  if (!rows.every(r => checksumOk(r.addr))) return { ok: false, total, why: BAD_SUM };
  /* `isAddr` passes the zero address; `_set` refuses it at `src/Distribution.sol:339`, where
     `b.account <= prev` with `prev` starting at zero keeps the first row above `address(0)`. */
  if (rows.some(r => r.addr.toLowerCase() === ZERO)) return { ok: false, total, why: 'the zero address cannot be a beneficiary — the contract refuses that table' };
  const seen = new Set(rows.map(r => r.addr.toLowerCase()));
  if (seen.size !== rows.length) return { ok: false, total, why: 'two rows cannot share an address — the contract refuses that table' };
  if (rows.some(r => Math.round((parseFloat(r.pct) || 0) * 100) === 0)) return { ok: false, total, why: 'every row needs a share above zero — the contract refuses that table' };
  if (rows.length > S.maxRows) return { ok: false, total, why: `at most ${S.maxRows} beneficiaries — the contract refuses a longer table` };
  return { ok: true, total, why: 'sent ascending by address — the only order the contract accepts' };
}
function editorHTML(rows) {
  return `<div id="ed-bar"></div><div class="erows">`
    + rows.map((r, i) => `<div class="erow">`
      + `<input aria-label="name" data-ed="name" data-i="${i}" value="${esc(r.name)}" placeholder="name">`
      + `<input aria-label="note" class="note-in" data-ed="note" data-i="${i}" value="${esc(r.note)}" placeholder="note (prose)">`
      + `<div><input aria-label="address or name" class="addr-in" data-ed="addr" data-i="${i}" value="${esc(r.addr)}" placeholder="0x… or .eth / .wei / .gwei"><div class="res" data-edres="${i}"></div></div>`
      + `<input aria-label="percent" class="bps" data-ed="pct" data-i="${i}" value="${esc(r.pct)}" inputmode="decimal">`
      + `<button class="rm" data-edrm="${i}" title="remove" aria-label="remove this row">×</button></div>`).join('')
    + `</div><div class="sum"><button class="link" data-edadd="1">+ add a beneficiary</button><span id="ed-sum"></span></div>`;
}
/* Typing repaints the bar and the sum, never the rows: an input the caret is in must not be replaced.
   Adding or removing a row changes the row count, so that goes back through the caller's `redraw`. */
function editorPaint(rows) {
  const st = editorState(rows), preview = barRows(rows);
  const el = document.getElementById('ed-bar');
  if (el) el.innerHTML = bar(preview, {}) + ticks(preview, {});
  const sum = document.getElementById('ed-sum');
  if (sum) { sum.className = st.ok ? 'ok' : 'bad'; sum.innerHTML = `${rows.length} beneficiar${rows.length === 1 ? 'y' : 'ies'} · total <b>${+st.total.toFixed(2)}%</b>`; }
  return st;
}
function editorBind(rows, redraw, after) {
  V.querySelectorAll('[data-ed]').forEach(inp => {
    inp.oninput = () => { rows[+inp.dataset.i][inp.dataset.ed] = inp.value; after(editorPaint(rows)); };
    // The name lookup waits for the field to be left: one request per address, not one per keystroke.
    if (inp.dataset.ed === 'addr') inp.onchange = async () => {
      const a = await addrField(inp.value, V.querySelector(`[data-edres="${inp.dataset.i}"]`));
      if (a) { rows[+inp.dataset.i].addr = a; inp.value = a; }
      after(editorPaint(rows));
    };
  });
  V.querySelectorAll('[data-edrm]').forEach(b => { b.onclick = () => { if (rows.length > 1) { rows.splice(+b.dataset.edrm, 1); redraw(); } }; });
  const add = V.querySelector('[data-edadd]');
  // Bounded at both ends, and each end the same way: the row the contract would refuse is never added,
  // as the last row is never removed. The count line beside this button says where the ceiling is.
  if (add) add.onclick = () => { if (rows.length < S.maxRows) { rows.push(EMPTY_ROW()); redraw(); } };
  after(editorPaint(rows));
}

/* ---- the writes, and who may send them ------------------------------------------------------- */
/* Every write a view offers is registered here under the key its button carries, with its arguments
   as a thunk so an input is read when the button is pressed and not when it was drawn. Two kinds:
   `wctl` is for the writes one named account may send, and where that account is a contract decision 7
   turns the control into calldata to copy rather than a transaction this page could not sign; `sctl`
   is permissionless — `distribute`, `release` and `applyQueued` are anyone's, whoever the owner is —
   and always sends. The five `VIEW` values answer two different questions, so each has its own
   reading: `OWNS` is who may propose and cancel, and `COPIES` is who acts through a contract. A
   nominee's vault is the second without being the first — it may accept, and nothing else. */
const WRITES = new Map();
let VIEW = 'visitor';
const OWNS = () => VIEW === 'owner' || VIEW === 'vault';
const COPIES = () => VIEW === 'vault' || VIEW === 'pending-vault';
/* The sixth value, and the only one no account ever reads as: `probing` is what a detail page holds
   from its first paint until `ownerView` has answered (#243). `OWNS` and `COPIES` are both false for
   it, so no owner power is offered before the probe decides there is one; and every control a view
   does draw is drawn disabled rather than left out, because a bar that fills in several round trips
   late reads as "nothing here is yours" and one drawn live early offers a write the probe may be
   about to refuse. */
const probeBtn = (key, label) => `<button class="btn off sm" data-send="${key}" disabled title="checking who you are…">${label}</button>`;
function wctl(key, label, w) {
  WRITES.set(key, w);
  if (VIEW === 'probing') return probeBtn(key, label);
  return COPIES()
    ? `<button class="btn sec sm" data-copy="${key}"${w.locked ? ' disabled' : ''}>copy calldata for your vault</button>`
    : w.hold ? `<button class="btn sec sm hold" data-send="${key}"${w.locked ? ' disabled' : ''}><span>${label}</span></button>` : `<button class="btn sm" data-send="${key}">${label}</button>`;
}
function sctl(key, label, w, off) {
  WRITES.set(key, w);
  if (VIEW === 'probing') return probeBtn(key, label);
  if (!ACC) return `<button class="btn off sm" disabled title="connect a wallet to send">${label}</button>`;
  return off ? `<button class="btn off sm" disabled>${label}</button>` : `<button class="btn sm" data-send="${key}">${label}</button>`;
}
/* One handler for all of them. After a write lands the view is read again from the chain rather than
   patched from the receipt: the page's claim about the contract should come from the contract. */
function bindWrites(reload) {
  const all = () => V.querySelectorAll('[data-send],[data-copy]');
  V.querySelectorAll('[data-send]').forEach(b => {
    const fire = async () => {
      const w = WRITES.get(b.dataset.send);
      if (!w || (w.confirm && !confirm(w.confirm))) return;
      let args;
      try { args = w.args(); } catch (e) { txSay(w.label, esc(e.message || String(e)), 'bad'); return; }
      if (!args) return;
      all().forEach(x => { x.disabled = true; });
      const r = await tx(w.to, w.sig, args, { value: w.value && w.value(), label: w.label });
      if (r.ok) reload(w); else all().forEach(x => { x.disabled = false; });
    };
    if (WRITES.get(b.dataset.send)?.hold) holdToFire(b, fire); else b.onclick = fire;
  });
  V.querySelectorAll('[data-copy]').forEach(b => {
    b.onclick = () => {
      const w = WRITES.get(b.dataset.copy);
      if (!w) return;
      let args;
      try { args = w.args(); } catch (e) { txSay(w.label, esc(e.message || String(e)), 'bad'); return; }
      if (!args) return;
      copyCalldata(Eth.enc(w.sig, args), document.getElementById('txs'), w);
    };
  });
}

/* A write that cannot be undone fires only after HOLD_MS of pointer or Enter/Space held down; letting
   go early cancels it, and the `.on` class draws the fill, whose 3s transition in theme.css matches. A click
   alone does nothing. */
const HOLD_MS = 3000;
function holdToFire(b, fire) {
  let t = null;
  const hold = () => { if (t || b.disabled) return; b.classList.add('on'); t = setTimeout(() => { drop(); fire(); }, HOLD_MS); };
  const drop = () => { clearTimeout(t); t = null; b.classList.remove('on'); };
  const key = e => e.key === 'Enter' || e.key === ' ';
  b.onpointerdown = hold;
  b.onpointerup = b.onpointerleave = b.onpointercancel = drop;
  b.oncontextmenu = e => e.preventDefault();
  b.onkeydown = e => { if (key(e)) { e.preventDefault(); if (!e.repeat) hold(); } };
  b.onkeyup = e => { if (key(e)) drop(); };
  b.onblur = drop;
}

/* ---- views ---------------------------------------------------------------------------------- */
/* Every view is async, and the hash can move while one is reading. A render whose token is stale
   drops its own paint rather than overwriting the view the user asked for next. */
let TOKEN = 0;
const stale = t => t !== TOKEN;

/* The claim beside the live widget, then what a distribution is for, the fee path end to end, and the
   four verbs. */
async function landing() {
  V.innerHTML = `<div class="landing"><div class="hero"><div>
  <h1>Transparent fund distribution.</h1>
  <p class="prose">A distribution is a contract that receives funds and divides them according to a published table of beneficiaries. Changes to that table are subject to a public time lock. Protocol fees are the primary case; the mechanism applies to any allocation a project is accountable for.</p>
  <div class="actions"><a class="btn" href="#/create">Create a distribution</a><a class="btn sec" href="#/docs">Read the docs</a></div>
  </div><div class="side"><div id="featured"></div>
  <div class="sechead"><b>view a distribution</b></div>
  <div class="load"><input id="load-in" placeholder="0x… or .eth / .wei / .gwei" aria-label="address or name"><button class="btn sec" id="load-go">view</button></div>
  <div class="res" id="load-res"></div>
  </div></div>
  <div class="sechead"><b>use cases</b><span>any share a project has promised in public</span></div>
  <div class="uses">
  <div><b>protocol fees</b><span>A protocol points its fee switch at one address. Holders read the split, and every proposed change to it, before any of it takes effect.</span></div>
  <div><b>revenue shares</b><span>Contributors to a product are paid from a table they can read. Anyone can trigger the payout; nobody can redirect it without a public notice period.</span></div>

  </div>

  <div class="lfig">${FLOW.wide()}${FLOW.tall()}</div>
  <div class="sechead"><b>how it works</b><span>four verbs, and who can call each</span></div>
  <div class="verbs">
  ${verb('01', 'receive', 'ETH and ERC-20 funds accumulate at the address. Nothing moves on its own.', 'anyone can send')}
  ${verb('02', 'distribute', 'Splits the waiting balance across the table. Push, with escrow fallback.', 'callable by anyone')}
  ${verb('03', 'queue', 'Changes to the beneficiaries, owner or delay are staged in public first. An owner change also needs the new owner to accept it.', 'owner only · waits the delay')}
  ${verb('04', 'apply', 'Once the time lock passes, anyone can land the queued change.', 'anyone · after the eta')}
  </div></div>`;
  loadField();
  // The live example is the widget itself, inlined below, mounted once the featured distribution is
  // known to exist: a chain without the seed leaves its slot empty rather than a widget in its error state.
  const t = TOKEN;
  // This route reads no history, so the stamp has nothing else to come from (#243 part 2).
  await head();
  /* No featured address — none seeded on this chain, or one the provider named that this page did
     not compute (R18) — is an empty slot, not a widget in its error state: `loadDistro(null)` would
     send `eth_getCode` with a null address. */
  if (!S.featured) return;
  const d = await loadDistro(S.featured);
  // The widget reads `window.ethereum` alone, so with no RPC and no such global it could only fail.
  const rpc = WRPC || (WALLET ? '' : PUBLIC_RPC[CFG.chainId] || '');
  if (stale(t) || d.missing || d.foreign || !(rpc || window.ethereum)) return;
  fill('featured', `<div id="wdg" data-rake="${d.addr}" data-chain="${CFG.chainId}" data-link${rpc ? ` data-rpc="${esc(rpc)}"` : ''}></div>`);
  window.RakeWidget.mount(document.getElementById('wdg'));
}

      + bar + tx(L, y + 94, 'published table · 4 beneficiaries', { c: 'd', f: 10 }) + tx(L, y + 110, 'time lock · 7 days', { c: 'd', f: 10 })
