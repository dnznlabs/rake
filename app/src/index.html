})();
const verb = (n, name, what, callers) => `<div><i>${n}</i><b>${name}</b><span>${what}</span><span class="who">${callers}</span></div>`;
/* The field takes an address, or a name wherever a registry can answer one; `addrField` writes which
   of those it did under the input. */
function loadField() {
  const input = document.getElementById('load-in'), res = document.getElementById('load-res'), go = document.getElementById('load-go');
  if (!input) return;
  const submit = async () => {
    const a = await addrField(input.value, res);
    if (a) { res.textContent = ''; location.hash = '#/distros/' + a; }
  };
  go.onclick = submit;
  input.onkeydown = e => { if (e.key === 'Enter') submit(); };
}

/* ---- one distribution ------------------------------------------------------------------------ */
/* What one load of `#/distros/<addr>` knows. The apply buttons are able at the first paint, from
   `snapshot()` alone — `Model.nonceOf` recovers each entry's nonce from its hash — so the logs add
   the `queued in <tx>` link and nothing else. `qtx` is that link; there is no nonce map, because a
   nonce that the snapshot already determines is not the log's to supply (#215). */
let DS = { d: null, next: null, heir: null, qtx: null, failed: false, h: null, fundsReady: false, f: null };
let PROPOSE = null, DRAWER = false, OWNOPEN = false;
// The distribution `#/docs#widget` embeds: set only where the owner bar paints, cleared by every route but the docs.
let EMBED = null;
// The drawer's state outlives a repaint by design, so a landed proposal has to clear it here or the
// form still holds what was just queued.
const closeDrawer = () => { PROPOSE = null; DRAWER = false; OWNOPEN = false; ACK = 0; OWNMODE = 'transfer'; OWNER_IN = ''; };
/* After a write lands the view is re-read as the refresh control re-reads it, minus the scroll: the
   head is pulled again, or the history scan stops at the block before the write and its own row is
   missing until a manual refresh. */
const bindAll = () => bindWrites(w => { if (w.sig === 'propose(bytes)') closeDrawer(); HEAD = null; TOKEN++; track(detail(DS.d.addr)); });

/* Decision 7: who this page is for is decided once per load. The owner's own account sends directly;
   a contract owner that answers `isOwner(ACC)` gets the same view with every owner write rendered as
   calldata to copy; anything else is a visitor. The probe is a raw `eth_call` rather than `call()`,
   because an EOA owner has no code and answers `0x` — which has to read as "not a vault", and so does
   a revert from a contract that has no such function. */
const signsFor = async addr => {
  if (!addr || addr === ZERO) return false;
  try {
    const r = await P.request({ method: 'eth_call', params: [{ to: addr, data: Eth.enc('isOwner(address)', [ACC]) }, 'latest'] });
    return !!r && r !== '0x' && BigInt(r) === 1n;
  } catch (e) { return false; }
};
/* The two pending views are additive: they are what an account that reads as a `visitor` today gets
   when the two-step ABI has named it, or a vault it signs for, as the next owner. The owner views
   keep their precedence — an account that is both a signer of the owning vault and the nominee is
   shown the bar with more power on it, and accepting is still one route away. */
async function ownerView(d) {
  if (!ACC) return 'visitor';
  if (d.owner !== ZERO) {
    if (same(ACC, d.owner)) return 'owner';
    if (await signsFor(d.owner)) return 'vault';
  }
  if (same(ACC, d.pendingOwner)) return 'pending';
  if (await signsFor(d.pendingOwner)) return 'pending-vault';
  return 'visitor';
}

/* Three phases, each ending in a paint (#243 part 1). Every read here is a round trip over whatever
   endpoint the wallet picked, and this view used to make four of them before it drew anything: the
   whole page was the one `reading 0x…` notice until the *owner probe* answered, which is the last read
   of the four and the one a visitor has no use for at all. So the frame comes from the address alone,
   the distribution fills it in, and who-you-are only decides which controls go live. */
async function detail(addr) {
  const t = TOKEN;
  /* Phase 0, no read at all, and nothing before it but `closeDrawer()`: the eyebrow needs only the
     address and the chain, and each section says what it is waiting for under its own head rather
     than the page saying it once for all of them. */
  if (!DS.d || DS.d.addr !== addr) {
    closeDrawer();
    V.innerHTML = '<div class="distro">' + eyebrow(`${ext('address', addr, short(addr))} · ${cname(CFG.chainId)}`)
      + '<h1></h1>'
      + `<div class="sechead"><b>the table</b><span>the beneficiaries, and the share each is owed</span></div>${notice('reading…')}`
      + `<div class="sechead"><b>funds</b><span>moves by the table, permissionlessly — no approval involved</span></div>${notice('reading…')}`
      + `<div class="sechead"><b>changes</b><span>every configuration change this contract has seen</span></div>${notice('reading…')}`
      + `<div class="sechead"><b>activity</b><span>funds in, and every split and escrow since</span></div>${notice('reading…')}</div>`;
  }
  /* Phase 1, the distribution. The clock is read again here, not only at boot: every countdown on
     this page is measured against it, and a write that lands moves the chain's. `head()` is in the
     same batch for the stamp, and is the one the history read below shares. */
  const [d] = await Promise.all([loadDistro(addr), readClock(), head()]);
  if (stale(t)) return;
  if (d.missing) { V.innerHTML = unreadable(addr); return; }
  /* Before `addRecent`, deliberately: the old order saved the address first and painted second, so
     one visit to a hostile link put a fake into `rake.recent` for good (R3, and R16 is what the
     fake's fallback shape then did to `#/distros`). A foreign contract is named, not drawn. */
  if (d.foreign) { V.innerHTML = notFactory(addr); return; }
  addRecent(d.addr);
  // Decision 6: a one-row table at 100% is a forward to a successor, so that successor is named first.
  const next = Model.supersededBy(d.table);
  DS = { d, next, heir: null, qtx: null, failed: false, h: null, fundsReady: false, f: null };
  VIEW = 'probing';
  WRITES.clear();
  paintDetail();
  // Progressive, and after the paint above: a slow or failed logs call never holds back the table.
  // The token list, the escrow rows and the `queued in <tx>` links come out of it, so those say so
  // until it lands rather than reading as absence. The apply buttons do not wait on it (#215).
  const from = FIRST.get(d.addr) || CFG.factoryBlock;
  history(addr, from).then(h => absorb(t, d, h)).catch(() => {
    if (stale(t)) return;
    DS.failed = true;
    paintFailed();
    bindAll();
  });
  /* Phase 2, the heir and the probe — started after the history above and not before it, so a slow
     `isOwner` never holds the logs back. `paintDetail` repaints the whole view from `DS`, which is
     also what `absorb` and the drawer do, so there is one paint path and no patching. */
  const [heir, view] = await Promise.all([next ? loadHeir(next) : null, ownerView(d)]);
  if (stale(t)) return;
  DS.heir = heir;
  VIEW = view;
  paintDetail();
}

/* Everything the log-built sections need once a history pass has landed — on the first pass, and
   again on every `load older`, which is why it is a function and not the body of that `.then`. */
async function absorb(t, d, h) {
  if (stale(t)) return;
  DS.qtx = new Map(h.changes.filter(e => e.kind === 'queued').map(e => [e.hash, e.tx]));
  /* The fallback's pending list, as `snapshot()` would have returned it: every `Queued` the history
     pass did not find an `Applied` or a `Cancelled` for, oldest first — `h.changes` is newest-first
     and `_pending` is the queue's own order. */
  if (d.pending === null) d.pending = h.changes.filter(e => e.kind === 'queued' && !e.closed).reverse().map(e => [e.hash, e.eta, e.action]);
  DS.h = h;
  paintChanges();
  /* The fund rows carry amounts in their token's own units (#43), and the changes above do not, so
     they paint first and the token set these logs name is read here — one pass for the whole
     history, cached for the funds block below, which asks for the same tokens. */
  const toks = [...new Set(h.funds.filter(e => e.amount != null).map(e => e.token))];
  const decs = new Map(await Promise.all(toks.map(async tk => [tk, await decimalsOf(tk)])));
  await Promise.all([...new Set(h.funds.filter(e => e.token).map(e => e.token))].map(symbolOf));
  if (stale(t)) return;
  for (const e of h.funds) if (e.amount != null) e.what = fundWhat(e, decs.get(e.token));
  DS.fundsReady = true;
  paintActivity();
  DS.f = await readFunds(d, h.funds);
  if (stale(t)) return;
  paintFunds();
  bindAll();
}

/* The partial line's control: another `MAX_WINDOWS` per kind, further back, added to the raw logs
   already read and decoded again over the union. The button says so while it runs — a second press
   would spend a second budget on the same blocks. */
async function older() {
  const t = TOKEN, d = DS.d, prev = DS.h.raw, to = DS.h.partial - 1;
  const from = Number(BigInt(FIRST.get(d.addr) || CFG.factoryBlock));
  if (!(to >= from)) return;
  for (const b of V.querySelectorAll('.older')) { b.disabled = true; b.textContent = 'loading older…'; }
  let add;
  try { add = await histLogs(d.addr, from, to); } catch (e) {
    if (stale(t)) return;
    for (const b of V.querySelectorAll('.older')) { b.disabled = false; b.textContent = 'load older — that read failed, try again'; }
    return;
  }
  if (stale(t)) return;
  /* `add` is the older half, so it goes in front, and the boundary that remains is its own. `ins` is
     dropped unless both halves have it: a half-read `other` list cannot be told from a complete one. */
  const join = (older_, newer_) => ({ logs: [...older_.logs, ...newer_.logs], partial: older_.partial });
  await absorb(t, d, histOf({
    changes: join(add.changes, prev.changes),
    funds: join(add.funds, prev.funds),
    ins: prev.ins && add.ins ? join(add.ins, prev.ins) : null,
  }));
}

/* The log-built sections, painted from DS so a repaint of the page — the drawer opening, a mode switch —
   puts back what has already arrived instead of leaving "loading…" that nothing will replace. */
function paintChanges() {
  histFill('h-changes', DS.h.changes, 'no change has been queued yet.');
  fill('pending', pendingBlock(DS.d, true));
}
const paintActivity = () => histFill('h-funds', DS.h.funds, 'nothing has arrived at this address yet.');
function paintFunds() {
  /* The escrow rows and the token list are built from the same logs the sections are, so a partial
     history is a caveat on this block too, not only on the two lists below it. */
  fill('funds', fundsHTML(DS.d, DS.f, DS.h.other) + partialLine());
  bindOthers(DS.d, DS.h.other, TOKEN);
  bindClaims();
  bindOlder();
}
function paintFailed() {
  for (const id of ['h-changes', 'h-funds']) fill(id, notice('history unavailable', 'err'));
  fill('pending', pendingBlock(DS.d, true));
  fill('funds', notice('history unavailable — the token list and the escrow rows are read from the logs.', 'err'));
}

function paintDetail() {
  const d = DS.d, next = DS.next, heir = DS.heir;
  V.innerHTML = '<div class="distro">' + eyebrow(`${ext('address', d.addr, short(d.addr))} · ${cname(CFG.chainId)}`)
    + `<h1>${esc(d.description)}</h1>`
    + (next ? heirRow(next, heir) : '')
    + bar(d.table, { small: true }) + ticks(d.table, {}) + ledger(d.table)
    + `<div id="pending">${pendingBlock(d, true)}</div>`
    + meta(d)
    + '<div id="txs"></div>'
    + ownerBar(d)
    + (DRAWER ? drawerHTML(d) : '')
    + `<div class="sechead"><b>funds</b><span>moves by the table, permissionlessly — no approval involved</span></div><div id="funds">${notice('reading the balances and the escrow…')}</div>`
    + `<div class="sechead"><b>changes</b><span>every configuration change this contract has seen</span></div><div id="h-changes">${notice('loading…')}</div>`
    + `<div class="sechead"><b>activity</b><span>funds in, and every split and escrow since</span></div><div id="h-funds">${notice('loading…')}</div></div>`;
  const q = document.getElementById('queue');
  if (q) q.onclick = () => { DRAWER = !DRAWER; if (DRAWER && !PROPOSE) PROPOSE = { rows: rowsFrom(d.table) }; paintDetail(); };
  if (DRAWER) bindDrawer(d);
  if (DS.failed) paintFailed();
  else if (DS.h) { paintChanges(); if (DS.fundsReady) paintActivity(); if (DS.f) paintFunds(); }
  bindAll();
  nameSweep();
}

/* The owner's one control, in both owner views. The drawer is the same either way: in the vault view
   the writes inside it are calldata rather than transactions, and that is the whole difference.
   `'you own this distribution'` is still right for an owner with a transfer pending against them,
   because it is: nothing moves until the nominee accepts. */
function ownerBar(d) {
  EMBED = OWNS() ? d : null;
  if (!EMBED) return acceptBar(d);
  return '<div class="actions">'
    + `<button class="btn" id="queue">${DRAWER ? 'Close' : 'Queue a change'}</button><a class="btn sec" href="#/docs#widget">Embed the widget</a>`
    + `<span class="status">${VIEW === 'vault'
      ? `you are a signer on ${ext('address', d.owner, esc(short(d.owner)))}, which owns this distribution — every change below is calldata to submit through it`
      : 'you own this distribution'}</span></div>`;
}
/* The other half of a two-step transfer, and the only control the nominee is offered: a transfer this
   dapp starts can be finished in it (ruling 2). `acceptOwnership()` takes no argument and is refused
   for anyone but the nominee, so the account is the whole of the authorisation — which is why the
   status line names it rather than describing a rule. A nominee that is a contract gets the calldata
   to submit through it, like every other write a contract owner makes (decision 7). */
function acceptBar(d) {
  if (VIEW !== 'pending' && VIEW !== 'pending-vault') return '';
  return '<div class="actions">'
    + wctl('accept', 'accept ownership', { to: d.addr, sig: 'acceptOwnership()', args: () => [], label: 'acceptOwnership' })
    + `<span class="status">${VIEW === 'pending-vault'
      ? `you are a signer on ${ext('address', d.pendingOwner, esc(short(d.pendingOwner)))}, which is the pending owner — accepting makes it the owner at once; nothing changes until it does`
      : 'you are the pending owner — accepting makes you the owner at once; nothing changes until you do'}</span></div>`;
}

/* The prototype's "Queue a change" (`rake-dapp.html:408-425`), less the four rows it carried that this
   product does not: the owner-kind segmented control, the governance link and the free-text blurb,
   dropped by decisions 1, 2 and 7, and the author's-cut row, which is #38 and deferred to M05.
   Five writes, each its own transaction, every one of them `propose(bytes)` around one setter. An
   argument thunk that throws is how a field reports itself unusable: the message lands on the status
   line and nothing is sent. */
function drawerHTML(d) {
  const D = PROPOSE;
  const prop = (key, label, name, sig, args) => wctl(key, label, {
    to: d.addr, sig: 'propose(bytes)', label: 'propose ' + name, args: () => [Eth.enc(sig, args())],
  });
  const qrow = (k, input, ctl) => `<div class="qrow"><span class="lab">${k}</span><div>${input}</div><div>${ctl}</div></div>`;
  const val = id => document.getElementById(id).value;
  return '<div class="drawer">'
    + '<div class="dhead"><h2>Queue a change</h2><button class="link" id="dclose">close</button></div>'
    + `<p class="prose">Queued changes wait in public for ${delayText(d.delay)}, then stay applicable for ${delayText(S.grace)}. The owner can cancel any time before one lands; anyone can apply inside that window, and anyone can clear it once the window has closed.</p>`
    + eyebrow('the table — live preview')
    + editorHTML(D.rows)
    + `<div class="acts">${prop('table', 'Queue (1 transaction)', 'setBeneficiaries', SET_BENEFICIARIES, () => {
      const st = editorState(D.rows);
      if (!st.ok) throw new Error(st.why);
      return [Model.tableFrom(D.rows)];
    })}<span class="status" id="ed-why"></span></div>`
    + eyebrow('also queueable — each its own transaction')
    + '<div class="qrows">'
    + qrow('name', `<input id="q-desc" aria-label="name" value="${esc(d.description)}">`,
      prop('desc', 'queue', 'setDescription', 'setDescription(string)', () => [val('q-desc')]))
    + qrow('delay', `<input id="q-delay" aria-label="delay" value="${Number(d.delay) ? esc(delayText(d.delay)) : '0'}"><div class="res">7d, 48h or 0</div>`,
      prop('delay', 'queue', 'setDelay', 'setDelay(uint32)', () => {
        const s = Model.parseDelay(val('q-delay'));
        if (s === null) throw new Error('delay takes 7d, 48h, 30m or a number of seconds');
        return [s];
      }))
    + '</div>'
    + ownershipHTML(d)
    + '</div>';
}
/* There are four ownership writes and the owner sends three of them: `transferOwnership(address)`
   nominates, the zero address renounces, and the owner's own address withdraws a nomination in flight.
   The fourth is the nominee's `acceptOwnership()`, which is the other bar on the page, not this
   disclosure. The three the owner sends sit collapsed here behind a selector — nominate and withdraw
   are one field, since they are one call (ruling 5) — each mode with its own three acknowledgements
   (`ACKS`), each enabled only once the one above it is checked, and a hold button that unlocks after
   the last. `ACK` is how many are checked, so a repaint keeps them; a switch of mode, or a new address
   typed, clears them. */
const ACKS = {
  transfer: [
    'Applying this names the address as the pending owner. I keep every power over this distribution until that address calls acceptOwnership() itself.',
    'I have checked the address. One that cannot accept takes nothing, and until it accepts I can withdraw the nomination by proposing my own address.',
    'After the delay anyone can apply it. I can cancel it until then, and withdraw the nomination after.',
  ],
  renounce: [
    'Once this is applied, no change to this distribution can be proposed again, by anyone. A transfer waiting to be accepted is destroyed with it, and an entry that has expired can still be cleared by anyone.',
    'The table, the delay and the name become permanent, mistakes included, once nothing else is queued. Funds keep going to the addresses in the table.',
    'After the delay anyone can apply it. I can cancel it only until then.',
  ],
};
let ACK = 0, OWNMODE = 'transfer', OWNER_IN = '';
/* The current owner's own address is the one way to withdraw a nomination (ruling 5), so the field
   admits it while a transfer is pending and refuses it otherwise, where it would queue a call that
   does nothing. */
const withdrawing = a => same(a, DS.d.owner) && DS.d.pendingOwner !== ZERO;
// Change owner's statements stay locked until the field holds an address that is not zero and is
// either not the current owner or a withdrawal; a name counts once resolved.
const ownReady = () => {
  const v = OWNER_IN.trim();
  if (OWNMODE !== 'transfer') return true;
  if (!isAddr(v) || !checksumOk(v)) return false;
  const a = Eth.checksum(v);
  return a !== ZERO && (a !== DS.d.owner || withdrawing(a));
};
/* What the proposed owner is, read once per address and kept so a repaint shows it again: a contract,
   an account with a history, or one that has never sent a transaction here — legitimate for a new key,
   and also what a mistyped address looks like, so it is amber rather than refused. */
const PROBE = new Map();
async function probeOwner(a) {
  if (PROBE.has(a)) return PROBE.get(a);
  const [code, n] = await Promise.all([
    P.request({ method: 'eth_getCode', params: [a, 'latest'] }),
    P.request({ method: 'eth_getTransactionCount', params: [a, 'latest'] }),
  ]).catch(() => [null, null]);
  const out = code === null ? { text: 'could not read this address', cls: 'warn' }
    : code !== '0x' ? { text: 'a contract — it will have to propose and cancel through its own calls', cls: '' }
    : Number(n) > 0 ? { text: `an account · ${Number(n)} transaction${Number(n) === 1 ? '' : 's'} on ${cname(CFG.chainId)}`, cls: '' }
    : { text: `has never sent a transaction on ${cname(CFG.chainId)} — make sure someone holds its key`, cls: 'warn' };
  if (code !== null) PROBE.set(a, out);
  return out;
}
function ownerNote() {
  const v = OWNER_IN.trim();
  if (!isAddr(v)) return { text: '', cls: '' };
  if (!checksumOk(v)) return { text: BAD_SUM, cls: 'bad' };
  const a = Eth.checksum(v);
  if (a === ZERO) return { text: 'the zero address — renouncing is the other tab', cls: 'bad' };
  if (a === DS.d.owner) return withdrawing(a)
    ? { text: 'withdraws the pending transfer', cls: 'warn' }
    : { text: 'that is the current owner', cls: 'bad' };
  return PROBE.get(a) || { text: 'reading the address…', cls: '' };
}
function ownershipHTML(d) {
  const t = OWNMODE === 'transfer', acks = ACKS[OWNMODE], ok = ownReady();
  const hold = VIEW === 'vault' ? '' : ', then hold the button for three seconds to queue it';
  return `<details class="danger" id="ownership"${OWNOPEN ? ' open' : ''}><summary>ownership</summary>`
    + `<div class="tabs">${[['transfer', 'change owner'], ['renounce', 'renounce ownership']].map(([k, l]) => `<button class="tab${OWNMODE === k ? ' on' : ''}" data-own="${k}">${l}</button>`).join('')}</div>`
    + (t
      ? `<p class="help">nominates another address as the next owner, which becomes the owner only when it calls <code>acceptOwnership()</code> itself. your own address withdraws a nomination. enter it, confirm each statement in turn${hold}.</p>`
        + (n => `<div class="field"><input id="q-owner" aria-label="new owner" placeholder="new owner — 0x… or .eth / .wei / .gwei" value="${esc(OWNER_IN)}"><div class="res${n.cls ? ' ' + n.cls : ''}" id="q-ownerres">${esc(n.text)}</div></div>`)(ownerNote())
      : `<p class="help">transfers ownership to nobody. confirm each statement in turn${hold}.</p>`)
    + acks.map((x, i) => `<label class="ack"><input type="checkbox" data-ack="${i}"${ACK > i ? ' checked' : ''}${ACK < i || !ok ? ' disabled' : ''}><span>${x}</span></label>`).join('')
    + wctl(OWNMODE, t ? 'hold to nominate' : 'hold to renounce', {
      to: d.addr, sig: 'propose(bytes)', label: t ? 'propose transferOwnership' : 'propose renounce', hold: true, locked: ACK < acks.length || !ok,
      args: () => {
        if (!t) return [Eth.enc('transferOwnership(address)', [ZERO])];
        const v = document.getElementById('q-owner').value.trim();
        if (!isAddr(v)) throw new Error('owner takes an address — a name resolves on mainnet and Sepolia');
        if (Eth.checksum(v) === ZERO) throw new Error('that is the zero address — renouncing is the other tab');
        return [Eth.enc('transferOwnership(address)', [Eth.checksum(v)])];
      },
    })
    + '</details>';
}
function bindDrawer(d) {
  const close = document.getElementById('dclose');
  if (close) close.onclick = () => { DRAWER = false; paintDetail(); };
  const ow = document.getElementById('ownership');
  if (ow) {
    ow.ontoggle = () => { OWNOPEN = ow.open; };
    const boxes = [...ow.querySelectorAll('[data-ack]')], btn = ow.querySelector('[data-send],[data-copy]');
    const setAck = n => {
      const ok = ownReady();
      ACK = ok ? n : 0;
      boxes.forEach((b, j) => { b.checked = j < ACK; b.disabled = !ok || j > ACK; });
      if (btn) btn.disabled = !ok || ACK < boxes.length;
    };
    ow.onchange = e => { if (e.target.dataset.ack) setAck(e.target.checked ? Number(e.target.dataset.ack) + 1 : Number(e.target.dataset.ack)); };
    ow.querySelectorAll('[data-own]').forEach(b => { b.onclick = () => { if (OWNMODE !== b.dataset.own) { OWNMODE = b.dataset.own; ACK = 0; paintDetail(); } }; });
    const own = document.getElementById('q-owner');
    if (own) {
      const res = document.getElementById('q-ownerres');
      const note = async () => {
        const n = ownerNote();
        res.className = 'res' + (n.cls ? ' ' + n.cls : ''); res.textContent = n.text;
        if (!ownReady()) return;
        /* A withdrawal keeps the line `ownerNote` wrote: the probe would answer with the owner's own
           transaction count, which replaces what the call does with something the owner knows. */
        if (withdrawing(Eth.checksum(OWNER_IN.trim()))) return;
        const v = OWNER_IN, p = await probeOwner(Eth.checksum(v.trim()));
        if (OWNER_IN === v) { res.className = 'res' + (p.cls ? ' ' + p.cls : ''); res.textContent = p.text; }
      };
      own.oninput = () => { OWNER_IN = own.value; setAck(0); note(); };
      // A name resolves on change; `addrField` writes its own line, and the probe follows once it is an address.
      own.onchange = async () => { if (isAddr(own.value.trim())) return; const a = await addrField(own.value, res); if (a) { own.value = OWNER_IN = a; setAck(0); note(); } };
    }
  }
  editorBind(PROPOSE.rows, () => paintDetail(), st => {
    const why = document.getElementById('ed-why');
    if (why) { why.className = 'status' + (st.ok ? '' : ' bad'); why.textContent = st.why; }
    const btn = V.querySelector('[data-send="table"],[data-copy="table"]');
    if (btn) btn.disabled = !st.ok;
  });
}

/* Funds, for everyone. `distribute` is permissionless (decision 11, #26) and so is `release`, so both
   sit under the balance in every view, including a visitor's. The token list is the chain's own: ETH,
   plus every token that has appeared in a `Distributed` or an `Escrowed` log, since nothing on chain
   carries one. What `history` found sent here and never distributed is `readOthers`', read on demand. */
async function readFunds(d, funds) {
  const tokens = [ZERO, ...new Set(funds.filter(e => e.token && e.token !== ZERO).map(e => e.token))];
  const read = list => Promise.all(list.map(async tk => {
    const [reserved] = await call(d.addr, 'reserved(address)', [tk], ['uint256']);
    const held = tk === ZERO
      ? BigInt(await P.request({ method: 'eth_getBalance', params: [d.addr, 'latest'] }))
      : (await call(tk, 'balanceOf(address)', [d.addr], ['uint256']))[0];
    const waiting = held - reserved;
    // The token's own decimals ride along with its balance rather than costing a second pass (#43).
    const dec = await decimalsOf(tk);
    return { tk, dec, reserved, waiting: waiting > 0n ? waiting : 0n };
  }));
  const rows = await read(tokens);
  /* Every `(token, account)` an `Escrowed` log ever named, read back from the mapping: a released row
     reads zero and is dropped, so this is the escrow as it stands rather than as it happened. */
  const pairs = [...new Set(funds.filter(e => e.kind === 'escrowed').map(e => e.token + ' ' + e.account))];
  const escrows = await Promise.all(pairs.map(async k => {
    const [tk, ac] = k.split(' ');
    const [held] = await call(d.addr, 'escrowed(address,address)', [tk, ac], ['uint256']);
    /* `claim` is self-only on chain, so the row's second control is offered to the escrowed account
       and to a vault it signs for — decision 7's probe, the same one `ownerView` runs for the owner.
       Asked here because `fundsHTML` is synchronous, and only where it can change the answer: the
       connected account being the escrowed account is cheaper and takes precedence. */
    const signs = !!ACC && !same(ACC, ac) && await signsFor(ac);
    return { tk, ac, held, signs, dec: await decimalsOf(tk) };
  }));
  return { rows, escrows: escrows.filter(e => e.held > 0n) };
}
/* The unrecognised tokens, read only once their list is opened: each costs a balance and a decimals
   call, and they are the ones anyone can multiply by sending junk. Never distributed or escrowed here,
   so nothing is reserved and the whole balance is waiting. Listed while one still holds a balance,
   with the payments that brought it. */
async function readOthers(d, other) {
  const rows = await Promise.all([...new Set(other.map(e => e.token))].map(async tk => {
    const [[waiting], dec] = await Promise.all([call(tk, 'balanceOf(address)', [d.addr], ['uint256']).catch(() => [0n]), decimalsOf(tk)]);
    const ins = other.filter(e => e.token === tk);
    for (const e of ins) e.what = fundWhat(e, dec, false);
    return { tk, dec, waiting, ins };
  }));
  return rows.filter(r => r.waiting > 0n);
}
function othersHTML(d, rows) {
  if (!rows.length) return '<div class="help">none of them still holds a balance here.</div>';
  return `<div class="ledger">${rows.map(r => frow(token(r.tk, false), `sent here ${r.ins.length} time${r.ins.length === 1 ? '' : 's'}, never distributed`, amt(r.waiting, r.dec),
    sctl(`dist:${r.tk}`, 'distribute', { to: d.addr, sig: 'distribute(address)', args: () => [r.tk], label: `distribute ${token(r.tk, false)}` }))).join('')}</div>`
    + histRows(rows.flatMap(r => r.ins).sort(newest));
}
function bindOthers(d, other, t) {
  const el = document.getElementById('others');
  if (!el) return;
  el.ontoggle = async () => {
    if (!el.open || el.dataset.read) return;
    el.dataset.read = '1';
    const rows = await readOthers(d, other);
    if (stale(t)) return;
    fill('others-body', othersHTML(d, rows));
    bindAll();
  };
}
const frow = (k, sub, n, ctl, cls) => `<div class="frow${cls ? ' ' + cls : ''}"><div><b>${k}</b>${sub ? `<div class="sub">${sub}</div>` : ''}</div><div class="n">${n}</div><div class="c">${ctl}</div></div>`;
/* An escrow row's controls. `release` is permissionless and on every row, as it has been: anyone may
   retry the push the distribution owes. `claim` is the escrowed account's own exit (F5, #95) and the
   contract takes it from that account only, so it appears for that account — as a transaction where
   the connected wallet is it, and as calldata where the connected wallet merely signs for it
   (decision 7). `to` is the one argument the contract does not check, so this field does: it defaults
   to the account itself, resolves a name the way the owner field does, and an unusable value throws
   out of the argument thunk, which lands on the status line and sends nothing. */
function escrowActs(d, e) {
  const rel = sctl(`rel:${e.tk}:${e.ac}`, 'release', { to: d.addr, sig: 'release(address,address)', args: () => [e.tk, e.ac], label: 'release' });
  const mine = same(ACC, e.ac);
  if (!mine && !e.signs) return rel;
  const key = `claim:${e.tk}:${e.ac}`, to = `to:${key}`, res = `res:${key}`;
  const w = {
    to: d.addr, sig: 'claim(address,address)', label: 'claim',
    args: () => {
      const v = document.getElementById(to).value.trim();
      if (!isAddr(v)) throw new Error('claim sends to an address — a name resolves on mainnet and Sepolia');
      if (!checksumOk(v)) throw new Error(BAD_SUM);
      return [e.tk, Eth.checksum(v)];
    },
  };
  return `<div class="acts">${rel}`
    + `<input class="narrow" id="${to}" data-claimto="${res}" aria-label="claim to" placeholder="to — 0x…" value="${esc(mine ? ACC : e.ac)}">`
    + `${mine ? sctl(key, 'claim', w) : wctl(key, 'claim', w)}</div><div class="res" id="${res}"></div>`;
}
/* The `to` field's one behaviour beyond holding text: a name resolves on change, through the same
   `addrField` the owner field uses, which writes its own line into the `.res` beside it. The value is
   read out of the DOM when the button fires, so a typed address needs no state of its own. */
function bindClaims() {
  V.querySelectorAll('[data-claimto]').forEach(el => {
    el.onchange = async () => { const a = await addrField(el.value, document.getElementById(el.dataset.claimto)); if (a) el.value = a; };
  });
}
function fundsHTML(d, f, other) {
  const rows = f.rows.map(r => frow(
    token(r.tk),
    r.reserved > 0n ? `waiting to distribute · ${r.tk === ZERO ? eth(r.reserved) : amt(r.reserved, r.dec)} held in escrow` : 'waiting to distribute',
    r.tk === ZERO ? eth(r.waiting) : amt(r.waiting, r.dec),
    sctl(`dist:${r.tk}`, 'distribute', { to: d.addr, sig: 'distribute(address)', args: () => [r.tk], label: `distribute ${token(r.tk)}` }, r.waiting === 0n),
  )).join('');
  const escrows = f.escrows.map(e => frow(
    `escrowed · ${token(e.tk)}`,
    `${ext('address', e.ac, esc(short(e.ac)))} — the push failed, so this share waits here`
      + (e.signs || same(ACC, e.ac) ? ' · release retries the push under its gas cap; claim is the account\'s own exit, paid with its own gas' : ''),
    e.tk === ZERO ? eth(e.held) : amt(e.held, e.dec),
    escrowActs(d, e),
    'err',
  )).join('');
  const n = other && new Set(other.map(e => e.token)).size;
  const others = !other ? '<div class="help wide">token payments in could not be read from this provider, so a token never distributed here is not listed.</div>'
    : !n ? ''
    : `<details class="others" id="others"><summary>other tokens received (${n})</summary>`
      /* R9, decision 57 § 1: the recognised set stays anyone's — `distribute` is permissionless by
         decision 6 and that is what makes the contract usable without its owner — so the page says
         what membership in it means instead of pretending to curate it. */
      + '<div class="status warn">unverified — anyone can send any token to this address. Check a token before distributing it; once distributed it is listed above. listed means distributed here at least once — not checked, not endorsed.</div>'
      + `<div id="others-body">${notice('reading their balances…')}</div></details>`;
  return `<div class="ledger">${rows}${escrows}</div>${others}`
    + `<div class="help wide">anyone can call distribute() — the contract splits by the table above; you pay the gas.${ACC ? '' : ' connect a wallet to send it.'} paying in from a contract? see <a class="link" href="#/docs#payin">receiving funds</a>.</div>`;
}

/* ---- create ---------------------------------------------------------------------------------- */
/* DESIGN_HANDOFF § 3.4's two steps, and none of the four controls the prototype's own create carried
   beside them — the owner-kind segmented control, the governance link, the free-text blurb and the
   author's-cut selector. Decisions 1, 2 and 7 dropped the first three; the fourth is #38's, deferred
   to M05. The draft survives a step change and a repaint; a landed create clears it. */
let DRAFT = null;
const newDraft = () => ({ step: 1, desc: '', owner: ACC || '', delay: '7d', deposit: '', n: '1', rows: [EMPTY_ROW(), EMPTY_ROW()], predicted: null, taken: false, salt: null, ack: false });
/* The owner field's reading, which both steps show: step 1 under the field, where Next is held until
   a reading that asks for one has been acknowledged, and step 2 one line above Deploy, so the owner
   the acknowledgement was about is beside the button that spends (#172, decision 43). A bad checksum
   is refused here rather than read — the same refusal `addrField` makes (`:461`) — and every other
   value is `Model.ownerKind`'s to read, against the connected wallet and whatever `probeOwner` has
   already answered for the address. */
const ownerLine = () => {
  const v = DRAFT.owner;
  if (!isAddr(v) || !checksumOk(v)) return null;
  const a = Eth.checksum(v);
  return Model.ownerKind(a, ACC, PROBE.get(a) || null);
};
// The statement beside a reading that must be confirmed; the reading itself is the line above it.
const OWNER_ACK = 'I have read the note above and still want this owner.';
// The amount field for ETH: the symbol sits inside the box, so it reads as one control.
const ethIn = attrs => `<span class="ethin"><span aria-hidden="true">Ξ</span><input ${attrs} inputmode="decimal"></span>`;
const field = (lab, input, help) => `<div class="field"><div class="lab">${lab}</div>${input}<div class="help">${help}</div></div>`;

function createView() {
  if (!ACC) { V.innerHTML = notice('Connect a wallet to create a distribution: a salt carries the sender in its top 20 bytes (decision 10), so the address cannot be predicted without one.'); return; }
  if (!DRAFT) DRAFT = newDraft();
  if (!DRAFT.owner) DRAFT.owner = ACC;
  WRITES.clear();
  VIEW = 'owner';
  if (DRAFT.step === 1) createOne(); else createTwo();
}

function createOne() {
  const D = DRAFT;
  V.innerHTML = eyebrow('create a distribution · 1 of 2')
    + '<h1>Who controls it, and how slowly.</h1>'
    + field('name', `<input id="c-desc" aria-label="name" value="${esc(D.desc)}" placeholder="e.g. dnzn labs distribution">`,
      "the distribution's display name, stored on chain as its description — shown everywhere it appears.")
    + field('owner', `<input id="c-owner" aria-label="owner" value="${esc(D.owner)}" placeholder="0x… or .eth / .wei / .gwei"><div class="res" id="c-ownerres"></div>`,
      'defaults to the connected wallet. a vault address here owns the distribution from its first block, and the salt stays yours (decision 10).')
    + '<div id="c-ownerack"></div>'
    + field('delay', `<input id="c-delay" class="narrow" aria-label="delay" value="${esc(D.delay)}">`,
      'how long every future change waits in public. accepts 7d, 48h, 0. zero means changes apply instantly, and is flagged everywhere it shows.')
    + '<div class="actions"><button class="btn" id="c-next">Next</button><span class="status" id="c-why"></span></div>';
  const desc = document.getElementById('c-desc'), own = document.getElementById('c-owner'), del = document.getElementById('c-delay');
  const why = document.getElementById('c-why'), next = document.getElementById('c-next');
  const res = document.getElementById('c-ownerres'), ackbox = document.getElementById('c-ownerack');
  /* The owner's own line, and the acknowledgement where the reading carries one. The checkbox is
     drawn only for a classed reading — the zero address and an amber probe — because a probe still
     in flight is `ack` without a class: Next stays held for the instant of the read without a box
     flashing in and out of the step. A line is written only where there is one to write, so a name
     that failed to resolve keeps what `addrField` said about it. */
  const paintOwner = k => {
    if (k) { res.className = 'res' + (k.cls ? ' ' + k.cls : ''); res.textContent = k.text; }
    ackbox.innerHTML = k && k.ack && k.cls
      ? `<label class="ack"><input type="checkbox" id="c-ack"${D.ack ? ' checked' : ''}><span>${esc(OWNER_ACK)}</span></label>`
      : '';
    const box = document.getElementById('c-ack');
    if (box) box.onchange = () => { D.ack = box.checked; check(); };
  };
  const check = () => {
    const was = D.owner;
    D.desc = desc.value; D.owner = own.value.trim(); D.delay = del.value;
    // A new address is a new reading, so a confirmation does not carry over to it (as at `:1426`).
    if (D.owner !== was) D.ack = false;
    const secs_ = Model.parseDelay(D.delay);
    const k = ownerLine();
    paintOwner(k);
    /* An unconfirmed reading holds Next. One still being read says so on its own line rather than
       here, so the status does not ask for a confirmation of something nobody has been told yet. */
    const held = !!k && k.ack && !D.ack;
    const bad = !D.desc.trim() ? 'the distribution needs a name'
      : !isAddr(D.owner) ? 'owner takes an address — a name resolves on mainnet and Sepolia'
        : !checksumOk(D.owner) ? BAD_SUM
          : secs_ === null ? 'delay takes 7d, 48h, 30m or a number of seconds'
            : held && k.cls ? 'confirm the note on the owner before continuing' : null;
    next.disabled = !!bad || held;
    why.className = 'status' + (bad ? ' bad' : secs_ === 0 ? ' warn' : '');
    why.textContent = bad || (secs_ === 0 ? 'no delay: every change applies the moment it is proposed' : '');
    return !bad && !held;
  };
  /* The probe, once per address: `probeOwner` caches into `PROBE`, so the repaint reads the answer
     and a return to this step does not ask again. The wallet itself and the zero address are read
     from the value alone and never probed. */
  const read = async () => {
    const v = D.owner;
    if (!isAddr(v) || !checksumOk(v)) return;
    const a = Eth.checksum(v);
    if (same(a, ACC) || a === ZERO || PROBE.has(a)) return;
    await probeOwner(a);
    if (D.owner === v) check();
  };
  [desc, del].forEach(i => { i.oninput = check; });
  own.oninput = () => { res.className = 'res'; res.textContent = ''; check(); read(); };
  own.onchange = async () => { const a = await addrField(own.value, res); if (a) own.value = a; check(); read(); };
  next.onclick = () => { if (check()) { D.step = 2; createTwo(); } };
  check();
  read();
}

function createTwo() {
  const D = DRAFT;
  V.innerHTML = '<div class="eyebrow"><button class="link" id="c-back">← back</button> · create a distribution · 2 of 2</div>'
    + '<h1>Who gets what.</h1>'
    + editorHTML(D.rows)
    + '<div class="two">'
    + field('deposit <span class="opt">· optional</span>', ethIn(`id="c-dep" aria-label="deposit in ETH" value="${esc(D.deposit)}" placeholder="0"`),
      'ETH sent with the creation transaction and deposited into the distribution. it arrives without a Received entry in the history.')
    + field('salt #', `<input id="c-n" class="narrow" type="number" min="1" step="1" aria-label="salt number" value="${esc(D.n)}">`,
      'the index in your salt. its top 20 bytes are your own address (decision 10), so this is the only part you choose — and it alone fixes the address, on every chain.')
    + '</div>'
    + `<div id="c-predict">${notice('reading the address this would deploy to…')}</div>`
    // The owner, again, where it is not the wallet signing: the reading step 1 was acknowledged for,
    // beside the button that spends. The connected wallet says nothing here, as it says nothing there.
    + (k => k && k.text ? `<div class="res${k.cls ? ' ' + k.cls : ''}">owner ${esc(D.owner)} · ${esc(k.text)}</div>` : '')(ownerLine())
    + '<div class="actions"><button class="btn" id="c-deploy" disabled>Deploy</button><span class="status" id="c-why"></span></div>'
    + '<div id="txs"></div>';
  document.getElementById('c-back').onclick = () => { D.step = 1; createOne(); };
  const dep = document.getElementById('c-dep'), n = document.getElementById('c-n');
  dep.oninput = () => { D.deposit = dep.value; paintCreate(); };
  n.oninput = () => { D.n = n.value; createPredict(); };
  document.getElementById('c-deploy').onclick = async () => {
    const btn = document.getElementById('c-deploy');
    btn.disabled = true;
    const r = await tx(CFG.factory, 'create(address,uint32,string,(address,uint96,string,string)[],bytes32)',
      [D.owner, Model.parseDelay(D.delay), D.desc, Model.tableFrom(D.rows), D.salt],
      { value: Model.wei(D.deposit), label: 'create' });
    if (r.ok) { const to = D.predicted; DRAFT = null; location.hash = '#/distros/' + to; return; }
    paintCreate();
  };
  editorBind(D.rows, createTwo, paintCreate);
  createPredict();
}

/* The address, read before the button is live. #22: a second `create` on a used salt burns the whole
   gas limit before `DeploymentFailed`, so this page refuses on `eth_getCode` and sends nothing at
   all — that one is not a revert to preflight, it is a transaction not worth making. */
async function createPredict() {
  const D = DRAFT, t = TOKEN, slot = document.getElementById('c-predict');
  D.predicted = null; D.taken = false; D.salt = null;
  const n = Number(D.n);
  if (!Number.isInteger(n) || n < 1) { slot.innerHTML = notice('salt # is a whole number, 1 or more.', 'err'); paintCreate(); return; }
  paintCreate();
  const salt = Model.salt(ACC, n);
  const [addr] = await call(CFG.factory, 'predict(bytes32)', [salt], ['address']);
  const code = await P.request({ method: 'eth_getCode', params: [addr, 'latest'] });
  if (stale(t) || Number(D.n) !== n) return;
  D.salt = salt; D.predicted = addr; D.taken = !!code && code !== '0x';
  slot.innerHTML = (D.taken ? `<div class="status bad">a distribution already exists at ${ext('address', addr, esc(addr))} — choose another salt #</div>`
    : `<div class="status">will deploy to ${ext('address', addr, esc(addr))} — same address on every chain for this wallet</div>`)
    + '<div class="status">a contract paying in must send ETH with <code>call</code> and gas: <code>transfer</code> and <code>send</code> can fail — <a href="#/docs#payin">why</a></div>';
  nameSweep();
  paintCreate();
}
function paintCreate(st) {
  const D = DRAFT, s = st || editorState(D.rows), deposit = Model.wei(D.deposit);
  const btn = document.getElementById('c-deploy'), why = document.getElementById('c-why');
  if (!btn || !why) return;
  const bad = !s.ok ? s.why
    : deposit === null ? 'deposit takes an amount of ETH, or nothing'
      : !D.predicted ? 'reading the address this would deploy to…'
        : D.taken ? `a distribution already exists at this address for salt #${D.n}` : null;
  btn.disabled = !!bad;
  why.className = 'status' + (bad ? ' bad' : '');
  why.textContent = bad || s.why;
}

/* `mine` is the factory's `Created` logs with the connected account in the owner topic, each hit
   confirmed against `snapshot().owner` — ownership can have moved since the log was written. */
async function mine() {
  const found = await logs(CFG.factory, [topic('Created(address,address)'), null, word(ACC)], CFG.factoryBlock);
  const addrs = found.logs.map(l => { const a = Eth.dec(['address'], l.topics[1])[0]; FIRST.set(a, l.blockNumber); return a; });
  const rows = await Promise.all(addrs.map(async a => {
    const d = await loadDistro(a);
    return !d.missing && !d.foreign && d.owner.toLowerCase() === ACC.toLowerCase() ? d : null;
  }));
  /* A truncated scan says so rather than showing fewer: this list is the only place the dapp claims
     to know everything an account owns, and a short answer here reads as "you own three" (#76). */
  return { rows: rows.filter(Boolean), partial: found.partial };
}

async function list() {
  const tabs = [['recent', 'recent'], ['mine', 'mine']];
  if (!ACC) S.tab = 'recent';
  V.innerHTML = eyebrow('distributions')
    + `<div class="tabs">${tabs.map(([k, label]) => `<button class="tab${S.tab === k ? ' on' : ''}" data-tab="${k}"${!ACC && k !== 'recent' ? ' disabled title="connect a wallet"' : ''}>${label}</button>`).join('')}<a class="tab new" href="#/create">create +</a></div>`
    + `<div id="rows">${notice('reading…')}</div>`;
  V.querySelectorAll('[data-tab]').forEach(b => { b.onclick = () => { S.tab = b.dataset.tab; list(); }; });
  const t = TOKEN, slot = document.getElementById('rows');
  let items = [], failed = false, scanned = null;
  try {
    // In the try with the rest: the `recent` tab reads no logs, so this is the only read the stamp
    // could describe on it, and a head this endpoint will not answer is a failed list either way.
    await head();
    if (S.tab === 'mine') { const m = await mine(); items = m.rows; scanned = m.partial; }
    else items = (await Promise.all(recents().map(loadDistro))).filter(d => !d.missing && !d.foreign);
  } catch (e) { failed = true; }
  if (stale(t)) return;
  if (failed) { slot.innerHTML = notice('could not read the list from this chain.', 'err'); return; }
  /* A `Created` scan that ran out of windows has not seen the whole factory, so this list is "what the
     scan reached", not "what you own" — said here in both the empty and the populated case (#76). */
  const short_ = scanned == null ? ''
    : notice(`the factory was scanned back to block ${scanned} only — a distribution created before that is not in this list. Open it by address below.`);
  if (!items.length) {
    slot.innerHTML = notice(S.tab === 'mine'
      ? `nothing on ${cname(CFG.chainId)} is owned by ${ext('address', ACC, short(ACC))}.`
      : 'no distribution opened yet. Paste an address below, or <a href="#/create">create one</a>.')
      + short_
      + (ACC ? '' : notice('<b>mine</b> needs a connected wallet.'))
      + `<div class="load"><input id="load-in" placeholder="0x… or .eth / .wei / .gwei" aria-label="address or name"><button class="btn sec" id="load-go">view</button></div><div class="res" id="load-res"></div>`;
    loadField();
    return;
  }
  fill('rows', items.map(d => `<a class="list-row" href="#/distros/${d.addr}"><span><b>${esc(d.description)}</b><span class="sub">${cname(CFG.chainId)} · ${ext('address', d.addr, short(d.addr), true)}</span></span>`
    /* `pending` is `null`, not `[]`, when `loadDistro` fell back to the five single reads, and the
       `TypeError` an unguarded length read threw here was outside the `try` above, so one such row
       left `#/distros` on "reading…" for good (R16, `AUDIT.md:367-375`). No dot: the fallback did
       not read the queue, and an absent dot is what "not read" looks like in this column. */
    + `${d.pending && d.pending.length ? '<span class="dot" title="change queued"></span>' : '<span></span>'}${mini(d.table)}</a>`).join('') + short_);
}

  <article class="doc">${eyebrow(`docs · ${CFG.version}`)}<h1>Rake Distributions</h1>

  <h2 id="s-disclaimer">Disclaimer</h2>
  <p>Alpha software. The contracts behind this page are reviewed, not audited: they have been read by the shared two-model agent method and by Slither, and both reviews are recorded in <a href="${REPO}/blob/main/SECURITY.md" target="_blank" rel="noopener noreferrer">SECURITY.md</a>. No third party has audited them, and they are offered with no warranty of any kind.</p>
  <p>The contracts are immutable, and that cuts both ways. Nobody can alter a distribution's rules behind your back; nobody can repair one either. A bug that is found is not patched — the remedy is new code at a new address, and a distribution that already exists keeps the code it was created with. Weigh that before you point a protocol fee or a payroll at a distribution, and before you ask a beneficiary to rely on one.</p>
  <p>The alpha marks come off in one release — a re-upload of this page and an edit to the README, with no redeploy — on the day all three of these readings hold: the mainnet milestone's closeout is merged and ninety days have passed since that merge commit's date; <code class="brk">gh issue list -R dnznlabs/rake --label bug --state all --search "created:&gt;=&lt;that date&gt;"</code> prints nothing; and SECURITY.md records no finding dated after that merge whose disposition is <code>fix</code> or <code>accepted</code>. The release that removes the marks cites the three readings with the date they were taken.</p>

  <h2 id="s-what">Overview</h2>
  <p>A distribution is a contract that receives funds and divides them among a published table of beneficiaries. The table, with each beneficiary's address, share, name and note, is stored on chain together with the owner, the delay and a description, and can be read by anyone. Anyone may trigger a payout. Only the owner may propose a change, and every change is subject to a public delay before it can take effect.</p>
  <p><b>Paying in from a contract.</b> A contract must send ETH to a distribution with <code>call</code> and sufficient gas. A payment made with <code>transfer</code> or <code>send</code> can fail; see <a href="#/docs#payin">receiving funds</a>.</p>
  <p class="links">${iconLink(REPO, 'github', 'source on GitHub', 'github.com/dnznlabs/rake')}${iconLink(SITE, 'robot', 'dnzn.dev', 'dnzn.dev')}</p>

  <h2 id="s-economics">Economics</h2>
  <p>Rake is free software. The source is published under the MIT licence, the contracts take no fee on anything they receive or pay out, and neither this app nor the widget charges for its use. The only cost of a distribution is the network's gas.</p>
  ${S.featuredLie ? notice(`this page computes the featured distribution at ${ext('address', S.featuredLie.computed, esc(short(S.featuredLie.computed)))}; your wallet's provider answered ${esc(short(S.featuredLie.said))} instead — the support form is not shown.`, 'err') : ''}
  ${S.featured ? `<p>If this work is useful to you, please consider supporting its authors. A payment goes to the distribution this app features, ${ext('address', S.featured, esc(short(S.featured)))}, and is divided by its published table like any other.</p>
  <div class="give">${ethIn('id="give-amt" placeholder="amount" aria-label="amount in ETH"')}<button class="btn sec sm" id="give-go"${ACC ? '' : ' disabled title="connect a wallet to send"'}>send</button><a href="#/distros/${S.featured}">view the distribution →</a></div>
  <div id="txs">${ACC ? '' : '<div class="help">connect a wallet to send.</div>'}</div>` : ''}

  <h2 id="s-credits">Credits</h2>
  <p>The design of these contracts derives from <a href="https://multisig.software" target="_blank" rel="noopener noreferrer">multisig.software</a> by Src Co / z0r0z: the timelock, the self-call setters, the PUSH0 clones and the sender-bound salt. The low-level patterns follow <a href="https://github.com/Vectorized/solady" target="_blank" rel="noopener noreferrer">Solady</a>.</p>
  <p>Rake is a fully on-chain contract-hosted dapp, also after z0r0z's work: this page is served by the <code>html()</code> view of a contract, as <a href="https://github.com/ethereum/ERCs/pull/1712" target="_blank" rel="noopener noreferrer">ERC-8244</a> proposes, and gateways reach the same contract through ERC-5219. There is no server behind it; the widget is served the same way.</p>

  <h2 id="s-why">Purpose</h2>
  <p>Where a fee or a revenue share goes is ordinarily stated off chain, and that statement can be revised without notice. A distribution places it on record. The allocation is public, the owner is public, and a change to either is visible for the full length of the delay before it can be applied. A payer can verify where funds will go; a beneficiary can rely on the share it has been allocated.</p>
  <p>Protocol fees are the primary case. The mechanism applies equally to revenue shares, grants and any other allocation a project is accountable for and is prepared to publish.</p>
  <p>The contract takes no fee, holds no administrative key other than the owner's, and cannot be upgraded.</p>

  <h2 id="s-how">Mechanism</h2>
  <p>Funds sent to the address remain there until <code>distribute</code> is called. Each call divides the available balance of one asset according to the table and sends each beneficiary its share. A share that cannot be delivered is held in the contract for that beneficiary and may be released later.</p>
  ${figSeq()}
  <p>Changes follow a fixed sequence. The owner proposes a change, and it is queued with the time from which it may be applied. Once that time has passed, anyone may apply it, for a window of fourteen days (<code>GRACE</code>). Until it is applied, the owner may cancel it; once the window has closed the change has expired, can no longer be applied, and anyone may cancel it.</p>
  ${figState()}

  <h2 id="s-create">Creating a distribution</h2>
  <p>A distribution is defined by three parameters: an owner, a delay and a table.</p>
  <p>The owner is the address permitted to propose and cancel changes. The create screen defaults to the connected wallet. A multisig, a DAO or any other contract may be the owner.</p>
  <p>The owner may also be left as the zero address, in which case the distribution is created with no owner at all: the table, the delay and the name are fixed from its first block and no change to them can ever be proposed, while receiving, distributing, releasing and claiming all keep working. This is permanent and there is no way back from it, so the create screen asks for it to be confirmed.</p>
  <p>The delay is the period a proposed change must wait before it can be applied. The create screen defaults to seven days. A delay of zero is permitted, and a distribution without one is marked as such wherever it is displayed.</p>
  <p>The table holds one row per beneficiary: an address, a share, a name and a note. Shares are set in steps of 0.01% and must total exactly 100%. Every share must be greater than zero, no address may appear twice, and the zero address may not appear at all. A table holds at most 107 rows (<code>MAX_BENEFICIARIES</code>), which the create screen and the propose drawer both refuse to exceed before any transaction is sent. Where a payout does not divide evenly, the remainder is assigned to the last row, which is the row with the highest address because the contract requires the table in ascending address order. The remainder is less than one base unit per row; assigning it to one row means every payout leaves a zero balance behind rather than accumulating dust.</p>
  <p>The address of a distribution is determined before it is deployed and is displayed on the create screen, so that it can be written into a contract or an invoice in advance. The create screen refuses an address at which code already exists. ETH sent with the creation transaction is deposited into the distribution. Do not pay a predicted address on a chain where the distribution is not yet deployed: until there is code at the address, the funds go to whatever table the eventual creation passes. Wait for code at the address, then pay.</p>

  <h2 id="s-payin">Receiving funds</h2>
  <p>A distribution accepts ETH and any ERC-20 token at its address. Received funds are not paid out until <code>distribute</code> is called.</p>
  <p>Because anyone can send any token to the address, this page lists a token by name only once it has been distributed there. Listed means distributed here at least once — not checked, not endorsed. A token that has been received but never distributed appears under <i>other tokens received</i>, by address and marked unverified, with its own distribute control.</p>
  <p>A contract that sends ETH to a distribution must use <code>call</code> with sufficient gas. <code>transfer</code> and <code>send</code> forward a stipend of 2,300 gas, which does not cover receipt while the implementation is cold, and the payment then fails.</p>

  <h2 id="s-payout">Distributing funds</h2>
  <p>Anyone may call <code>distribute</code>, and the caller pays the gas. Each call distributes one asset, ETH counting as one. Beneficiaries are paid in table order.</p>
  <p>If a beneficiary cannot receive its share, that share is held in the contract and the remaining beneficiaries are still paid. Held funds are excluded from later distributions until <code>release</code> is called for that beneficiary. Anyone may call <code>release</code>; it pays the beneficiary, never the caller. If the release fails, the funds remain held. Removing a beneficiary from the table does not affect funds already held for it.</p>
  <p>A beneficiary can also take what is held for it itself, by calling <code>claim</code> with an address to send it to. Only the caller's own held funds move, and the caller pays the gas, so the gas allowance below does not apply. This is the exit for a beneficiary that <code>release</code> can never pay.</p>
  <p>ETH is sent with a gas allowance of 100,000. A beneficiary that requires more than that to receive ETH is always held, and <code>release</code> cannot pay it at any gas limit, because the allowance is on the gas forwarded rather than on the limit the caller sets. Such a beneficiary is paid by <code>claim</code>.</p>

  <h2 id="s-change">Changing a distribution</h2>
  <p>The table, the description, the delay and the owner may each be changed. Each change is a separate proposal. An owner change is the one that is not finished when its proposal is applied: the address it names must also accept it.</p>
  <p>A proposed change is displayed as pending, with a countdown, beside the current table. When the countdown ends, anyone may apply it, for fourteen days. Until then the owner may cancel it, and the current configuration remains in force. No change applies automatically. A change nobody applies within those fourteen days expires: it can no longer be applied, and anyone may cancel it to clear the queue. Proposing it again starts a fresh delay.</p>
  <p>A change to the delay is itself subject to the current delay. Where the delay is zero, a change applies in the same transaction as its proposal.</p>
  <p>In a wallet, these operations appear as <code>propose</code>, <code>applyQueued</code> and <code>cancel</code>. An owner change adds <code>acceptOwnership</code>, the one operation the incoming owner signs; it is neither owner-only nor subject to the delay.</p>

  <h2 id="s-owner">Ownership</h2>
  <p>An owner change takes two steps. The owner proposes the new owner, and once the delay has passed anyone may apply that proposal — which only nominates the address. The owner keeps every power until the nominated address calls <code>acceptOwnership()</code>. Any wallet may send that call; only the nominee's succeeds, and it takes effect in that transaction. Acceptance also drops every change the previous owner had queued. Ownership is held separately on each chain.</p>
  <p>A nomination can be withdrawn until it is accepted: the owner proposes its own address, and applying that proposal clears the nomination. The owner may also cancel the original proposal before it is applied, as with any other change.</p>
  <p>The two steps leave different traces. Acceptance emits <code>OwnershipTransferred(previousOwner, newOwner)</code>. The nomination has no event of its own and travels in the calldata of the <code>Queued</code> event, so a transfer waiting to be accepted is read from <code>pendingOwner()</code>, which this page displays beside the owner.</p>
  <p>Transferring ownership to the zero address renounces it. That needs no acceptance, takes effect when the proposal is applied, and destroys a nomination in flight. Thereafter no change can be proposed. Renouncing also drops every change still queued, so the configuration is permanent from that transaction. A renounce emits <code>OwnershipTransferred(previousOwner, 0x0)</code>, so it leaves the same trace in the log that an acceptance does.</p>

  <h2 id="s-widget">The widget</h2>
  <p>The widget is a script that displays a distribution on any web page: its allocation, its beneficiaries, its owner, its delay and any pending change, read directly from the chain. It adopts the host page's font and text colour, and is available in a full and a compact form.</p>
  ${widgetDocs()}

  <h2 id="s-limits">Limits</h2>
  <p>The owner is trusted for the length of the delay. The contract protects beneficiaries against sudden changes; it does not protect them against the owner.</p>
  <p>A token that charges a fee on transfer delivers less than the table specifies.</p>
  <p>A token whose balance can fall on its own, such as a rebasing or slashable token, is not supported: under a shortfall the first account to take its escrow is paid in full and the last bears the loss.</p>
  <p>A beneficiary that requires more than 100,000 gas to receive ETH is always held.</p>
  <p>Funds held for a beneficiary that can never receive them remain in the contract permanently. This is by design: there is no sweep, and neither the owner nor anyone else can redirect them.</p>
  <p>Every address, share, name and note is public, and remains in the chain's history after it is changed. An allocation that must stay private, such as individual salaries, is not suited to a distribution.</p>
  <p>A contract that pays in with <code>transfer</code> or <code>send</code> fails while the implementation is cold, because the 2,300-gas stipend does not cover receipt: a cold receipt needs 4,162 gas. Pay in with <code>call</code> and forward the gas instead. The payment simply reverts, so nothing is lost.</p>
  <p>The contracts cannot be upgraded. A defect is remedied by deploying a new distribution.</p>
  <p>The contracts have not yet been audited. Security issues should be reported through the repository's <a href="${REPO}/security/advisories/new" target="_blank" rel="noopener noreferrer">advisory form</a>.</p>

  <h2 id="s-developers">For developers</h2>
  <p>The source is published at <a href="${REPO}" target="_blank" rel="noopener noreferrer">github.com/dnznlabs/rake</a> under the MIT licence. Both contracts reside in one file with no imports. Every function, event and error, and the <code>Snapshot</code> struct the widget reads, are documented in <a href="${REPO}/blob/main/docs/REFERENCE.md" target="_blank" rel="noopener noreferrer">docs/REFERENCE.md</a>. This page is itself served by the <code>html()</code> view of a contract; see <a href="#/docs#credits">credits</a>.</p>
  <div class="scroll"><table class="dtab"><tr><th>chain</th><th>factory</th><th>status</th></tr>${chainRows()}</table></div>
  </article></div>`;
  widgetDemo();
  giveBind();
}

/* The docs' live preview: the two variants of the real widget, mounted on whatever address the field
   holds, and every snippet above rewritten to match. It reads through the dev `?rpc=`, else the wallet
   as the landing's widget does — a page host's CSP can refuse a fetch to any endpoint, a wallet's
   reads it cannot — and the chain's public endpoint only for a visitor with no wallet. */
function widgetDemo() {
  const input = document.getElementById('wd-in'), res = document.getElementById('wd-res'), go = document.getElementById('wd-go');
  if (!input) return;
  const rpc = WRPC || (window.ethereum ? '' : PUBLIC_RPC[CFG.chainId] || ''), first = input.value;
  const show = async () => {
    const a = await addrField(input.value, res);
    if (!a) return;
    document.querySelectorAll('.wd-a').forEach(el => el.textContent = a);
    if (a !== first) document.getElementById('wd-what').textContent = 'the distribution previewed above';
    if (!rpc && !window.ethereum) { res.textContent = `the preview needs a wallet on ${cname(CFG.chainId)}`; return; }
    for (const v of ['full', 'compact']) {
      // A fresh element per mount: the widget keeps its state on the node it was given.
      const el = document.createElement('div');
      el.dataset.rake = a; el.dataset.chain = CFG.chainId; el.dataset.link = '';
      if (rpc) el.dataset.rpc = rpc;
      if (v === 'compact') el.dataset.variant = 'compact';
      const slot = document.getElementById('wd-' + v); slot.replaceChildren(el);
      window.RakeWidget.mount(el);
    }
  };
  go.onclick = show;
  input.onkeydown = e => { if (e.key === 'Enter') show(); };
  if (input.value) show();
}

/* `#/docs#<section>` scrolls to the matching `s-<section>` heading after the page is painted. The
   browser cannot do it: the hash's own fragment is `/docs#<section>`, which is no element's id, and
   the headings do not exist until docs() has run. */
function docScroll(h) {
  const el = h[6] === '#' ? document.getElementById('s-' + h.slice(7)) : null;
  if (el) el.scrollIntoView(); else scrollTo(0, 0);
}
/* #243 part 2, the other half of the stamp. One control for the whole page, because one read repaints
   every section of it, and its state is the route's read rather than anything a view has to track:
   `BUSY` is the promise the route itself returns, so the button says `reading…` for exactly as long
   as that route's own `await`s are outstanding, and a read that has since been superseded cannot
   restore the button under the one that replaced it.
   The rejection is passed on rather than swallowed: a view whose read throws reported that before
   this control existed, and it still has to. */
let BUSY = null;
function track(p) {
  BUSY = p;
  const b = document.getElementById('refresh');
  if (b) { b.disabled = true; b.classList.add('on'); }
  const end = () => {
    if (BUSY !== p) return;
    const el = document.getElementById('refresh');
    if (el) { el.disabled = false; el.classList.remove('on'); }
  };
  p.then(end, e => { end(); return Promise.reject(e); });
}

  if (wrongChain()) { V.innerHTML = notice(`Your wallet is on ${cname(CHAIN)}. This app lives on ${cname(CFG.chainId)}. <button id="sw">Switch network</button>.`); document.getElementById('sw').onclick = switchChain; return; }
  if (S.error) { V.innerHTML = notice(`could not read the factory at ${CFG.factory}: ${esc(S.error)}`, 'err'); return; }
  if (!S.loaded) return;
  scrollTo(0, 0);
  if (h === '#/create') { createView(); return; }
  const at = h.match(/^#\/distros\/(0x[0-9a-fA-F]{40})$/);
  if (at) { track(detail(Eth.checksum(at[1]))); return; }
  if (h.startsWith('#/distros')) { track(list()); return; }
  track(landing());
}
addEventListener('hashchange', route);
document.getElementById('refresh').onclick = () => route();
const tb = document.getElementById('theme-btn'), tm = document.getElementById('theme-menu'), wm = document.getElementById('who-menu'), nm = document.getElementById('net-menu');
const menus = [tm, wm, nm], toggle = m => menus.forEach(x => x.hidden = x === m ? !x.hidden : true);
tb.onclick = e => { e.stopPropagation(); toggle(tm); const t = localStorage.getItem('theme') || 'system'; tm.querySelectorAll('div').forEach(d => d.className = d.dataset.t === t ? 'on' : ''); };
tm.onclick = e => { const t = e.target.dataset.t; if (!t) return; localStorage.setItem('theme', t); const d = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme:dark)').matches); document.documentElement.className = d ? 'dark' : ''; tm.hidden = true; };
wm.onclick = e => { if (e.target.dataset.a === 'off') { wm.hidden = true; disconnect(); } };
document.getElementById('net').onclick = e => { e.stopPropagation(); toggle(nm); };
nm.onclick = e => { e.stopPropagation(); if (e.target.dataset.a === 'switch') switchChain(); };
document.addEventListener('click', () => toggle(null)); document.addEventListener('keydown', e => { if (e.key === 'Escape') toggle(null); });

(async () => {
  await discover();
  if (P) { try { await load(); } catch (e) { S.error = (e && e.message) || String(e); } }
  who(); route();
})();
</script>
