<style>
:root{--paper:#FCFCFA;--ink:#161616;--muted:#6F6F6B;--dim:#A3A39E;--rule:#DCDCD7;--t1:#2E6379;--t2:#618999;--t3:#95B0BA;--amber:#B8741A;--err:#B23A2E;

[data-theme=dark]{--paper:#111311;--ink:#ECECE6;--muted:#8A8A85;--dim:#5C5E5A;--rule:#2E302E;--t1:#3F87A6;--t2:#6AA0B6;--t3:#95B9C6;--amber:#CE9640;--err:#D06456}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink)}
body{font:13px/1.5 var(--mono)}
a{color:inherit;text-decoration:none;border-bottom:1px solid var(--dim)}

button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}
input,textarea{font:13px var(--mono);color:var(--ink);background:var(--paper);border:1px solid var(--rule);padding:11px 13px;width:100%}
input:focus,textarea:focus{outline:2px solid var(--t1);outline-offset:-1px;border-color:var(--ink)}
::placeholder{color:var(--dim)}
.wrap{max-width:960px;margin:0 auto;padding:0 40px}
.eyebrow{font:600 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

.prose{font:15px/1.65 var(--sans);text-wrap:pretty;max-width:56ch}
.mutd{color:var(--muted)}.dim{color:var(--dim)}.amber{color:var(--amber)}.err{color:var(--err)}.acc{color:var(--t1)}
.btn{display:inline-block;background:var(--ink);color:var(--paper);padding:11px 20px;font:13px var(--mono);border:1px solid var(--ink)}
.btn:hover{background:var(--t1);border-color:var(--t1);color:#FCFCFA}
.btn-ghost{display:inline-block;background:none;color:var(--ink);padding:10px 20px;border:1px solid var(--ink);font:13px var(--mono)}
.btn-ghost:hover{color:var(--t1);border-color:var(--t1)}
.btn-sm{padding:6px 14px;font-size:11.5px}
.btn[disabled],.btn-ghost[disabled]{border-color:var(--rule);background:none;color:var(--dim);cursor:not-allowed}
/* nav */
.nav{border-bottom:1px solid var(--rule);max-width:960px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:16px 40px;gap:14px}
.brand{display:flex;align-items:center;gap:10px;border:none}
.brand b{font-size:14px;letter-spacing:.04em}
.brand .sub{font-size:10px;letter-spacing:.12em;color:var(--dim)}
.navr{display:flex;align-items:center;gap:16px;font-size:12px}
.navlink{border:none;padding-bottom:2px}
.navlink.on{font-weight:700;border-bottom:2px solid var(--ink)}
.ctl{display:flex;align-items:center;gap:7px;border:1px solid var(--rule);padding:6px 10px;position:relative}
.ctl:hover{border-color:var(--ink)}
.menu{position:absolute;top:calc(100% + 6px);right:-1px;min-width:150px;background:var(--paper);border:1px solid var(--ink);z-index:30;font-size:12px}
.mi{display:flex;align-items:center;gap:9px;padding:9px 12px;width:100%;text-align:left}
.mi:hover{background:var(--rule)}
.mi.on{background:var(--ink);color:var(--paper)}
.mhead{border-top:1px solid var(--rule);padding:7px 12px 3px;font:600 10px var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--dim)}
.wallet{border-color:var(--ink)}

.bar{display:flex;overflow:hidden}
.seg{transition:flex-basis .25s ease}
.seg.s0{background:var(--t1)}.seg.s1{background:var(--t2)}.seg.s2{background:var(--t3)}
.seg.rest{background:repeating-linear-gradient(45deg,var(--rule) 0 5px,transparent 5px 10px)}

.pbar{display:flex;gap:3px}
.pbar .pseg{border:1.5px solid var(--amber)}
.pticks{display:flex;gap:3px;color:var(--amber)}
.pticks .tick{border-color:var(--amber);color:var(--amber)}
.pticks .nm{color:var(--amber);opacity:.75}

.ledger{border-top:1px solid var(--ink)}
.lrow{display:grid;grid-template-columns:1fr auto;gap:2px 20px;padding:12px 0;border-bottom:1px solid var(--rule);align-items:baseline}

.tabs{display:flex;gap:24px;font-size:12.5px;border-bottom:1px solid var(--rule)}
.tab{padding:0 2px 10px;color:var(--muted);border:none}
.tab.on{color:var(--ink);font-weight:700;border-bottom:2px solid var(--ink);margin-bottom:-1px}
.list-row{display:grid;grid-template-columns:1fr auto auto;gap:4px 18px;align-items:center;padding:13px 0 13px 12px;border-bottom:1px solid var(--rule);width:100%;text-align:left;border-left:2px solid transparent}
.list-row:hover{border-left-color:var(--dim)}
.list-row.on{border-left-color:var(--ink)}
.mini{display:flex;height:6px;width:120px}
.dot{width:8px;height:8px;background:var(--amber)}
.hist{border-top:1px solid var(--rule)}
.hrow{display:grid;grid-template-columns:92px 1fr auto;gap:14px;padding:9px 0;border-bottom:1px solid var(--rule);font-size:12px;align-items:center}

/* forms */
.field{margin-bottom:22px;max-width:520px}

.help{font:12px/1.5 var(--sans);color:var(--dim);margin-top:6px}
.res{font-size:12px;color:var(--muted);margin-top:6px;min-height:16px}
.seg3{display:flex;border:1px solid var(--rule);max-width:400px;font-size:12px}
.seg3 button{flex:1;padding:8px 0;text-align:center;color:var(--muted);border-left:1px solid var(--rule)}
.seg3 button:first-child{border-left:none}
.seg3 button.on{background:var(--ink);color:var(--paper)}
.erow{display:grid;grid-template-columns:140px 1fr 170px 84px 24px;gap:10px;align-items:start;padding:10px 0;border-bottom:1px solid var(--rule)}
.erow input{padding:9px 11px;font-size:12px}
.erow .note-in{font-family:var(--sans);color:var(--muted)}
.erow .bps{font-weight:700;font-size:15px;text-align:right}
.erow .rm{color:var(--dim);font-size:14px;padding-top:10px}
.erow .rm:hover{color:var(--err)}
.sum{display:flex;justify-content:space-between;align-items:center;padding:13px 0}
.drawer{border-top:2px solid var(--ink);background:var(--paper);padding:26px 0 8px;margin-top:34px}
code,pre{font-family:var(--mono)}
pre{border:1px solid var(--rule);padding:14px 16px;font-size:12px;line-height:1.7;overflow:auto;margin:0}

.docgrid{max-width:960px;margin:0 auto;display:grid;grid-template-columns:170px 1fr;gap:40px;padding:34px 40px 60px}

.doc{max-width:720px;min-width:0}

.ftab{border-top:1px solid var(--ink);font-size:12px}

/* ── SEGMENT:core · styles resume ── */
footer{margin-top:64px}
.foot{border-top:1px solid var(--rule);max-width:960px;margin:0 auto;display:flex;justify-content:space-between;gap:8px;padding:16px 40px;font-size:11px;color:var(--dim)}
.herogrid{display:grid;grid-template-columns:minmax(0,56ch) 1fr;gap:56px;align-items:center}
.herograph{display:grid;gap:14px}
.verbs{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;border-top:1px solid var(--rule);margin-top:14px;padding:20px 0 8px}
.verbs b{display:block;font:700 13.5px var(--mono);margin:12px 0 6px}

.gov{border-top:1px solid var(--ink);margin-top:26px;padding-top:16px}
.sechead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px;gap:12px}
.sechead b{font-size:13px}
.sechead span{font:11.5px var(--sans);color:var(--dim);text-align:right}
.chip{border:1px solid var(--rule);padding:2px 7px;font-size:10.5px;color:var(--muted);margin-left:6px}
.snippet{margin-top:14px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
@media (max-width:560px){
 .wrap{padding:0 20px}
 .nav{padding:12px 20px;flex-wrap:wrap}
 .brand .sub{display:none}
 .navr{gap:10px;font-size:11.5px}
 .h1{font-size:30px}
 .verbs{grid-template-columns:1fr}
 .docgrid{grid-template-columns:1fr;padding:24px 20px 40px}
 .rail{position:static;display:flex;flex-wrap:wrap;gap:2px 14px;line-height:1.8;border-bottom:1px solid var(--rule);padding-bottom:10px}
 .erow{grid-template-columns:1fr 1fr;grid-auto-rows:auto}
 .foot{flex-direction:column;padding:14px 20px}
 .ctas{flex-direction:column}
 .herogrid{grid-template-columns:1fr}
 .herograph{display:none}
 .ctas .btn,.ctas .btn-ghost{text-align:center}
}
</style>

/* ---------- state ---------- */
const S = { wallet:null, net:'ethereum', tab:'recent', sel:null, drawer:false, draft:null, embed:false };
const store = {get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
function recents(){try{return JSON.parse(store.get('rake.recent')||'[]')}catch(e){return[]}}
function addRecent(a){const r=recents().filter(x=>x!==a);r.unshift(a);store.set('rake.recent',JSON.stringify(r.slice(0,8)))}
/* ---------- utils ---------- */
const $ = s=>document.querySelector(s);
const esc = s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const short = a=>a.slice(0,6)+'…'+a.slice(-4);
const nameOf = a=>NAMES[a]||null;
const addrLine = a=>esc(short(a))+(nameOf(a)?' · '+esc(nameOf(a)):'');
function fmtDelay(ms){if(!ms)return 'none — applies instantly';const d=Math.floor(ms/DAYS),h=Math.round(ms%DAYS/HRS);return d?d+' day'+(d>1?'s':'')+(h?' '+h+'h':''):h+'h'}
function fmtEta(eta){const ms=eta-Date.now();if(ms<=0)return null;const d=Math.floor(ms/DAYS),h=Math.floor(ms%DAYS/HRS),m=Math.floor(ms%HRS/6e4);return d?d+'d '+h+'h':(h?h+'h '+m+'m':m+'m')}
function explorer(){return {ethereum:'etherscan',base:'basescan',arbitrum:'arbiscan','op mainnet':'optimistic.etherscan',sepolia:'sepolia.etherscan','base sepolia':'sepolia.basescan'}[S.net]||'etherscan'}
/* ---------- bar builders ---------- */
function barHTML(table, h, extra){
 let rest=10000-table.reduce((s,b)=>s+b.bps,0), segs=table.map((b,i)=>'<div class="seg s'+(i%3)+'" style="flex:0 0 '+(b.bps/100)+'%" title="'+esc(b.name)+' '+(b.bps/100)+'%"></div>').join('');
 if(rest>0)segs+='<div class="seg rest" style="flex:0 0 '+(rest/100)+'%" title="unassigned '+(rest/100)+'%"></div>';
 return '<div class="bar" style="height:'+h+'px" '+(extra||'')+'>'+segs+'</div>';
}
function ticksHTML(table, opts){
 opts=opts||{};let rest=10000-table.reduce((s,b)=>s+b.bps,0);
 const cols=table.map(b=>'<div class="tick" style="flex:0 0 '+(b.bps/100)+'%"><b>'+(b.bps/100)+'%</b> <span class="nm">'+esc(b.name)+'</span>'+(opts.notes&&b.note?'<div class="nt">'+esc(b.note)+'</div>':'')+(opts.addr?'<div class="ad">'+addrLine(b.account)+'</div>':'')+'</div>').join('');
 const restCol=rest>0?'<div class="tick" style="flex:0 0 '+(rest/100)+'%"><b class="dim">'+(rest/100)+'%</b></div>':'';

function resolveName(v, cb){
 v=v.trim();
 if(/^0x[0-9a-fA-F]{40}$/.test(v))return cb({ok:true,addr:v});
 if(/\.(eth|wei|gwei)$/.test(v)){
  cb({busy:true});
  setTimeout(()=>{ if(v==='down.wei')return cb({unreachable:true});
   const hit=Object.keys(NAMES).find(a=>NAMES[a]===v);
   cb(hit?{ok:true,addr:hit,name:v}:{notfound:true}); },600);
  return;
 }
 cb(v?{invalid:true}:{});
}

const SECTIONS=[['abstract','Abstract'],['motivation','Motivation'],['how','How it works'],['reference','Contract reference'],['table','The table'],['timelock','The timelock'],['escrow','Push, escrow, release'],['deploy','Deployment'],['widget','The widget'],['security','Security'],['source','Source'],['lineage','Lineage']];
function vDocs(){
 return '<div class="docgrid"><nav class="rail" aria-label="sections"><div class="eyebrow" style="font-size:10px;margin-bottom:6px;line-height:1.4">sections</div>'
 +SECTIONS.map(s=>'<a href="#/docs" data-sec="'+s[0]+'">'+s[1].toLowerCase()+'</a>').join('')+'</nav>'
 +'<article class="doc"><div class="eyebrow dim" style="margin-bottom:10px">docs · v0.1 draft · 2026-08</div><h1>Rake Distro</h1>'
 +'<h2 id="s-abstract">Abstract</h2><p>A distribution is a contract address that splits whatever it receives across a published table of beneficiaries, denominated in basis points. Anyone can trigger the split; only the owner can change the table, and every change waits out a public delay before it takes effect. The table, its labels, and any queued changes are readable in one call, so any interface — including the one serving this page — renders them without an indexer.</p>'
 +'<h2 id="s-motivation">Motivation</h2><p>Fees are suspicious by default: the paragraph explaining where they go can change silently. The incumbent answer grew into an on-chain banking product; integrators need the primitive underneath — one address, one table, one delay. Rake Distro is that primitive and nothing else. It takes no fee, has no admin keys, no upgrade path, and no dependency on any DNZN infrastructure.</p>'
 +'<h2 id="s-how">How it works</h2><p>Four verbs cover the lifecycle. <b style="font-family:var(--mono);font-size:13.5px">receive</b> — tokens accumulate at the address; the receive path stays under the 2,300-gas stipend and never pushes. <b style="font-family:var(--mono);font-size:13.5px">distribute</b> — anyone splits the unreserved balance by the table. <b style="font-family:var(--mono);font-size:13.5px">queue</b> — the owner stages a change in public (contract: <code>propose(bytes)</code>). <b style="font-family:var(--mono);font-size:13.5px">apply</b> — anyone lands it after the delay. Pass-through behaviour is the payer calling <code>distribute</code> in the same transaction.</p>'
 +figSeq()
 +'<h2 id="s-reference">Contract reference</h2>'
 +'<div style="display:grid;grid-template-columns:1.4fr .7fr 2fr;gap:12px;font:600 10.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--dim);padding-bottom:7px"><span>function</span><span>caller</span><span>effect</span></div>'
 +'<div class="ftab">'
 +[['distribute(token)','anyone','splits the unreserved balance by the table; failed pushes escrow'],
   ['propose(action)','owner','queues a change — the UI verb "queue" · eta = now + delay'],
   ['apply(action, nonce)','anyone','executes a queued action once its eta has passed'],
   ['cancel(hash)','owner','withdraws a queued action; immediate'],
   ['release(token, account)','anyone','retries an escrowed share'],
   ['snapshot()','view','everything a renderer needs, in one call — the widget\'s whole data contract']].map(r=>'<div><span class="fn">'+r[0]+'</span><span class="who">'+r[1]+'</span><span class="fx">'+r[2]+'</span></div>').join('')+'</div>'
 +'<div style="display:flex;gap:30px;margin:18px 0 22px;font-size:11.5px;flex-wrap:wrap"><div><div class="eyebrow" style="font-size:10.5px;color:var(--dim);margin-bottom:5px">events</div><div class="mutd" style="line-height:1.9">Received · Distributed · Escrowed · Released<br>Queued · Applied · Cancelled</div></div><div><div class="eyebrow" style="font-size:10.5px;color:var(--dim);margin-bottom:5px">errors</div><div class="mutd" style="line-height:1.9">NotOwner · BadTable · NotReady<br>NothingToDo · Locked</div></div></div>'
 +'<div class="eyebrow" style="font-size:10.5px;color:var(--dim);margin-bottom:6px">the snapshot struct — verbatim; what the widget reads</div>'
 +'<pre>struct Beneficiary { address account; uint96 bps; string name; string note; }\nstruct Pending     { bytes32 hash; uint256 eta; bytes action; }\nstruct Snapshot {\n    address owner; uint32 delay; uint32 nonce; string description;\n    Beneficiary[] table; Pending[] pending;\n}</pre>'
 +'<h2 id="s-table">The table</h2><p>Shares are basis points and must sum to 10,000; the last recipient takes the integer remainder of each split, so there is no dust. The table is strictly ascending by address, which deduplicates for free — a consequence worth stating twice: "last" is by address order, not list order. Each row carries a <code>name</code> and <code>note</code> on-chain; interfaces may overlay resolved names, but the labels are the distribution\'s own.</p>'
 +'<h2 id="s-timelock">The timelock</h2><p>Every owner action goes through one mechanism: <code>propose</code> → <code>queued[hash(action, nonce)] = eta</code> → permissionless <code>apply</code> → self-call to an <code>onlySelf</code> setter (<code>setBeneficiaries</code>, <code>setDescription</code>, <code>setDelay</code>, <code>transferOwnership</code>). No setter is reachable any other way — including the one that changes the delay itself. <code>cancel</code> is owner-only and immediate. <code>delay = 0</code> is allowed, executes inline, and is flagged in every interface. Renouncing transfers ownership to nobody: the table is provably frozen.</p>'
 +figState()
 +'<h2 id="s-escrow">Push, escrow, release</h2><p>Each share is pushed with a fixed gas allowance (<code>PUSH_GAS</code>). If a push fails, that share is escrowed for its beneficiary and the rest still go out; <code>release(token, account)</code> retries at any time, callable by anyone. A <code>reserved[token]</code> total keeps escrowed funds out of the next split. A beneficiary that needs more than the allowance on receive is always escrowed, never paid directly. Tokens that return nothing from <code>transfer</code> (mainnet USDT) are tolerated.</p>'
 +'<h2 id="s-deploy">Deployment</h2><p>A factory deploys PUSH0 minimal-proxy clones via CREATE2 with a sender-bound salt, so an address can be computed — and funded — before it is deployed, and the same address can be claimed on every chain. Neither the factory nor the implementation can receive ETH; stray sends revert rather than lock. <code>init</code> is factory-only.</p>'
 +'<div class="chains"><div style="font:600 10.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--dim);border:none"><span>chain</span><span>factory</span><span>status</span></div>'
 +['ethereum','base','arbitrum','op mainnet','sepolia','base sepolia'].map(c=>'<div><span>'+c+'</span><span class="dim">—</span><span class="dim">not deployed</span></div>').join('')+'</div>'
 +'<h2 id="s-widget">The widget</h2><p>A drop-in script renders any distribution next to the fee it explains. It reads <code>snapshot()</code> and nothing else — no logs, no indexer. Font comes from the host; ink from <code>currentColor</code>; rules and muted text are derived from it at reduced opacity. The only fixed colors are the bar\'s segment tints and the pending amber. Full and compact variants; loading and failure states degrade quietly without touching the host page.</p>'
 +'<pre>&lt;script src="https://rake.distro/widget.js"&gt;&lt;/script&gt;\n&lt;div data-rake="0x1d2F…a3C9" data-chain="1"&gt;&lt;/div&gt;</pre>'
 +'<h2 id="s-security">Security</h2><p>Trust model: the owner is trusted <em>over a delay</em>. The contract protects beneficiaries from surprise, not from the owner; what the owner is — EOA, multisig, DAO — is out of scope, though the interface surfaces it. Known limitations: fee-on-transfer tokens settle by balance, so per-beneficiary amounts can differ from <code>amount × bps / 10000</code>; a recipient consuming more than <code>PUSH_GAS</code> is always escrowed; contracts are immutable — bugs are mitigated by redeploy, never upgrade.</p>'
 +'<div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:12px;font:600 10.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--dim);padding-bottom:7px"><span>date</span><span>auditor</span><span>scope</span><span>findings</span></div>'
 +'<div class="ftab" style="font-size:12px"><div style="grid-template-columns:1fr 1fr 1fr 1fr"><span class="dim">—</span><span class="dim">none yet — planned pre-launch</span><span class="dim">—</span><span class="dim">—</span></div></div>'
 +'<p style="margin-top:14px">Report privately to security@dnzn.dev. No bounty program yet; serious reports are taken seriously.</p>'
 +'<h2 id="s-source">Source</h2><p>MIT. Single-file contract, no imports, dense comments. The dapp you are reading is returned by a renderer contract\'s <code>html()</code> view and mirrored at dnzn.dev and IPFS; verify a clone by comparing its runtime bytecode against the factory\'s recorded implementation.</p>'
 +'<h2 id="s-lineage">Lineage</h2><p>The timelock-as-<code>queued[hash]</code>, <code>onlySelf</code> configuration, PUSH0 clones, and sender-bound CREATE2 salt are lifted from multisig.software (Src Co / z0r0z), whose single-file, audit-first ethos this project inherits. Low-level patterns follow Solady. Splits defined the category this primitive returns to.</p>'
 +'</article></div>';

/* ═══ SEGMENT:core resumes (Render) ═══ */
/* ---------- router & render ---------- */
function route(){const h=location.hash||'#/';
 if(h.startsWith('#/distros/')){const a=decodeURIComponent(h.slice(10));if(DISTROS[a]){S.sel=a;addRecent(a)}return 'distros'}
 if(h.startsWith('#/distros'))return 'distros';
 if(h.startsWith('#/docs'))return 'docs';
 if(h.startsWith('#/create'))return 'create';
 return 'landing';
}
function render(goTop){
 const r=route(),app=$('#app');
 $('#nl-distros').classList.toggle('on',r==='distros');
 $('#nl-docs').classList.toggle('on',r==='docs');
 if(r==='landing')app.innerHTML=vLanding();
 else if(r==='distros')app.innerHTML=vDistros();
 else if(r==='docs')app.innerHTML=vDocs();
 else if(r==='create')app.innerHTML=vCreate();
 bindView(r);
 if(goTop)window.scrollTo(0,0);
}
function bindLoad(){
 const go=$('#loadGo'),inp=$('#loadIn'),res=$('#loadRes');
 if(!go)return;
 const run=()=>{const v=inp.value.trim();res.textContent='';res.style.color='var(--dim)';
  resolveName(v,r=>{
   if(r.busy){res.textContent='resolving on mainnet…';return}
   if(r.ok){const hit=DISTROS[r.addr]?r.addr:(Object.keys(DISTROS).find(k=>k.toLowerCase()===String(r.addr).toLowerCase())||null);
    if(hit){location.hash='#/distros/'+hit}else{res.textContent='could not read distribution '+short(r.addr)+' on '+S.net+' · retry';res.style.color='var(--err)'}return}
   if(r.notfound){res.textContent='no such name on mainnet';res.style.color='var(--err)'}
   else if(r.unreachable){res.textContent='mainnet didn\'t answer — retry, or paste a raw address';res.style.color='var(--amber)'}
   else if(r.invalid){res.textContent='not an address or a name';res.style.color='var(--err)'}
  })};
 go.addEventListener('click',run);
 inp.addEventListener('keydown',e=>{if(e.key==='Enter')run()});
}
function bindView(r){
 bindLoad();
 if(r==='distros'){
  document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{const t=b.dataset.tab;if(!S.wallet&&t!=='recent')return;S.tab=t;S.sel=null;S.drawer=false;S.embed=false;render()}));
  document.querySelectorAll('[data-open]').forEach(b=>b.addEventListener('click',()=>{S.sel=b.dataset.open;S.drawer=false;S.embed=false;addRecent(S.sel);render()}));
  const d=S.sel&&DISTROS[S.sel]?DISTROS[S.sel]:listFor(S.tab)[0];
  if(!d)return;
  document.querySelectorAll('[data-cancel]').forEach(b=>b.addEventListener('click',()=>{d.pending.splice(+b.dataset.cancel,1);d.changes.unshift({v:'cancelled',w:'table · withdrawn by owner before landing',t:'just now'});render()}));
  document.querySelectorAll('[data-apply]').forEach(b=>b.addEventListener('click',()=>{const p=d.pending.splice(+b.dataset.apply,1)[0];if(p&&p.table)d.table=p.table.map(x=>({note:'',...x}));d.changes.unshift({v:'applied',w:'table · applied by '+(S.wallet?(nameOf(S.wallet)||short(S.wallet)):'anyone'),t:'just now'});render()}));
  const dis=document.querySelector('[data-distribute]');
  if(dis)dis.addEventListener('click',()=>{if(!d.balances.length)return;d.activity.unshift({v:'distributed',w:d.balances.map(b=>b[1]+' '+b[0]).join(' + ')+' → '+d.table.length+' beneficiaries · called by '+(S.wallet?(nameOf(S.wallet)||short(S.wallet)):'you'),t:'just now'});d.balances=[];render()});
  const q=document.querySelector('[data-queue]');
  if(q)q.addEventListener('click',()=>{S.drawer=true;S.draft={rows:d.table.map(b=>({name:b.name,note:b.note||'',addr:b.account,pct:String(b.bps/100)}))};render();const el=$('#drawer');if(el)el.tabIndex=-1,el.focus({preventScroll:false})});
  const em=document.querySelector('[data-embed]');
  if(em)em.addEventListener('click',()=>{S.embed=!S.embed;render()});
  const cs=document.querySelector('[data-copysnip]');
  if(cs)cs.addEventListener('click',()=>{const p=$('#snipPre');if(p&&navigator.clipboard)navigator.clipboard.writeText(p.textContent).catch(()=>{});cs.textContent='copied ✓';setTimeout(()=>{cs.textContent='copy'},1200)});
  if(S.drawer){
   bindDrawer(d);
   document.querySelectorAll('[data-rm]').forEach(b=>b.addEventListener('click',()=>{S.draft.rows.splice(+b.dataset.rm,1);render()}));
   const ar=document.querySelector('[data-addrow]');
   if(ar)ar.addEventListener('click',()=>{S.draft.rows.push({name:'',note:'',addr:'',pct:''});render()});
   const sq=document.querySelector('[data-submitq]');
   if(sq)sq.addEventListener('click',()=>{if(sq.hasAttribute('disabled'))return;
    d.pending.push({eta:Date.now()+d.delay,kind:'table',table:S.draft.rows.map(r=>({account:r.addr,bps:Math.round(parseFloat(r.pct)*100),name:r.name,note:r.note}))});
    S.drawer=false;render()});
   const cd=document.querySelector('[data-calldata]');
   if(cd)cd.addEventListener('click',()=>{if(navigator.clipboard)navigator.clipboard.writeText('0x8f2a4c1e'+A.D1.slice(2)).catch(()=>{});cd.textContent='copied';setTimeout(()=>{cd.textContent='copy calldata'},1200)});
  }
 }
 if(r==='create'){
  const D=S.draft;
  if(D.step===1){
   const desc=$('#c-desc'),own=$('#c-owner'),gv=$('#c-gov'),ab=$('#c-about'),dl=$('#c-delay');
   desc.addEventListener('input',()=>D.desc=desc.value);
   gv.addEventListener('input',()=>D.gov=gv.value);
   ab.addEventListener('input',()=>D.about=ab.value);
   dl.addEventListener('input',()=>D.delay=dl.value);
   own.addEventListener('input',()=>{const res=$('#c-ownerres');resolveName(own.value,x=>{D.ownerR=x;
    res.textContent=x.busy?'resolving on mainnet…':x.ok?('→ '+short(x.addr)+(nameOf(x.addr)?' · resolved on mainnet':'')):x.notfound?'no such name on mainnet':x.unreachable?'mainnet didn\'t answer — retry, or paste a raw address':x.invalid?'not an address or a name':'';
    res.style.color=x.notfound?'var(--err)':x.unreachable?'var(--amber)':'var(--muted)';});});
   document.querySelectorAll('[data-kind]').forEach(b=>b.addEventListener('click',()=>{D.kind=b.dataset.kind;render()}));
   $('#c-next').addEventListener('click',()=>{D.step=2;render()});
  }else{
   document.querySelectorAll('[data-dr]').forEach(inp=>inp.addEventListener('input',()=>{
    const i=+inp.dataset.i;D.rows[i][inp.dataset.dr]=inp.value;
    if(inp.dataset.dr==='addr'){const rEl=document.querySelector('[data-res="'+i+'"]');resolveName(inp.value,x=>{if(!rEl)return;
     rEl.textContent=x.busy?'resolving…':x.ok?('→ '+short(x.addr)):x.notfound?'no such name':x.unreachable?'mainnet didn\'t answer':'';
     rEl.style.color=x.notfound?'var(--err)':x.unreachable?'var(--amber)':'var(--muted)';
     if(x.ok)D.rows[i].addr=x.addr;refreshCreate();});}
    refreshCreate();}));
   document.querySelectorAll('[data-rm]').forEach(b=>b.addEventListener('click',()=>{D.rows.splice(+b.dataset.rm,1);render()}));
   const ar=document.querySelector('[data-addrow]');
   if(ar)ar.addEventListener('click',()=>{D.rows.push({name:'',note:'',addr:'',pct:''});render()});
   $('#c-back').addEventListener('click',()=>{D.step=1;render()});
   document.querySelectorAll('[data-tip]').forEach(b=>b.addEventListener('click',()=>{D.tip=+b.dataset.tip;render()}));
   const dep=$('#c-deploy');
   if(dep)dep.addEventListener('click',()=>{if(dep.hasAttribute('disabled'))return;
    const addr='0xA11c'+A.D3.slice(6);
    let ms=0;const m=String(D.delay).trim().match(/^(\d+)\s*([dh]?)$/i);
    if(m)ms=+m[1]*(m[2].toLowerCase()==='h'?HRS:DAYS);
    DISTROS[addr]={addr,chains:[S.net],description:D.desc||'untitled',owner:(D.ownerR&&D.ownerR.addr)||S.wallet||A.MSIG,ownerKind:D.kind,govUrl:D.gov,about:D.about,delay:ms,tip:D.tip||0,
     table:D.rows.map(r=>({account:r.addr,bps:Math.round(parseFloat(r.pct)*100),name:r.name,note:r.note})),
     pending:[],balances:[],changes:[],activity:[]};
    S.draft=null;S.sel=addr;S.tab=S.wallet?'mine':'recent';addRecent(addr);location.hash='#/distros/'+addr});
   function refreshCreate(){
    const rows=D.rows,total=draftTotal(rows),ok=Math.abs(total-100)<0.001&&rows.every(r=>r.name&&r.addr);
    const bar=$('#liveBar');
    if(bar){const t=rows.filter(r=>(parseFloat(r.pct)||0)>0);const rest=100-total;
     bar.innerHTML=t.map((r,i)=>'<div class="seg s'+(i%3)+'" style="flex:0 0 '+(parseFloat(r.pct)||0)+'%"></div>').join('')+(rest>0.001?'<div class="seg rest" style="flex:0 0 '+rest+'%"></div>':'')}
    const sum=document.querySelector('.sum span');
    if(sum){sum.style.color=ok?'var(--t1)':'var(--err)';sum.innerHTML=rows.length+' beneficiar'+(rows.length===1?'y':'ies')+' · total <b>'+(+total.toFixed(2))+'%</b>'}
    const dp=$('#c-deploy');if(dp){if(ok)dp.removeAttribute('disabled');else dp.setAttribute('disabled','')}
    const msg=dp&&dp.nextElementSibling;
    if(msg){msg.style.color=ok?'var(--dim)':'var(--err)';msg.textContent=ok?'one transaction per chain':(Math.abs(total-100)>=0.001?'total must equal 100% — '+(+Math.abs(100-total).toFixed(2))+'% '+(total<100?'unassigned':'over'):'every row needs a name and address')}
   }
  }
 }
 if(r==='docs'){
  document.querySelectorAll('[data-sec]').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();
   const el=document.getElementById('s-'+a.dataset.sec);
   if(el){const y=el.getBoundingClientRect().top+window.scrollY-16;window.scrollTo({top:y,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'})}}));
 }
}
/* countdown refresh */
setInterval(()=>{if(route()==='distros'&&!S.drawer)render()},60e3);
window.addEventListener('hashchange',()=>{S.drawer=false;S.embed=false;if(route()!=='create')S.draft=null;render(true)});
/* boot */
applyTheme(themeMode());
buildNetMenu();buildWalMenu();walletLabel();
if(!recents().length)addRecent(A.D1);
render(true);
</script>
</body>
</html>
